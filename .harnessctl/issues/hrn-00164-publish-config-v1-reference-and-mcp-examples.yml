    "body": "Published complete Config v1 operator documentation from generated schema/defaults. Added explicit version 1/manual rewrite/no compatibility guidance; every field/default and naming/reserved-ID constraint; credential-safe known/custom URL/command MCP examples without harness transport discriminator; OpenCode/Pi inference; optional `mcpName`; lifecycle/credential boundaries; exact provenance-backed management versus permanent operator ownership, force behavior, warnings, unapplied intent, and remediation; custom Documents roots; `skills.tdd`; initial stable-release notes and evidence matrix. Corrected Plan template to compile configured `skills.documents.root` for OpenCode/Pi and added all-host regressions. Focused checks passed: 180 Python tests, 33 TypeScript tests, contract drift, format/lint, and `git diff --check`. Independent review round 3: no findings. Complete Verify suite/package builds/release evidence were intentionally not run in Build."
