"body": "# Publish Config v1 reference and MCP examples\n\n## Objective\n\nMake harnessctl's first stable Config v1 contract executable for operators and verifiable across both runtimes through a complete reference, safe examples, initial-release guidance, and evidence requirements.\n\n## Scope\n\n- Document every Config v1 field and default.\n- Replace unreleased Config v2/v3 documentation and examples with the stable v1 contract.\n- State that development Config v2/v3 files require manual rewrite and have no compatibility or automatic migration path.\n- Provide credential-safe examples for known MCP integrations and custom URL/command declarations.\n- State MCP lifecycle, credential, and adopt-on-edit ownership boundaries.\n- Document initial stable-release notes and the cross-runtime fixture/evidence matrix.\n\n## Acceptance Criteria\n\n- Every canonical Config v1 field and default is documented from the generated contract.\n- No documentation presents Config v2/v3 as a released or supported contract.\n- Development rewrite guidance clearly requires explicit `version: 1` and states that no automatic migration exists.\n- Examples use environment references or placeholders and contain no credentials.\n- MCP examples omit transport/type and explain that host adapters infer it during compilation.\n- Documentation states that operator-owned host entries are preserved and may leave declared intent unapplied.\n- Verify requirements include Python tests, generic-tools tests/typecheck/build, generation drift, package artifact/fingerprint checks, and shared fixture comparison.\n\n## Dependencies\n\nDepends on `hrn-00161`, `hrn-00162`, and `hrn-00163`.\n\n## Artifacts\n\nUses approved Config v1 successors of `doc-00015` and `doc-00016`.\n\n## Estimate\n\nM.\n\n## Non-Goals\n\nExecuting Verify or Release, operating MCP servers, public migration support for unreleased Config v2/v3, closing or absorbing separate Epics and bugs."
