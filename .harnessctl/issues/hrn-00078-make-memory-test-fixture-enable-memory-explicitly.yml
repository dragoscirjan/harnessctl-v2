"body": "## Defect\n\nGiven `DEFAULT_CONFIG` now emits `workflow.tdd.enabled: false` before `memory.enabled: false`\nWhen `memory.spec.ts` enables memory by replacing the first `enabled: false`\nThen it enables TDD instead, leaves memory disabled, and five cache assertions fail.\n\n## Classification\n\nDeterministic change-related test-fixture defect. Production memory/cache files are unchanged. Full quality and Release are blocked until repaired and reverified.\n\n## Scope\n\n- Make the memory test fixture enable `memory.enabled` explicitly without depending on YAML key order.\n- Do not alter production behavior unless new evidence requires replanning.\n\n## Acceptance\n\n- [ ] `extensions/generic-tools/memory.spec.ts` passes all 20 tests.\n- [ ] `mise run quality` passes.\n- [ ] Fixture remains correct when another feature adds an `enabled` key before memory configuration.\n\n## Evidence\n\n- `extensions/generic-tools/memory.spec.ts:54-60`\n- `extensions/generic-tools/config.ts:39-48`\n- `npx vitest run extensions/generic-tools/memory.spec.ts --config vitest.config.ts`: 5 failed, 15 passed.\n- `mise run quality`: failed in the same five tests; Python 254 passed and TDD config/schema tests passed."
