"body": "# Complete two-host routing and compatibility acceptance fixtures\n\n## Summary\n\nVerify found partial host and integration evidence relative to the approved acceptance matrix.\n\n## Evidence\n\n`extensions/opencode-tools/index.spec.ts:361-434` starts a fresh Node process and directly invokes the OpenCode adapter for issue/status isolation only. Pi has no two-session fresh-process or lifecycle fixture. No minimum/known-compatible host-version fixture matrix was found. Approved LLD `doc-01M1PZMXJ99DRRW65A1E22G7TH` requires both hosts, two sessions, full authority/file/task/bootstrap isolation, restart recovery, and compatibility fixtures.\n\n## Impact\n\nActual host ordering, Pi lifecycle behavior, broader root isolation, and supported-version claims remain unverified.\n\n## Acceptance Criteria\n\n- Fresh-process fixtures cover OpenCode and Pi launched from primary with two isolated bound sessions.\n- Fixtures exercise source, issue, document, memory, checkpoint, artifact, registered task, and bootstrap roots.\n- Restart/recovery, session switch/fork/resume/compaction/reload paths are covered where supported.\n- Primary remains byte-clean and authority-free after execution.\n- Minimum and known-compatible host versions have deterministic capability/order fixtures and actionable failure assertions.\n"
