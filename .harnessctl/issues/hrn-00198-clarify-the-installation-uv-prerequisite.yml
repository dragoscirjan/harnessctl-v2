"body": "# Clarify the Installation uv prerequisite\n\n## Summary\n\nFormal Verify found that `docs/installation.md` names `mise` but does not distinguish the required `uv` prerequisite or explain how the repository's `mise` configuration provisions it, as required by `hrn-00194`.\n\n## Evidence\n\n- `docs/installation.md` lists Git and `mise`, then runs setup, but contains no `uv` prerequisite guidance.\n- `mise.toml` declares `uv` as a mandatory managed tool and `mise run setup` uses it.\n- `tests/test_docs.py::test_onboarding_docs_lead_to_a_supported_plan_only_first_success` passes without asserting this prerequisite boundary.\n\n## Impact\n\n`hrn-00194`, `hrn-00196`, and Epic `hrn-00175` do not meet mapped acceptance. A reader cannot tell whether a separate `uv` installation is required. Release remains blocked.\n\n## Acceptance Criteria\n\n- `docs/installation.md` distinguishes Git, `mise`, and `uv` requirements accurately.\n- Guidance explains whether project `mise` provisioning supplies `uv`, without exposing prohibited implementation-runtime commands.\n- Focused onboarding contracts fail if the required prerequisite distinction is removed.\n- `uv run pytest tests/test_docs.py`, focused formatting/lint checks, and `mise run docs-build` pass.\n\n## Boundaries\n\nDo not change tool versions, dependencies, installer behavior, distribution paths, or unrelated documentation."
