"body": "# Establish the shared code-intelligence capability\n\n## Objective\n\nCreate the standard nested MCP server registry, provider-neutral host projection, ownership-safe reconciliation, and generated `sdlc-code-index` skill that structural provider adapters extend.\n\n## Scope\n\n- Replace unreleased top-level `code_index` with `mcp.servers.sdlc-code-index` across Python, TypeScript, Zod, generated config-v2 contracts, installer code, tests, packages, and docs.\n- Standardize each logical server entry as `enabled`, `provider`, and `config`.\n- Default `sdlc-code-index` to enabled, provider `codegraphcontext`, and `config: {}`; keep `mcp.output_limit_mode` as a sibling policy.\n- Define provider-discriminated strict config schemas for `codegraphcontext`, `gitnexus`, and `graphify`. Foundation configs accept only `{}`; provider Epics later add documented fields and defaults.\n- Require every accepted provider config value to be represented in Python validation, canonical TypeScript Zod, generated JSON Schema, defaults, and code-owned projection mapping. No arbitrary pass-through values.\n- Normalize provider config with discriminator-aware defaults so values never leak across providers.\n- Reject legacy unreleased top-level `code_index` explicitly while preserving compatible unrelated top-level extension fields.\n- Reserve code-owned host ID `sdlc-code-index`; commands, arguments, IDs, target environment names, and credential values are not project configuration.\n- Preserve provider-neutral local intent rendering and exact existing CVS projections.\n- Reconcile desired and recognized definitions with conflict protection, forced selected replacement, exact generated removal, modified-content preservation/reporting, unrelated JSON preservation, and transactional rollback.\n- Rename the generated skill and selected-host directories to `sdlc-code-index`; install byte-equivalent OpenCode and Pi content when enabled.\n- Keep the skill MCP-reliant for indexed intelligence while requiring source verification and Glob/Grep/read fallback for unavailable, stale, incomplete, or unsuitable evidence.\n- Complete focused tests, generated-contract drift, package artifacts, isolated installation, docs, Changeset, full quality, runtime smoke, and independent review evidence.\n\n## Lightweight Design\n\nThe fixed registry key is a logical capability identity, not an executable name. `provider` is the discriminator; `config` is validated by that provider's strict schema. `type` remains available for transport semantics and is not used for provider selection. Known logical IDs are schema-owned so all accepted values have explicit validation and mapping.\n\nProvider-aware normalization selects the provider first, then merges only that provider's code-owned defaults into its submitted `config`, then validates the resulting discriminated entry. This prevents generic recursive merge from mixing defaults across providers. Provider commands and host projections remain trusted code constants.\n\nOne structural provider is active per `sdlc-code-index` slot. Companion, semantic, and experimental capabilities use separate future logical `mcp.servers` entries; no multiplexer or new service is introduced.\n\n## Ordered Work\n\n1. Completed `hrn-00091` and `hrn-00092` remain immutable history for the superseded unreleased contract and reusable intent/reconciliation foundation.\n2. `hrn-00094` standardizes nested server configuration, strict per-provider validation, safe normalization, migration errors, generated schema, and parity tests.\n3. `hrn-00095` renames and verifies fixed MCP identity and ownership-safe host reconciliation.\n4. Existing `hrn-00093` is revised to generate/package the renamed skill and complete integration evidence after `hrn-00095`.\n\nStories and a separate HLD/LLD are not needed; direct corrective Tasks and this lightweight design are proportionate.\n\n## Acceptance Criteria\n\n- Python and TypeScript normalize the exact same default: `mcp.servers.sdlc-code-index.enabled=true`, provider `codegraphcontext`, `config: {}`.\n- Provider selection uses strict provider-specific Python and Zod schemas; generated JSON Schema agrees.\n- Unknown providers, logical IDs, entry fields, provider config fields, nulls, arrays, commands, arguments, IDs, target environment names, and credential values fail clearly.\n- Partial overlays retain unrelated config but cannot mix provider defaults; legacy top-level `code_index` fails with migration guidance.\n- Existing CVS OpenCode/Pi projections remain byte-equivalent.\n- Inert local intents preserve optional URL support, deterministic validated environment-name mappings, and empty-environment omission.\n- Fixed `sdlc-code-index` conflict, force switch, exact removal, modified preservation/reporting, unrelated JSON, and rollback are tested.\n- Enabled selected hosts receive byte-equivalent `.opencode/skills/sdlc-code-index/SKILL.md` and `.pi/skills/sdlc-code-index/SKILL.md`; disabled fresh installs omit them; prior bytes may remain dormant.\n- Skill guidance uses live MCP schemas, never treats retrieved output as source authority, and falls back safely when evidence is unavailable or stale.\n- Installation and tests never install, download, initialize, index, start, probe by execution, update, or remove third-party tools.\n- Wheel/sdist, isolated install/render, docs, Changeset, focused checks, full quality, runtime smoke, and independent correctness/security/compatibility review pass.\n\n## Dependencies and Release\n\nFirst Epic under `hrn-00083`; blocks provider Epics `hrn-00085` through `hrn-00090`. Release remains blocked until `hrn-00085` defines, maps, documents, and verifies the default CodeGraphContext provider configuration and projection.\n\n## Rollback\n\nRevert nested config, provider-aware normalization, generated contracts, fixed identity, intent/reconciliation changes, renamed skill, docs, tests, packages, and release metadata together. No third-party state is owned or rolled back.\n\n## Risks and Uncertainty\n\n- Discriminator-unaware deep merge can leak defaults across providers; select provider defaults before merging `config`.\n- Permissive unknown top-level support can silently hide old `code_index`; reject that reserved legacy key explicitly.\n- Provider config may become command injection or secret storage; strict safe typed schemas and code-owned mappings are mandatory.\n- Generic intent changes can regress CVS; retain exact projection tests.\n- Entry reconciliation can claim operator content; remove only exact recognized definitions.\n- Hyphenated YAML/JSON keys require bracket access but are valid map identities.\n- Independent planning subagent was unavailable due API connectivity; direct source review identified merge and migration hazards. Independent implementation review remains an acceptance gate.\n\n## Non-Goals\n\n- No real provider command mapping or provider-specific tool catalogue in this Epic.\n- No compatibility alias for unreleased names.\n- No multiplexer or simultaneous structural providers under one fixed ID.\n- No third-party executable, package, index, database, daemon, model, credential, or lifecycle ownership.\n"
