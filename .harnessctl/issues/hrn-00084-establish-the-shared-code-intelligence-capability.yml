    "body": "Verify PASS. Acceptance map: (1) Python/TypeScript defaults agree on enabled `mcp.servers.sdlc-code-index`, provider `codegraphcontext`, config `{}`; (2) distinct Python provider validators, strict Zod branches, and generated JSON Schema agree; (3) negative config suites reject unknown providers/IDs/fields/nulls/arrays and configurable commands/IDs/env/credentials; (4) provider-first partial merge, unrelated extensions, and explicit legacy-key rejection pass; (5) existing CVS OpenCode/Pi byte projections pass; (6) inert local intent optional URL, validated deterministic env-name mapping, and empty-env omission pass; (7) fixed-ID conflict/force/exact removal/modified preservation/unrelated JSON/rollback and explicit-null protection pass; (8) enabled selected-host skill bytes match, fresh disabled omission and dormant retention pass; (9) skill/docs require live schema, advisory evidence, source verification, and Glob/Grep/read fallback; (10) no third-party install/download/init/index/start/probe/update/remove lifecycle exists; (11) wheel/sdist/isolated artifacts, docs, Changeset, fresh quality, runtime smoke, and independent review pass. Fresh evidence: `mise run quality` passed (Python 300; generic Node 193; OpenCode 2; Pi 3; release artifact/static/package gates); `mise run runtime-smoke` passed Node and Bun for all three package entrypoints; independent review round 2 found no findings and confirmed TypeScript YAML redaction; all Epic/child issue validations, memory validation, and `git diff --check` passed. Accepted-Low redundant `.gitignore` rule remains deferred without behavioral impact. Foundation remains not independently releasable until `hrn-00085` supplies the default CodeGraphContext adapter. Epic remains open."
