"body": "# Publish home and onboarding documentation\n\n## Objective\n\nGive a new reader a clear project introduction and the shortest reliable path from installation to one successful, controlled harnessctl workflow.\n\n## Scope\n\n- Publish Home with a concise value proposition, project purpose, key capabilities, supported context, and direct Installation and Getting Started actions.\n- Publish a Docs landing page that explains the difference among guides, catalogs, references, and help content.\n- Publish evidence-backed Installation for the currently supported OpenCode and Pi harnesses.\n- Publish a linear Getting Started tutorial whose first success is one approved executable Epic plan, followed by an explicit Build, Verify, and Release handoff.\n- Protect onboarding claims, links, and generated LLM indexes with focused documentation contracts.\n- Preserve the route, shell, navigation, and ownership authority in approved `doc-00017` v2.\n\n## Acceptance Criteria\n\n- Home answers what harnessctl is, what it does, why it exists, and who it is for without requiring prior SDLC knowledge.\n- Installation provides evidence-backed source-checkout paths and identifies unsupported or planned harnesses honestly.\n- Getting Started begins from a clean supported setup and reaches one approved executable Epic plan through installed `/work-plan` behavior.\n- Commands, expected prompts, approvals, outputs, stopping boundaries, and recovery links are explicit.\n- Readers can continue to SDLC, Harnesses, Tools, or Reference without duplicated domain content.\n- Documentation contracts cover onboarding ownership, support claims, command semantics, links, public-content safety, and deterministic generated indexes.\n- Formal Verify later confirms desktop and mobile discoverability and page flow without judging the temporary visual theme.\n\n## Approved Child Plan\n\n1. `hrn-00193` Story, estimate `S`, order 1: publish user-oriented Home and Docs landing. No child dependency.\n2. `hrn-00194` Story, estimate `M`, order 2: publish evidence-backed installation guidance. No child dependency.\n3. `hrn-00195` Story, estimate `M`, order 3: publish the first-success Getting Started tutorial. Depends on `hrn-00194`.\n4. `hrn-00196` Task, estimate `S`, order 4: enforce onboarding documentation contracts. Depends on `hrn-00193`, `hrn-00194`, and `hrn-00195`.\n\n`hrn-00193` and `hrn-00194` may proceed in parallel. Finish `hrn-00194` before `hrn-00195`; finish all three Stories before `hrn-00196`.\n\n## Verification Strategy\n\n- Run `uv run pytest tests/test_docs.py`.\n- Run `mise run docs-build` for generated-reference and generated-index checks plus strict MkDocs validation.\n- Run focused Markdown formatting and Ruff checks where their owned files apply.\n- Reserve rendered desktop/mobile discoverability and page-flow assessment for formal Verify.\n\n## Release And Rollback\n\nRelease later through one branch, one focused commit, and one pull request. No deployment is included. Roll back the four onboarding pages, focused tests, and regenerated `docs/llms.txt` and `docs/llms-full.txt` together if required.\n\n## Risks\n\n- Installer and support claims can become stale if documentation is not grounded in source and tests.\n- Onboarding can duplicate adjacent domain ownership instead of linking to canonical pages.\n- Conceptual grouped `/work plan` syntax can be mistaken for installed dispatch; onboarding must lead with `/work-plan` while grouped runtime dispatch remains unimplemented.\n- Generated indexes can drift from canonical Markdown.\n- The tutorial can overpromise remote lifecycle behavior; first success ends at Plan.\n\n## Dependencies And Boundaries\n\nDepends only on closed `hrn-00167`. Domain guides and references are linked but not blocking dependencies.\n\nDo not change navigation, theme, product or installer behavior, distribution channels, deployment, or grouped command dispatch. Do not own exhaustive command, config, skill, module, MCP server, harness, troubleshooting, FAQ, or changelog reference content."
