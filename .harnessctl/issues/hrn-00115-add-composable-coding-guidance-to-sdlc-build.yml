"body": "# Add composable coding guidance to SDLC Build\n\n## Outcome\n\nHarnessctl installs one portable `sdlc-code` skill for OpenCode and Pi. SDLC Build loads it before implementation. Its compact root applies generic clean-code policy and reads only relevant bundled language, framework, or artifact references.\n\n## Approved Architecture\n\n- Always-installed `sdlc-code`; no new configuration switch.\n- Compact root owns repository detection, precedence, compatibility, composite-language dispatch, and lazy reference loading.\n- Bundled `references/*.md` overlays cover all 25 audited `lang-*` subjects without depending on operator-owned global skills.\n- Guidance precedence: explicit repository policy, detected versions and existing tooling, relevant overlay, then generic defaults.\n- Tool alternatives are choices, not cumulative mandates. Coding guidance never authorizes unrelated dependency or configuration additions.\n\n## Scope\n\n- Adapt relevant `clean-code` principles into the generic coding baseline.\n- Classify and migrate the useful guidance from all 25 current `lang-*` skills into conditional references.\n- Handle composite technologies such as TSX, JSX, Vue, and Svelte and use shebangs, manifests, embedded-language declarations, and repository evidence where extensions are ambiguous.\n- Register, render, install, package, test, and document byte-equivalent OpenCode and Pi resources.\n- Make Build and Build resumed through Continue load `sdlc-code` before implementation.\n- Add release metadata.\n\n## Non-Goals\n\n- Modify or delete operator-owned files under `~/.config/opencode`.\n- Require every tool currently listed by `clean-code` or replace established repository tooling.\n- Add dependencies or project configuration merely because guidance names a tool.\n- Activate coding guidance in Plan, Verify, or Release except the existing Continue-to-Build handoff.\n- Add HLD or LLD artifacts; the approved lightweight design remains in this Epic.\n\n## Ordered Work\n\n1. Author the canonical policy and conditional references.\n2. Integrate rendering, installation, packaging, Build, and Build-resume behavior.\n3. Complete tests, documentation, drift protection, and Changeset metadata.\n\n## Acceptance Criteria\n\n- Selected hosts receive byte-equivalent `sdlc-code` skill roots and nested references.\n- Build loads `sdlc-code` before implementation; non-Build phases do not activate it.\n- Only references relevant to target files and detected repository context are read.\n- Composite files receive every required overlay without duplicate generic guidance.\n- Ambiguous extensions require repository evidence instead of assumptions.\n- Existing repository policy, runtime/compiler versions, and tooling take precedence over defaults.\n- Generic class-oriented or code-only rules are not imposed on documentation, data, configuration, or IaC when irrelevant.\n- Every audited source skill is mapped or explicitly excluded with rationale.\n- Focused renderer, installer, continuation, package-resource, and drift tests pass during Build.\n- Later Verify runs full `mise run quality`, applicable runtime smoke and artifact checks, plus independent prompt review.\n\n## Release, Rollback, Documentation, Operations\n\nAdd a Changeset and update SDLC/skills documentation. Rollback removes the new template, resources, registration, and Build hook; no persisted-data migration exists. Users rerun harnessctl install and restart the coding host to discover changed skills.\n\n## Estimate And Risk\n\nEstimate `L`, roughly 5-7 engineering days. Main uncertainty is concise, non-conflicting coverage across 25 references and composite dispatch. Key risks are prompt bloat, stale version mandates, ambiguous extensions, duplicate overlays, and optional tools appearing mandatory; lazy loading, compatibility detection, precedence, and focused tests mitigate them.\n\n## Dependencies And Blockers\n\nNo external dependency or current blocker. Standalone Epic because no active duplicate or suitable open parent Initiative exists."
