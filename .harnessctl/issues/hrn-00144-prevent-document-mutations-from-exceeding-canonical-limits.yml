"body": "# Prevent document mutations from exceeding canonical limits\n\n## Summary\n\nReject filesystem document mutations before publication when the resulting canonical catalog would exceed configured limits.\n\n## Scope\n\n- Guard `document_create` before publication when a valid 2,000-file catalog would become 2,001 files.\n- Guard `document_version` before publication when a valid 100-version lineage would become 101 versions.\n- Preserve canonical bytes and cache state on rejection.\n- Preserve valid operations below each limit.\n\n## Acceptance Criteria\n\n- Capacity checks evaluate the proposed next state before canonical publication.\n- Rejected boundary mutations leave canonical authority and cache unchanged.\n- Regression tests cover 2,000 to 2,001 files and 100 to 101 versions from valid starting states.\n- Focused and full configured quality/build gates pass.\n\n## Evidence\n\nVerify round 17 independent review: `/tmp/opencode/hrn-00135-verify-review-round-17.md`.\n\n## Comments\n"
