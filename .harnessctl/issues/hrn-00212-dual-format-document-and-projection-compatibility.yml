"body": "## Objective\n\nMake canonical Documents and local Issue/Document projections fully compatible with mixed legacy numeric and new ULID identities.\n\n## Scope\n\n- Change Document creation to emit `doc-<ULID>` only using the shared identifier utility.\n- Support legacy `doc-` plus at least five digits and new ULID forms in Document parsing, assertion, discovery, canonical filenames, versions, archive, restore, and lineage validation.\n- Update Issue-to-Document path validation for both Document ID forms.\n- Update local persistence loaders and disposable SQLite projection for mixed Issue and Document identities without a schema migration.\n- Exercise parent/dependency relationships, links, complete-graph validation, revisions, archive/restore recovery, and mixed catalogs.\n\n## Acceptance Criteria\n\n- Every new Document ID is `doc-` plus exactly 26 uppercase Crockford characters.\n- Existing numeric Document lineages remain discoverable, readable, versionable, archivable, restorable, linkable, and valid.\n- Mixed numeric and ULID Issue/Document graphs load into disposable cache and validate without rewriting authority.\n- Issue document links accept canonical files for either Document ID form and reject malformed or mismatched paths.\n- Metadata/filename mismatches, lowercase or ambiguous ULIDs, invalid lengths, and generated collisions fail closed.\n- No SQLite schema migration or canonical data migration is required.\n\n## Dependencies And Order\n\nSecond Story in `hrn-00208`. Depends on `hrn-00211` for the shared ULID utility and common identity rules.\n\n## Artifacts\n\n- Updated Document implementation and contracts.\n- Updated Issue document-link validation and local persistence projection.\n- Focused unit and integration tests for mixed authority graphs.\n- Design authority: `doc-00018` after approval and linking.\n\n## Estimate\n\nM, moderate uncertainty. Main uncertainty is complete-graph validation and archive/restore recovery coverage.\n\n## Non-Goals\n\n- Redesigning Document storage, revisions, journals, archive layout, or cache schema.\n- Git workspace tools or lifecycle routing.\n- Rewriting existing numeric IDs.\n- Remote-provider IDs.\n- Changing Issue comment sequencing.\n\n## Comments\n"
