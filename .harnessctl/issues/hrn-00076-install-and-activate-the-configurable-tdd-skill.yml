"body": "## Objective\n\nPackage one canonical `develop-tdd` skill and make SDLC Build activate it only when configured.\n\n## Scope\n\n- Add and register the canonical TDD skill template.\n- Specialize SDLC Build rendering with `workflow.tdd.enabled`.\n- Install `.opencode/skills/develop-tdd/SKILL.md` and `.pi/skills/develop-tdd/SKILL.md` only for enabled selected hosts.\n- Implement atomic enabled-to-disabled cleanup that deletes only unchanged harnessctl-generated content and preserves or reports modified/operator-owned content.\n- Add focused template, installer, conflict, and rollback tests.\n\n## Acceptance\n\n- [ ] Enabled selected hosts receive the canonical skill.\n- [ ] Enabled Build guidance loads `develop-tdd` before implementation and requires observable Red, Green, Refactor steps.\n- [ ] Disabled generated guidance contains no TDD instruction and fresh installs contain no TDD skill.\n- [ ] Enabled-to-disabled reinstall removes only unchanged generated artifacts.\n- [ ] Modified/operator-owned skill content is never silently overwritten or deleted.\n- [ ] OpenCode and Pi behavior remains equivalent and installer mutation stays atomic.\n\n## Dependencies\n\nBlocked by `hrn-00075`.\n\n## Non-Goals\n\n- Framework-specific test commands.\n- Changes to non-Build SDLC phases.\n\n## Estimate\n\nMedium. Highest uncertainty is safe ownership detection during disable/reinstall."
