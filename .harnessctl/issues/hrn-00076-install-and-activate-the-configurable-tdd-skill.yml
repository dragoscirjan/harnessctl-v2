    "body": "Implemented canonical `develop-tdd` packaging and conditional Build activation on `feat/hrn-00074-configurable-tdd`. Enabled OpenCode/Pi hosts receive byte-equivalent generated skills and Red/Green/Refactor Build guidance; disabled renders omit TDD, remove only exact generated files transactionally, and warn/preserve divergent content. Added host-equivalence, conflict, cleanup, rollback, template, and wheel-package coverage. Checks: `uv run pytest tests/test_templates.py tests/test_install.py` (200 passed); isolated release-artifact test (1 passed); Ruff lint/format and `git diff --check` passed. Task remains `in_progress`; no transition requested."
