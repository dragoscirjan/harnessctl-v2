"body": "As an operator\nI want complete provider connection configuration and examples\nSo that generated issue guidance targets the intended service safely.\n\n## Requirements\n\n- GitHub: `gh`, `https://github.com`, `GH_TOKEN`.\n- GitLab: `glab`, `https://gitlab.com`, `GITLAB_TOKEN`.\n- Gitea: `tea`, explicit URL, `GITEA_TOKEN`.\n- Forgejo: `forgejo-cli`, explicit URL, `FORGEJO_TOKEN`.\n- Store token environment-variable names only; never token values.\n- Require `issues.remote` for remote providers and reject it for filesystem.\n- Document `issues.root` and `issues.prefix` as filesystem-only.\n- Add configuration examples to every configuration-explaining document.\n\n## Acceptance\n\n- [x] TS/Python/generated schema enforce provider matrix.\n- [x] Generated skill renders URL/token-env guidance only for selected provider.\n- [x] Docs contain complete provider examples and boundaries.\n- [x] Full verification passes."
