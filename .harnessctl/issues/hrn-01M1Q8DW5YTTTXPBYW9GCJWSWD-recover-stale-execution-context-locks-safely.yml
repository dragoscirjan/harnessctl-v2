"body": "# Recover stale execution-context locks safely\n\n## Summary\n\nVerify found bounded lock waiting but no bounded stale-lock detection or recovery.\n\n## Evidence\n\n`extensions/generic-tools/execution-context.ts:897-922` retries until the deadline and then fails busy. Failed lock removal is intentionally left in place. Approved LLD `doc-01M1PZMXJ99DRRW65A1E22G7TH` requires bounded stale-lock handling and recovery.\n\n## Impact\n\nA process crash or failed unlock can permanently block all session/workspace mutations for the repository.\n\n## Acceptance Criteria\n\n- Lock ownership contains sufficient identity and liveness evidence for safe stale detection.\n- Recovery is bounded, race-safe, and never removes a live owner's lock.\n- Ambiguous ownership fails closed with actionable diagnostics.\n- Tests cover live contention, dead owner recovery, malformed lock state, and concurrent recovery attempts.\n"
