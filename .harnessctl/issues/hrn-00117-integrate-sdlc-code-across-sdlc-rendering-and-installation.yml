"body": "# Integrate sdlc-code across SDLC rendering and installation\n\n## Objective\n\nShip the approved `sdlc-code` root and nested references through the established harnessctl skill-resource pipeline and activate them only for implementation work.\n\n## Scope\n\n- Register canonical root and nested reference templates.\n- Install byte-equivalent resources for selected OpenCode and Pi hosts.\n- Make SDLC Build load `sdlc-code` before implementation.\n- Preserve the existing Continue-to-Build policy so resumed Build receives the same guidance.\n- Include all resources in source and built package artifacts.\n- Preserve conflict-safe and transactional installer behavior.\n\n## Acceptance Criteria\n\n- Fresh selected-host installs contain equivalent `sdlc-code/SKILL.md` and reference trees.\n- Build instructs agents to load `sdlc-code` before coding; Plan, Verify, and Release do not activate it.\n- Continue activates it only by loading current Build policy when Build is resumed.\n- Existing operator files at managed targets follow established conflict and force semantics without unrelated mutation.\n- Wheel, sdist, and installed-package rendering include every canonical resource.\n- No new configuration switch or external skill dependency is introduced.\n\n## Dependencies And Estimate\n\nDepends on `hrn-00116`. Estimate `M`.\n\n## Non-Goals\n\nNo mutation of `~/.config/opencode`, no language-tool installation, and no change to TDD or code-index enablement semantics."
