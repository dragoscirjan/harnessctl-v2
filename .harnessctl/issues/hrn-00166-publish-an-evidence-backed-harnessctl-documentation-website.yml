"body": "# Publish an evidence-backed harnessctl documentation website\n\n## Outcome\n\nPublish a coherent, searchable harnessctl website that explains the project, teaches its SDLC, catalogs supported harnesses and tools, and provides exact installation, onboarding, and configuration references.\n\n## Information Architecture\n\n```text\nHome\nSDLC\n  Introduction to SDLC\n  Harnessctl SDLC\nHarnesses\nTools\n  Skills\n  Node Modules\n  MCP Servers\nDocs\n  Installation\n  Getting Started\n  Reference\n    Config File\n    Config Schema\n    Command Reference\n    Skill Configuration\n      Issues\n      Documents\n      Memory\n      Code Index\n      CVS\n      ...\n  Troubleshooting\n  FAQ\n  Changelog\n```\n\n## Boundary\n\n- Keep editable Markdown and generated contracts as canonical sources.\n- Separate first-success tutorials, explanatory guides, exact references, catalogs, and problem-solving content.\n- Use evidence-backed support claims and visible status text.\n- Provide responsive navigation, search, deep links, accessible diagrams, and generated `llms.txt` and `llms-full.txt` from canonical content.\n- Reuse existing documentation and approved artifacts without silently forking them.\n\n## Planned Epics\n\n1. `hrn-00167` - Website foundation and information architecture.\n2. `hrn-00175` - Home and onboarding documentation.\n3. `hrn-00170` - Generic and Harnessctl SDLC guides.\n4. `hrn-00176` - Harness support documentation.\n5. `hrn-00169` - Skills catalog.\n6. `hrn-00177` - Node Modules catalog.\n7. `hrn-00171` - MCP Servers catalog.\n8. `hrn-00168` - Configuration, command, and skill references.\n9. `hrn-00178` - Troubleshooting, FAQ, and changelog documentation.\n\nAll content Epics depend only on `hrn-00167`; cross-links do not create blocking dependencies.\n\n## Acceptance Direction\n\n- Desktop and mobile readers can locate every domain in the approved hierarchy.\n- Home communicates purpose and routes readers to Installation and Getting Started.\n- Getting Started reaches one successful controlled workflow before linking to broader guides.\n- Guides explain concepts and decisions; references document exact contracts once.\n- Each skill, module, MCP server, and harness has evidence-backed purpose, capability, limitation, and support status.\n- Config and command references are traceable to current generated contracts and installed behavior.\n- Troubleshooting, FAQ, and Changelog answer distinct recovery, conceptual, and change-history needs.\n- Machine-readable LLM indexes remain generated from the same canonical content.\n\n## Existing Work To Reuse\n\n- `hrn-00047`: existing Markdown documentation set.\n- `hrn-00054`: CVS and MCP provider configuration documentation.\n- `hrn-00057`: Mermaid SDLC architecture and transitions.\n- `hrn-00164`: Config v1 field/default reference and MCP examples.\n- `doc-00017`: current website foundation design and implementation evidence.\n\n## Non-Goals\n\n- Changing harnessctl behavior or implementing missing features.\n- Operating external providers or publishing generated site output.\n- Copying Taskfile branding, wording, code, or product taxonomy.\n- Adding Community, Contributing, Releasing, Security, Experiments, or Deprecations sections without separate scope.\n- Building, verifying, or releasing any Epic during Initiative planning."
