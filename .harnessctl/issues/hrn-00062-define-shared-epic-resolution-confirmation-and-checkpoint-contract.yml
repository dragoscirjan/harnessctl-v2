"body": "Given any simplified SDLC command\nWhen it receives a prompt or issue reference\nThen it resolves one authoritative Epic or redirects to Plan\nAnd it applies shared confirmation and checkpoint rules.\n\n## Deliverables\n\n- Five-command registry and shared phase vocabulary.\n- Epic resolution rules for prompts, Initiatives, Epics, and child issues.\n- Required/recommended/optional/not-needed confirmation model.\n- Compact confirmed checkpoint shape using existing memory tools.\n- Duplicate-checkpoint reconciliation and authority safeguards.\n\n## Acceptance\n\n- [x] No proposal or transcript is persisted as checkpoint state.\n- [x] Missing Epic behavior is deterministic for every command.\n- [x] Shared rules avoid duplicated policy prose.\n- [x] Focused rendering and checkpoint contract tests pass."
