"body": "# Namespace managed CVS MCP identities under `sdlc_`\n\n## Outcome\n\nHarnessctl-owned CVS MCP server IDs and resulting tool namespaces use the `sdlc_` product namespace consistently with generated SDLC support skills.\n\n## Canonical Names\n\n- `cvs_github` -> `sdlc_cvs_github`\n- `cvs_gitlab` -> `sdlc_cvs_gitlab`\n- `cvs_gitea` -> `sdlc_cvs_gitea`\n- `cvs_forgejo` -> `sdlc_cvs_forgejo`\n\nUnderscores are intentional because these are host MCP IDs and tool namespace prefixes, not skill directory IDs.\n\n## Scope\n\n- Change the four fixed CVS intent IDs used by CVS and remote Issues routes.\n- Update OpenCode and Pi projections, generated `sdlc-cvs` and remote `sdlc-issue-tracking` guidance, current repository host outputs, tests, HLD/LLD references, public docs, package/release evidence, and changelog.\n- Preserve identical CVS and remote Issues intent deduplication and conflicting-definition rejection.\n- Recognize only exact legacy harnessctl-generated `cvs_*` definitions during reconciliation.\n- Fresh installs emit only canonical `sdlc_cvs_*` IDs.\n- Upgrades remove byte-equivalent legacy definitions transactionally; modified legacy definitions remain byte-equivalent and produce bounded warnings.\n\n## Non-Goals\n\n- No skill, command, provider, URL, authentication, toolset, executable, argument, or runtime behavior change.\n- No compatibility alias MCP entries or tools.\n- No mutation of arbitrary/operator MCP entries or global host configuration.\n- No change to external `skills.sdlc-code-index.mcp_server`; the current `sdlc_code_index` tool namespace already satisfies this naming direction and remains user-owned.\n- No expansion of verified Epic `hrn-00129`, whose approved scope explicitly excludes MCP/tool IDs.\n\n## Lightweight Design\n\nKeep one explicit canonical server-ID mapping in the MCP intent layer. Return legacy intents separately from desired intents so existing ownership-safe reconciliation can remove exact generated definitions while preserving modified content. Render all skill guidance from the canonical desired intent ID rather than rebuilding prefixes independently.\n\nNo separate design artifact or child issue is required; this Epic is an atomic cross-cutting identity migration.\n\n## Ordered Work\n\n1. Update fixed desired IDs and exact legacy recognition for all four providers.\n2. Update generated skill consumers and projection/migration fixtures.\n3. Update current OpenCode/Pi outputs, architecture references, user docs, package assertions, and release notes.\n4. In Build, run focused MCP, installer, skill, docs, and artifact checks.\n5. In separate Verify, run full quality/build gates and independent migration/correctness review.\n\n## Acceptance\n\n- GitHub, GitLab, Gitea, and Forgejo desired MCP IDs are exactly `sdlc_cvs_github`, `sdlc_cvs_gitlab`, `sdlc_cvs_gitea`, and `sdlc_cvs_forgejo`.\n- Generated `sdlc-cvs` and remote `sdlc-issue-tracking` guidance names the exact canonical live tool prefix.\n- Identical CVS and remote Issues definitions deduplicate under the canonical ID; same-ID behavioral mismatches still fail before mutation.\n- Fresh OpenCode, Pi, and all-harness installs contain only applicable canonical IDs.\n- Byte-equivalent legacy generated entries migrate to canonical IDs transactionally without requiring an alias.\n- Modified legacy entries and unrelated operator JSON remain byte-equivalent and are reported rather than deleted; canonical conflicts retain existing force semantics.\n- Selected-host behavior and injected rollback restore host file bytes and existence.\n- Source, generated outputs, docs, package artifacts, and active guidance contain no unqualified `cvs_*` identity except explicit migration documentation and tests.\n- Provider URLs, auth, toolsets, environment-name references, commands, versions, output guards, and remote-operation safety rules remain unchanged.\n- Focused checks, `mise run quality`, release-artifact tests, and `mise run build` pass in their proper phases.\n\n## Verification\n\nExercise all four providers across OpenCode, Pi, and all-harness selection; CVS-only and shared remote-Issues routes; conflicting route definitions; fresh configuration; exact legacy migration; modified legacy preservation; canonical conflict; force; unrelated JSON preservation; and injected rollback. Verify package/source/generated-tree parity and stale-ID allowlists. Run full quality, build, and independent correctness/security/privacy review only in Verify.\n\n## Release, Rollback, Documentation, Operations\n\nPublish as a breaking rename of four harnessctl-managed MCP identities in the next release. Document exact old-to-new mappings, tool-prefix effects, exact legacy reconciliation, modified-entry preservation, and the absence of aliases. Transaction rollback restores affected host files. No deployment, provider invocation, credential access, or runtime operation is required.\n\n## Estimate and Uncertainty\n\nEstimate: 1 developer day. Uncertainty: medium because persisted host identities, two host formats, shared CVS/Issues deduplication, and generated/package artifacts must move atomically.\n\n## Risks\n\n- A modified legacy entry can remain active beside the canonical entry; the warning must make coexistence explicit without deleting operator content.\n- Stale generated guidance can reference unavailable old tool names.\n- Over-broad recognition could delete an operator-owned entry.\n- Partial projection updates could diverge OpenCode and Pi behavior.\n\n## Dependencies and Relationships\n\nNo parent, child, dependency, or formal relationship. `hrn-00129` is related context only and remains unchanged.\n\n## Plan Status\n\nApproved on 2026-08-25. Ready for a separate `work-build hrn-00132` invocation. No Build, Verify, or Release work was performed during Plan."
