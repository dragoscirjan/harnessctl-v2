"body": "# Publish the Node Modules catalog\n\n## Objective\n\nReplace the Node Modules structural stub with an evidence-backed catalog of every public npm workspace currently shipped by this repository.\n\n## Catalog Boundary\n\nA catalog module is a public package selected by the root npm `workspaces` configuration and a package manifest with `publishConfig.access: public`. Internal TypeScript files, the private root package, generated skills, MCP servers, provider processes, and Python installer components are not separate catalog modules.\n\nThe current inventory is:\n\n- `@harnessctl/generic-tools`: harness-neutral programmatic configuration, issue, document, and memory capabilities plus generated contracts.\n- `@harnessctl/opencode-tools`: OpenCode project-tool adapter over the generic layer.\n- `@harnessctl/pi-tools`: Pi extension adapter over the generic layer.\n\n## Scope\n\n- Replace `docs/node-modules.md` in place; preserve its approved route and ownership.\n- Add an evidence review date and an exact package inventory and relationship matrix.\n- Document each public package exactly once with purpose, reader capability, consumer or environment, conceptual inputs and outputs, installation or loading path, prerequisites, limitations, related skills or MCP servers, status, and adjacent evidence.\n- Explain package relationships and distinguish harness-neutral behavior from host-specific registration.\n- State current Node engine, host adapter, Pi peer/package-consent, and unsupported-host boundaries only where current evidence supports them.\n- Link Installation, Harnesses, Skills, MCP Servers, Configuration, and exact reference pages instead of duplicating their contracts.\n- Regenerate `docs/llms.txt` and `docs/llms-full.txt` from canonical content.\n- Add focused drift gates in `tests/test_docs.py` derived from current workspace manifests and package evidence.\n\n## Lightweight Design\n\nNo separate HLD, LLD, or design artifact is required. The page uses one package-level inventory and relationship matrix followed by three package sections. Package sections explain public capability and boundaries; existing reference pages remain authoritative for exact tool, configuration, skill, MCP, installation, and harness contracts.\n\n## Ordered Children\n\n1. Story: Publish the evidence-backed Node Modules catalog. Estimate M; order 1.\n2. Task: Enforce Node Modules catalog contracts. Estimate S; order 2; depends on the Story.\n\n## Acceptance Criteria\n\n- Every current public workspace package appears exactly once, and the private root package and source-only files do not appear as catalog entries.\n- Catalog inventory, runtime constraints, host applicability, and adapter dependency relationships agree with current package manifests.\n- Each package entry states purpose, capability, consumer or environment, conceptual inputs and outputs, loading path, prerequisites, limitations, related components, status, and adjacent evidence.\n- Readers can distinguish packages from skills, MCP servers, provider processes, installer behavior, and private implementation utilities.\n- Statuses use the shared status/evidence vocabulary and make no npm registry, external host, provider availability, or operational claim beyond current evidence.\n- Focused tests derive the public package inventory from manifests and enforce exact entries, required fields, evidence freshness/classes, relationships, constraints, boundaries, and canonical links.\n- Deterministic `llms.txt` and `llms-full.txt` outputs include the completed catalog and remain current.\n- Later Verify covers focused docs/release-artifact tests, package build/tests/typecheck, strict docs build, focused formatting/lint, generated-index checks, and `git diff --check`.\n\n## Dependencies And Boundaries\n\nThe only blocking dependency is `hrn-00167`, which is closed. Skills, MCP Servers, Harnesses, Installation, and Reference cross-links are non-blocking.\n\nDo not redesign packages, change exports or dependencies, alter installer/configuration/runtime behavior, document private source as public API, publish packages, operate providers, perform theme/browser work, or deploy the site.\n\n## Release, Rollback, And Operations\n\nLater Release uses one scoped branch, commit, push, and ready pull request after separate consent. Rollback reverts `docs/node-modules.md`, its focused tests, and regenerated LLM indexes together. This Epic adds no migration, runtime service, external provider operation, deployment, or npm publication.\n\n## Estimate, Risks, And Blockers\n\nEstimate M. Main risks are confusing packages with source modules, overclaiming published or operational state, duplicating exact reference contracts, and allowing package inventory/version/runtime/dependency prose to drift. Derive drift gates from workspace manifests and keep claims adjacent to narrow current evidence.\n\nNo current blocker."
