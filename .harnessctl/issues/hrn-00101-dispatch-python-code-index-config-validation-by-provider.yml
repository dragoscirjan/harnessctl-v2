"body": "# Dispatch Python code-index config validation by provider\n\n## Summary\n\nPython currently applies one shared empty-map check after validating the provider name. The foundation contract requires separate provider-discriminated validation for `codegraphcontext`, `gitnexus`, and `graphify`, matching Zod and generated JSON Schema.\n\n## Evidence\n\n- `src/harnessctl/config.py:201-204` validates the provider, then applies one `_allowed_keys(..., set(), ...)` call.\n- TypeScript Zod and generated JSON Schema already model three strict provider branches.\n- `docs/configuration.md:103-105` states that every provider has a separate strict schema.\n\n## Acceptance Criteria\n\n- Python dispatches `mcp.servers.sdlc-code-index.config` validation through a distinct validator for each supported provider.\n- Each foundation validator accepts only `{}` until its provider Epic adds explicit fields.\n- Unknown providers and fields still fail with stable `ConfigError` messages.\n- Tests prove each provider branch is selected independently and cannot inherit another provider's accepted fields/defaults.\n- Python, Zod, generated JSON Schema, and documentation remain consistent.\n\n## Non-Goals\n\n- No real provider options, command projection, executable probe, or provider lifecycle behavior.\n"
