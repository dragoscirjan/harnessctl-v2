"body": "# Unify configuration under a capability-oriented Config v1 contract\n\n## Objective\n\nEstablish Config v1 as harnessctl's first stable public configuration contract while removing duplicated Python and TypeScript ownership. TypeScript Zod is the sole hand-maintained schema/default authority; generated portable artifacts drive Python validation and defaults.\n\n## Architecture\n\n- Define capability-oriented configuration under `skills` for issues, documents, CVS, caveman, code index, and memory.\n- Keep shared paths, workflow policy, and generic MCP declarations as separate infrastructure concerns.\n- Generate `config-v1.schema.json` and `config-v1.defaults.json` from the canonical Zod contract; ship and drift-check both artifacts.\n- Make Python consume generated artifacts through standards-based JSON Schema validation without restating fields, defaults, enums, or cross-field rules.\n- Require explicit `version: 1`. Missing and non-1 documents fail with stable-v1 rewrite guidance; no automatic migration or compatibility reader is provided.\n- Treat existing Config v2 and paused Config v3 as unreleased development contracts, not public compatibility targets.\n- Let generic MCP declarations express either URL-oriented or command-oriented connection values without a transport/type field. Select host transport only while compiling OpenCode/Pi configuration.\n- Treat exact generated host MCP entries as managed. Any pre-existing or operator-modified same-ID entry is operator-owned, remains byte-preserved, and is never overwritten or deleted, including under force.\n- Keep `memory-record-v1.schema.json` independent from the Config v1 contract.\n\n## Scope\n\n1. Define and generate the Config v1 contract.\n2. Migrate TypeScript and Python configuration consumers to v1.\n3. Compile generic MCP declarations without reclaiming operator edits.\n4. Publish the Config v1 reference, initial-release guidance, and MCP examples.\n5. Approve Config v1 successor versions of the linked HLD and LLD before Build resumes.\n\n## Acceptance Criteria\n\n- One Zod authority defines Config v1 shape and defaults; generated artifacts are deterministic, reproducible, shipped, fingerprint-aligned, and protected by a stale-artifact check.\n- Config v2/v3 config symbols and contract artifacts are retired; unrelated memory-record v1 artifacts remain.\n- Python and TypeScript produce equivalent normalized v1 documents and equivalent validation outcomes through shared fixtures.\n- No hand-maintained Python config contract/default copy remains.\n- Only explicit Config v1 is accepted; missing and non-1 versions fail fast without automatic migration.\n- Capability-oriented sections replace the current split top-level capability configuration.\n- MCP transport is compiler-derived rather than configured.\n- Exact generated MCP entries remain reconcilable, while pre-existing or operator-edited host entries are never overwritten or deleted.\n- Documentation covers every v1 field and default, credential-safe known/custom MCP examples, ownership boundaries, and rewrite guidance for unreleased development configs.\n- Existing `hrn-00157`, `hrn-00158`, and `hrn-00159` remain independently traceable and are not absorbed.\n\n## Risks\n\n- The paused v3 slice must be renamed comprehensively without losing tested contract logic.\n- Existing developer Config v2 files require manual rewrite to v1.\n- Config v1 artifacts can be confused with unrelated memory-record v1 artifacts; names and package tests must distinguish them.\n- Generated artifacts must resolve correctly in source, wheel, and npm layouts.\n- Unsupported Zod-to-JSON-Schema semantics must fail generation rather than be duplicated in Python.\n- Adopt-on-edit can leave declared MCP intent unapplied; warnings must identify the preserved host entry and safe remediation.\n\n## Dependencies\n\nNone. `hrn-00161` resumes first; remaining Stories retain their recorded dependency order. Existing Config v2 delivery and compatibility issues remain separate.\n\n## Release, Rollback, and Operations\n\nRelease is a coordinated initial stable-v1 Python/npm release and is outside Plan. Before release, rollback means reverting the implementation branch. No runtime compatibility rollback is provided. Harnessctl does not operate MCP servers.\n\n## Non-Goals\n\n- Config v2/v3 readers or automatic migration code.\n- Public migration support for unreleased Config v2/v3 contracts.\n- Installing, starting, authenticating, monitoring, or operating MCP servers.\n- Building, verifying, releasing, committing, or modifying source during Plan.\n\n## Approved Plan\n\nRevised and approved by the user on 2026-08-30. Exact executable scope consists of this Epic, four ordered existing Story children, approved Config v1 successor versions of `doc-00015` and `doc-00016`, and the acceptance criteria, dependencies, non-goals, ownership rules, risks, release boundary, and rollback boundary recorded here."
