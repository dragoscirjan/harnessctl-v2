"body": "# Reconcile Documents design after repository-only migration\n\n## Goal\n\nMake approved HLD/LLD v4, the Epic, reused child scopes, active SDLC guidance, and artifact evidence describe one minimal repository-local Documents product with no shipped migration capability.\n\n## Scope\n\n- Keep approved HLD `doc-00013` v4 and LLD `doc-00014` v4 as active design authority while preserving v1-v3 and immutable comments as history.\n- State that this repository's `.specs` conversion was a completed one-time bootstrap operation, not product behavior.\n- Keep fixed `.harnessctl/documents` authority, four kinds, nine operations, complete proposed-state validation, ordinary Documents recovery, issue-link preflights, cache rebuild, thin adapters, and provider/privacy boundaries.\n- Distinguish 19 completion-mapped converted records across 14 lineages from the two v4 successors, yielding 21 direct active files at Plan completion.\n- Require persistent checked-in mapping/digest/lineage evidence before temporary completion-state removal.\n- Reconcile `hrn-00135`, `hrn-00139`, `hrn-00140`, this issue, and `hrn-00145` without creating a new issue or rewriting historical comments.\n- Remove migration requirements from current guidance, active issue acceptance, package/artifact expectations, and generated outputs.\n\n## Acceptance Criteria\n\n- [ ] HLD/LLD v4 are internally consistent, independently reviewed, approved, and linked as active authority.\n- [ ] Epic and all affected reused children encode the same Documents product, migration-removal, preservation, dependency, and verification boundaries.\n- [ ] Current guidance distinguishes 19 converted records/14 lineages from two v4 successors and contains no active migration requirement.\n- [ ] Ordinary Documents transaction recovery is explicitly retained while migration-only streaming/control behavior is explicitly removed.\n- [ ] Persistent checked-in preservation evidence survives completion-state deletion and validates canonical targets and legacy metadata.\n- [ ] V1-v3 designs, immutable issue comments, memory, changelog history, and `.specs-v1` remain preserved historical evidence.\n- [ ] Documents validation, Issues validation, current-doc consistency, artifact absence checks, and memory validation pass."
