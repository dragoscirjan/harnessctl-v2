"body": "## Defect\n\nGiven `workflow.tdd.enabled: true` and an active checkpoint resumes the Build phase\nWhen the user invokes `work-continue`\nThen Continue can perform implementation without loading `develop-tdd` or requiring observable Red, Green, and Refactor steps.\n\n## Classification\n\nConfirmed product/design defect discovered during independent Verify review. Direct `work-build` activation is correct, but the supported Continue entry point can bypass the Epic's enabled-TDD execution acceptance. Release is blocked.\n\n## Cause\n\nThe generated SDLC registry maps `work-continue` only to `references/continue.md`. Continue may resume Build, but neither the command nor Continue policy loads the specialized Build reference. TDD guidance exists only in the Build reference.\n\n## Scope\n\n- Ensure a Continue operation that resumes Build applies the configured Build policy before implementation.\n- With TDD enabled, load `develop-tdd` and require observable Red, Green, and Refactor steps for the resumed behavior slice.\n- Keep disabled Continue output free of TDD guidance.\n- Leave Plan, Verify, Release, merge policy, and non-Build resumes unchanged.\n- Add focused template, installation, and documentation coverage without broadening the phase model.\n\n## Acceptance\n\n- [ ] Enabled `work-continue` resuming Build loads `develop-tdd` before code changes.\n- [ ] Enabled resumed Build requires observable Red, Green, and Refactor boundaries.\n- [ ] Disabled resumed Build contains no TDD instruction.\n- [ ] Plan, Verify, Release, and non-Build Continue behavior remain unchanged.\n- [ ] Generated OpenCode and Pi Continue behavior is equivalent.\n- [ ] Focused tests, `mise run quality`, and `mise run runtime-smoke` pass.\n\n## Evidence\n\n- `src/harnessctl/templates/skills/sdlc/SKILL.md.j2:8-16`\n- `src/harnessctl/templates/skills/sdlc/references/build.md.j2:9-10`\n- `src/harnessctl/templates/skills/sdlc/references/continue.md.j2:9`\n- `src/harnessctl/templates/sdlc/work-continue.md.j2:3-7`\n- `tests/test_templates.py:223-234`\n- Fresh quality and runtime-smoke gates pass but do not exercise enabled Continue-to-Build activation.\n- No credential, secret, or privacy exposure found."
