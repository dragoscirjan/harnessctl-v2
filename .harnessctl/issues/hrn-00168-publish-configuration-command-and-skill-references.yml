"body": "# Publish configuration, command, and skill references\n\n## Objective\n\nPublish exact, source-traceable operator contracts for harnessctl Config v1, all installed SDLC prompt commands, and every configurable skill domain.\n\n## Boundary\n\nThis Epic owns the Config File, Config Schema, Command Reference, and Skill Configuration routes. It links to conceptual SDLC guides and the Skills, MCP Servers, Node Modules, and Harnesses catalogs instead of duplicating them.\n\nIt does not change Config v1 behavior, defaults, schema validation, host projection, command behavior, provider integration, or migration policy.\n\n## Documentation Design\n\n- Keep Config File and Config Schema as separate, cross-linked reader intents.\n- Explain file loading, precedence, merging, validation, security, examples, and compatibility in Config File.\n- Present Config Schema object-first, following Taskfile-style nested object sections and property tables. Use dotted paths only for cross-references and error examples.\n- Derive schema structure, requiredness, constraints, and defaults deterministically from generated Config v1 contracts. Use a bounded documentation-only description source for operator prose; fail checks on missing or extra descriptions.\n- Give each command one consistent entry: purpose, Epic requirement, inputs, approvals, outputs, conditional references, stopping boundary, checkpoint behavior, and prohibited phase crossing.\n- Cover exactly the eight current `skills` keys: Issues, Documents, CVS, Caveman, TDD, Code Index, Web Retrieval, and Memory.\n- State provenance and distinguish declared configuration, generated contract or output, harness registration, external provider behavior, and verified operation.\n\nApproved `doc-00015` v2 and `doc-00016` v2 remain Config architecture authority. Current command registry, templates, installed projections, canonical SDLC references, and tests remain command authority. No new HLD or LLD is needed.\n\n## Execution Order\n\n1. Publish the Config File reference.\n2. Publish the object-first Config Schema reference after the Config File boundary is stable.\n3. Publish the six-command reference in parallel with Config work.\n4. Complete Skill Configuration references after Config File and Config Schema conventions are stable.\n5. Enforce integrated provenance and drift gates after all content Stories.\n\n## Acceptance Criteria\n\n- Config File and Config Schema are separate, cross-linked, and non-duplicative.\n- Every canonical Config v1 object and property appears exactly once in an object-first schema reference.\n- Schema structure, constraints, requiredness, defaults, and prose coverage remain traceable to current authority and fail closed on drift.\n- Plan, Build, Verify, Release, Continue, and Refresh each have one exact reference entry; no shell CLI syntax is invented.\n- Issues, Documents, CVS, Caveman, TDD, Code Index, Web Retrieval, and Memory configuration are each covered exactly once.\n- Public examples contain credential placeholders and environment-variable names only.\n- References distinguish declaration, generated output, harness registration, provider state, and verified operation.\n- Exact navigation, source links, deterministic generated references and LLM indexes, strict MkDocs, formatting, and focused tests pass.\n- Intentional source mutations prove command, schema/default, skill-key, description, and inventory drift gates fail.\n\n## Evidence And Sources\n\n- Config authority: `extensions/generic-tools/schemas.ts`, generated Config v1 schema/defaults/fingerprints, TypeScript and Python loaders, shared conformance fixtures, and Config v1 tests.\n- Command authority: `src/harnessctl/templates.py`, six `src/harnessctl/templates/sdlc/work-*.md.j2` templates, canonical SDLC references, generated harness commands, installer behavior, and template tests.\n- Reusable publication: `docs/configuration.md`, existing Skill Configuration pages, and closed Config v1 Story `hrn-00164`.\n- Architecture: approved `doc-00015` v2 and `doc-00016` v2.\n\n## Risks And Controls\n\n- Generated schema descriptions are sparse: use an exact-coverage docs-only description source rather than inventing runtime semantics.\n- Union and conditional schemas can render ambiguously: test representative provider branches and refinements against generated JSON Schema.\n- Existing pages mix guide, catalog, and reference prose: preserve useful content while enforcing one canonical owner and stable links.\n- Command prose can drift from templates: derive inventory from the registry and test every entry against current templates and phase references.\n- Secrets can leak through examples: allow placeholders and environment-variable names only, with focused screening.\n- Repository-wide unrelated changes may remain dirty: verify and report Epic-owned checks separately without modifying unrelated files.\n\n## Release And Rollback\n\nRelease is documentation-only through the normal branch, commit, push, and ready-PR path after Verify. No deployment or provider operation is required. Before release, rollback is a scoped revert of this Epic's documentation, generation, navigation, tests, and authority changes.\n\n## Non-Goals\n\nConfig v1 behavior/default/schema/migration changes; command or skill behavior changes; conceptual SDLC tutorials; Skills/MCP/Node Modules catalogs; provider setup tutorials; hosting or deployment; unrelated repository cleanup."
