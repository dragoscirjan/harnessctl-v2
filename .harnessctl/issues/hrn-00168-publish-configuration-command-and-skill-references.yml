"body": "# Publish configuration, command, and skill references\n\n## Objective\n\nProvide exact, source-traceable contracts for harnessctl configuration, installed SDLC commands, and every configurable skill domain.\n\n## Scope\n\n- Publish a Config File reference covering location, version, precedence, defaults, validation, security boundaries, and complete examples.\n- Publish a Config Schema reference generated or reconciled from the authoritative Config v1 schema and defaults.\n- Publish a Command Reference for Plan, Build, Verify, Release, Continue, and Refresh with inputs, approvals, outputs, stopping boundaries, and constraints.\n- Publish Skill Configuration pages for Issues, Documents, Memory, Code Index, CVS, and every other shipped configurable skill domain.\n- Link to Skills, SDLC, Harnesses, Node Modules, and MCP Servers rather than duplicating their guide or catalog content.\n\n## Information Design\n\nUse Taskfile's reference separation as non-authoritative inspiration. Each field or command states type/input, required/default behavior, valid values, effect/output, constraints, provenance, and an adjacent compact example where useful. Guides explain decisions; this Epic owns exact contracts.\n\n## Acceptance Criteria\n\n- Every canonical Config v1 object and property is documented exactly once.\n- Config File and Config Schema are separate, cross-linked reader intents.\n- Schema content remains traceable to current generated schema and defaults.\n- Every installed SDLC command has one exact reference entry distinct from the conceptual SDLC guide.\n- Every configurable shipped skill domain has a complete reference page.\n- Credentials use placeholders or environment-variable names only.\n- References distinguish declared configuration, generated output, harness registration, external provider state, and verified operation.\n- Examples use current syntax and claims carry evidence-backed status where applicable.\n\n## Dependencies And Boundaries\n\nDepends only on `hrn-00167`. Other content Epics may link here but do not block or own these contracts.\n\nDo not change Config v1, command behavior, skill behavior, defaults, validation, or migration policy."
