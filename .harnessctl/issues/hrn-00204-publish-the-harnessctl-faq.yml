"body": "# Publish the harnessctl FAQ\n\n## User Story\n\nAs a prospective or current harnessctl user, I want concise answers to recurring questions so that I can find the authoritative guide or reference quickly.\n\n## Scope\n\n- Replace `docs/faq.md` with conceptual, support, compatibility, lifecycle, safety, and evidence questions.\n- Answer briefly and link Installation, Configuration, Harnesses, Skills, Node Modules, MCP Servers, Command Reference, Config Schema, and status/evidence authority where applicable.\n- Explain supported harness integration, declaration versus operation, consent boundaries, and where release state is recorded without reproducing exact contracts.\n\n## Acceptance Criteria\n\n- Every answer is concise, reader-facing, and links the canonical owner for exact behavior.\n- Answers distinguish supported harnessctl integration from third-party host capability and configuration from provider operation.\n- No answer promises compatibility, publication, operation, roadmap delivery, or support not established by current evidence.\n- Credential and destructive-action safety wording remains consistent with public documentation policy.\n- Likely reader terminology appears in headings for searchability.\n\n## Dependencies And Order\n\nParent `hrn-00178`; order 2; no child dependency. Linked design authority: `doc-00017` v2 and `docs/status-and-evidence.md`.\n\n## Estimate And Risks\n\nEstimate S. Main risks are duplicating references and broadening support claims.\n\n## Non-Goals\n\nNo product changes, exhaustive API reference, roadmap promises, provider operation, theme/browser work, or publication."
