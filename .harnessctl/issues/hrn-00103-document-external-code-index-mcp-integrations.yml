"body": "# Document external code-index MCP integrations\n\n## Plan Status\n\nApproved, including independent-review corrections and the nonprecedential research exception amendment.\n\n## Objective\n\nPublish one consolidated, sourced, versioned guide for integrating external repository-intelligence MCP servers with the provider-neutral `sdlc-code-index` skill without making harnessctl responsible for those runtimes.\n\n## Scope\n\nCreate `docs/code-intelligence-providers.md` covering CodeGraphContext, GitNexus, Graphify, Repomix, FastCode, and CocoIndex where authoritative evidence exists. Keep `docs/code-intelligence.md` as the provider-neutral contract and migration boundary. Link the guide from documentation/root indexes as appropriate. Provider-neutral skill templates and generated skills remain unchanged.\n\nFor every provider cover status/version, license, external install/update, applicable MCP integration, OpenCode/Pi configuration, server mapping, lifecycle/storage/removal, credentials/privacy/telemetry/security, capabilities/limitations, stale-index behavior, and sources. Unsupported, ambiguous, stale, or conflicting facts remain explicit.\n\nHarnessctl never executes provider commands, generates provider entries, probes installations, or owns external files, processes, indexes, credentials, or data.\n\n## Research And Freshness Policy\n\n- Prefer official documentation, repositories, releases, and license files.\n- Record URL, source kind, access date, and release/tag/commit where available.\n- Check evidence within 7 calendar days before each research Task completes and recheck during formal Verify; otherwise mark stale and narrow the claim.\n- Record SPDX identifier or exact license identity, applicable component/release, exceptions or dual licensing, and redistribution constraints.\n- Cover network exposure, authentication/authorization, filesystem/process permissions, data egress, supply-chain posture, telemetry, credentials, retention, storage, models, databases, sandboxing, and remote services. Never infer behavior from silence.\n- Never install, execute, probe, index, watch, update, or remove a provider.\n\n## Historical Research Exception\n\nExactly one historical read-only GitNexus `list_repos` invocation is accepted as a disclosed, nonprecedential exception for `hrn-00111`. This decision supersedes the absolute no-provider-command checklist statement in `hrn-00110` only for that incident; all provider prohibitions apply prospectively.\n\nThe returned output must remain quarantined from claims, citations, search inputs, corroboration, qualifications, comparison matrices, and guide wording. Local evidence may establish only that no intentional mutation was observed. Provider-side retention, egress, and remote state remain `Unknown` without provider logs or before/after snapshots. No subsequent provider call or live handshake is permitted.\n\n## Documentation Design\n\nUse a comparison matrix followed by identical headings: status/version; license; install/update; OpenCode; Pi; server mapping; lifecycle/storage; credentials/privacy/telemetry/security; capabilities/limitations; stale-index behavior; removal; sources. Direct Tasks are proportionate; no HLD or LLD is required.\n\n## Ordered Child Plan\n\n1. `hrn-00110` (S): evidence/freshness/license/security policy; no dependency.\n2. `hrn-00111` (M): CodeGraphContext, GitNexus, Graphify research; depends 110; classify MCP applicability and preserve the approved exception evidence.\n3. `hrn-00112` (M): Repomix, FastCode, CocoIndex research; depends 110; classify MCP applicability.\n4. `hrn-00113` (M): guide, links, public-guide/inventory/package tests, and a Changeset only if a published package changes; depends 111+112.\n5. `hrn-00114` (S/M): validation/evidence only; depends 113.\n\n## Acceptance\n\n- Every provider has a complete sourced section or explicit applicability/evidence limitation.\n- Examples match closed Epic `hrn-00105`; `mcp_server` is guidance, not ownership.\n- No default endorsement, subsequent provider execution, skill-template edit, or generated-skill edit occurs.\n- The one approved `hrn-00111` exception is disclosed, quarantined, nonprecedential, and assessed under the Historical Research Exception standard; unobservable provider-side effects remain `Unknown`.\n- User ownership, licensing, lifecycle/storage, privacy/security/telemetry, capabilities/limitations, stale-index behavior, and removal are sourced or explicitly unknown.\n- Migration warns users to audit and manually remove prior generated MCP entries from unreleased builds.\n- Tasks 111 and 112 own structural guards for their research artifacts. Task 113 owns public-guide, link, documentation-inventory, and package assertions and creates a Changeset only for published-package impact; otherwise it records the `.changeset/README.md` documentation/tests exemption. Task 114 validates without hidden product changes.\n- Documentation inventory, links, package artifacts, applicable Changeset policy, formatting, focused tests, full quality, runtime smoke, and independent correctness/security/privacy review pass.\n\n## Artifacts\n\nProvider guide; updates to provider-neutral docs/indexes; research structural guards; documentation/package inventory tests; source evidence; Changeset only if published-package impact requires it.\n\n## Verification\n\nRecheck every claim, URL, version, license, and example; verify the approved exception quarantine, no later provider calls, locally observable no-intentional-mutation evidence, and explicit `Unknown` remote effects; run documentation/link/package checks, formatting, focused tests, `mise run quality`, and `mise run runtime-smoke`; obtain independent correctness/security/privacy review. No live provider handshake.\n\n## Release And Rollback\n\nRelease is documentation/repository metadata unless a published-package impact is discovered. Rollback removes exactly the provider guide, links, public-guide tests/package-inventory assertions, and any conditionally required Changeset introduced by Task 113. It confirms no intentional local external MCP registration, package, process, index, credential, or data mutation was observed; provider-side retention, egress, and remote state remain `Unknown` where unobservable.\n\n## Estimate And Uncertainty\n\nApproved execution estimate: L. This body supersedes immutable initial metadata estimate M, which the issue tool cannot update. Assumptions: research Tasks may run in parallel after 110; authoritative sources remain reachable; unsupported providers narrow scope. Primary uncertainty is source quality/version drift and unobservable provider-side effects from the accepted historical invocation.\n\n## Risks And Blockers\n\nOmitted facts can produce unsafe claims; explicit unknowns are mandatory. Versions/licenses/links may drift. Provider applicability may be absent. The approved exception must never be generalized into authorization for another provider call. Dependency `hrn-00105` is closed; no external blocker.\n\n## Non-Goals\n\nProvider runtime installation/execution/testing/removal; additional provider-call exceptions; default-provider recommendation; provider-specific harnessctl schema/host configuration; skill-template/generated-skill changes; guarantees beyond cited or locally observable evidence."
