"body": "# Enforce help and changelog documentation contracts\n\n## Objective\n\nAdd focused drift and safety tests for the approved Troubleshooting, FAQ, and Changelog content, then regenerate deterministic LLM indexes.\n\n## Scope\n\n- Remove `troubleshooting.md`, `faq.md`, and `changelog.md` from structural stubs in `tests/test_docs.py`.\n- Enforce all seven troubleshooting categories, required entry fields, stable searchable symptoms/errors, canonical links, and credential/destructive-action safety boundaries.\n- Enforce FAQ link-first answers and support/operation boundaries without coupling tests to every prose sentence.\n- Enforce changelog stream separation, dates/versions where applicable, source links, and explicit Unreleased treatment.\n- Preserve public-doc runtime-detail and credential-pattern policies.\n- Regenerate and validate `docs/llms.txt` and `docs/llms-full.txt`.\n\n## Acceptance Criteria\n\n- Tests fail when a required route, category, field, safety boundary, canonical link, release distinction, or evidence marker drifts.\n- Tests do not encode unstable prose beyond deliberately stable user-visible error strings.\n- Deterministic indexes include current help and changelog content.\n- Later Verify passes focused docs/install/config/release-artifact tests, strict docs build, Prettier, Ruff, deterministic generator checks, and `git diff --check`.\n\n## Dependencies And Order\n\nParent `hrn-00178`; order 4. Depends on Stories `hrn-00203`, `hrn-00204`, and `hrn-00205`. Linked design authority: `doc-00017` v2.\n\n## Estimate And Risks\n\nEstimate S. Main risk is brittle prose-level testing; enforce structure, inventory, evidence, and stable boundaries instead.\n\n## Non-Goals\n\nNo product, installer, configuration, package, dependency, runtime, provider, theme/browser, deployment, or release behavior changes."
