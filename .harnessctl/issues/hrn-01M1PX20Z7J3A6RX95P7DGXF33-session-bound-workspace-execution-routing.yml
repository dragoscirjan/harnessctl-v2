"body": "# Session-Bound Workspace Execution Routing\n\n## Objective\n\nProvide the control-plane, execution-plane, and deterministic orchestration foundation that lets long-lived OpenCode and Pi processes remain launched from primary while every project-facing operation executes against the current session's isolated workspace.\n\n## Plan Status\n\nApproved executable Epic plan. Implement only through the ordered children below and approved LLD `doc-01M1PZMXJ99DRRW65A1E22G7TH`.\n\n## Initiative Role\n\nThis is the bootstrap foundation between closed identity/Git primitives (`hrn-00208`, `hrn-00209`, `doc-00019`) and lifecycle integration `hrn-00210`. Deliver it while `skills.cvs.workspaces: false`. After merge, rebuild/install and intentionally reload the stable harness, then replan `hrn-00210`. The broken workspace-routing mechanism is not required to implement itself.\n\n## Approved Design\n\n- Approved HLD: `doc-01M1PX3FGJKTHDVZJFQ7S9J8YX`.\n- Approved linked LLD: `doc-01M1PZMXJ99DRRW65A1E22G7TH`.\n- Host adapters use capability detection and explicit supported ranges. Exact versions remain only in lockfiles and reproducible fixtures.\n\n## Execution Plan\n\n1. Implement a generic execution-context and binding core keyed by `{host, session_id}`. Store strict, schema-versioned workspace and hashed-session records under the Git common directory with stable workspace identity, optional Epic ID, execution root, branch/base/lifecycle, and monotonic generations. Resolve fresh state before every operation.\n2. Extend the `doc-00019` baseline with provisional `ws-<ULID>` identities. New-Epic Plan allocates and binds before authority, then attaches the returned Epic without renaming path or branch. Preserve v1 records; adoption is explicit, exact-match, and non-destructive.\n3. Route project operations through the resolved execution root. Canonicalize paths and nearest existing ancestors; reject traversal, symlink escape, absolute primary access, cross-workspace access, stale generation, missing worktree, repository/Epic mismatch, branch drift, illegal lifecycle, and unsupported tools before mutation.\n4. Add a typed compile-time operation registry and deterministic Plan/bootstrap coordinator. Program code owns executable or declared task, argv, cwd, environment, approval class, legal state, idempotency, timeout/output bounds, transition, and evidence. The model supplies only semantic operation IDs and validated domain inputs.\n5. Extend Config v1 with optional neutral `automation.runner` and `automation.tasks` mappings. Values select reviewed task-runner targets, never shell fragments. Keep TypeScript/Python schema, defaults, fingerprints, installer generation, `.harnessctl/config.yaml`, docs, and contracts synchronized. Map this repository to checked-in `mise.toml` targets.\n6. Integrate OpenCode through `ToolContext.sessionID`, fresh routing for harnessctl tools, and a capability-tested pre-hook allowlist for known built-ins. Reject unsupported/external tools while bound. Routine shell/Git/bootstrap/checks use semantic operations.\n7. Integrate Pi through `sessionManager.getSessionId()`, non-authoritative custom recovery entries, fresh per-call resolution, execution-root-bound built-in overrides, and `tool_call` rejection. Argument mutation alone is not a trust boundary.\n8. Apply one exceptional-command boundary to both hosts: only verbatim user-supplied or separately previewed immutable invocation descriptors receive fresh consent. Exceptional commands are never fallback registry entries or trusted defaults.\n9. Complete disabled compatibility, v1 adoption, generated projections, documentation, package gates, and fresh-process two-session integration. Do not hot-load built artifacts; activation occurs only after merge plus intentional rebuild/install/reload.\n\n## Children And Order\n\n1. `hrn-01M1PZVHHZ2BC4CZYTQ3CP4T36` Story, Workspace identity and session binding core. Depends `hrn-00208`, `hrn-00209`. Estimate M.\n2. `hrn-01M1PZW59JFNBYRC4FXZVNM2RA` Story, Execution-root containment and recovery. Depends child 1. Estimate M.\n3. `hrn-01M1PZWVCG54SEYZ57F23EJHF7` Story, Typed operation registry and bootstrap coordinator. Depends children 1-2. Estimate M-L.\n4. `hrn-01M1PZXQMD9YJ5R042WPBVW2GT` Story, OpenCode session routing adapter. Depends children 1-3. Estimate M.\n5. `hrn-01M1PZXR698GNEG58FZQCDVN5X` Story, Pi session routing adapter. Depends children 1-3. Estimate M.\n6. `hrn-01M1PZYZ30RXGSAA2D953H1PN2` Task, Compatibility, projections, documentation, and integration gates. Depends children 1-5. Estimate M.\n\nChildren 4 and 5 may proceed in parallel only after children 1-3 complete. Child 6 is the final Build gate before Verify.\n\n## Acceptance\n\n- Multiple sessions launched from one primary checkout independently route to distinct execution roots without host `chdir` or relaunch.\n- Filesystem Issues, Documents, repository Memory, comments, checkpoints, source/file operations, tasks, bootstrap, builds, installs, generated state, caches, and artifacts use the bound execution root.\n- Existing-Epic and provisional-Epic Plan flows continue in the same host session and recover after restart.\n- Same trusted state and typed inputs produce the same immutable operation descriptor and digest.\n- Model text cannot alter executable, argv, cwd, environment, approval class, legal transition, or evidence schema.\n- Unsupported capabilities/tools, undeclared tasks, path escapes, stale generations, topology drift, descriptor changes after consent, illegal ordering, and cross-workspace state fail closed before execution or mutation.\n- Dirty primary state is never silently stashed, copied, committed, reset, or discarded.\n- `skills.cvs.workspaces: false` preserves current behavior and creates no v2 workspace or binding state.\n- Existing v1 state remains untouched unless one explicit exact-match adoption succeeds.\n- Minimum and known-compatible OpenCode/Pi fixtures pass capability contracts; missing capabilities yield deterministic diagnostics.\n- Focused package/config/generated/docs tests, formatting, lint, contracts, builds, quality, and fresh-process integration pass through checked-in targets.\n- Fresh-process integration proves two-session authority/file/task/bootstrap isolation and unchanged primary project data.\n\n## Compatibility And Migration\n\n- No existing workspace, branch, commit, issue, document, or memory ID is rewritten.\n- v1 adoption requires one exact repository/path/branch/Epic/lifecycle match and preserves the source record.\n- Unknown schemas and ambiguous candidates remain untouched and fail closed.\n- Neutral Config v1 automation defaults run nothing.\n- Host compatibility is capability/range based; fixtures may pin exact versions for reproducibility.\n\n## Verification And Release Handoff\n\nVerify every Epic and child criterion using focused tests plus checked-in repository quality/build/integration targets. This Epic stops before `hrn-00210` policy work. Release later follows normal consent and Git/PR rules. After merge, rebuild/install and intentionally reload the host before replanning `hrn-00210`; no hot-load is claimed.\n\n## Rollback\n\nDisable workspace routing and session binding while preserving worktrees, branches, v1/v2 workspace records, and binding records for diagnosis or recovery. A previously bound session surfaces the policy change and never silently falls back to primary.\n\n## Risks\n\n- OpenCode may not permit complete safe interception of every built-in; use a proven allowlist and reject unsupported tools.\n- Host APIs may drift; detect required capabilities at runtime and maintain supported-range fixtures.\n- Multi-record state and canonical path handling can violate isolation; require lock/generation and adversarial containment tests.\n- An incomplete operation registry is a capability gap, not permission for model-composed fallback commands.\n\n## Estimate\n\nL, 5-9 engineering days. High uncertainty is concentrated in OpenCode interception semantics, full host tool inventories, and fresh-process integration.\n\n## Non-Goals\n\n- No `hrn-00210` lifecycle-template integration.\n- No workspace enablement during this Epic's implementation.\n- No automatic merge, deployment, stash, primary mutation, cleanup, branch deletion, secret copying, or legacy authority rewrite.\n- No hot-loading modified harness code, repository-global active workspace, persistent process `chdir`, Initiative workspace, Jujutsu support, external daemon, arbitrary MCP proxy, or model-authored routine shell pipeline."
