"body": "# Keep repository-local Pi `sdlc_code_index` MCP config valid\n\n## Summary\n\nKeep the repository-local Pi MCP override for `sdlc_code_index` valid, discoverable, and explicitly user-owned so the generated `sdlc-code-index` skill can point to an external code-index MCP server without harnessctl owning provider lifecycle.\n\n## Scope\n\n- Validate `.pi/mcp.json` uses the Pi MCP adapter stdio shape for `sdlc_code_index`: `command`, `args`, `lifecycle`, and `requestTimeoutMs`.\n- Preserve `sdlc_code_index` as a user-owned external MCP server mapping for the generated `sdlc-code-index` skill.\n- Confirm JSON validity and local `cgc mcp tools` availability.\n- Preserve existing `sdlc_cvs_github` behavior and bytes except for unrelated formatting if required by the JSON writer.\n\n## Non-goals\n\n- No provider install, startup outside MCP handshake, watch, index, delete, reindex, update, or removal.\n- No harnessctl schema, runtime adapter, generated skill template, package artifact, or ownership-boundary change.\n- No external credential, database, model, storage, or remote-state management.\n- No Build, Verify, or Release work during Plan.\n\n## Evidence\n\n- `.pi/mcp.json` is the highest-precedence Pi project MCP override.\n- Pi MCP adapter docs define stdio servers with `command`, `args`, `lifecycle`, and `requestTimeoutMs`; `command` is mutually exclusive with `url` and `socket`.\n- Closed `hrn-00105` made `sdlc-code-index` provider-neutral and external-provider owned; it does not generate or mutate host MCP entries.\n- Closed `hrn-00103` documents external code-index integrations and keeps provider runtime operation user-owned.\n- Closed `hrn-00132` states `sdlc_code_index` already satisfies the namespace direction and remains user-owned.\n- Local evidence during Plan: `.pi/mcp.json` parses with `jq`; `cgc` exists at `/home/dragosc/.local/bin/cgc`; `cgc mcp tools` lists CodeGraphContext MCP tools.\n- Current Pi session did not yet list `sdlc_code_index`; reload or restart is required before visibility can prove active config.\n\n## Ordered executable plan\n\n1. Reload or restart Pi so `.pi/mcp.json` is re-read by the MCP adapter.\n2. Inspect effective MCP server visibility and confirm `sdlc_code_index` appears.\n3. If absent, compare `.pi/mcp.json` against Pi MCP adapter config docs and active discovery layers.\n4. Correct only repository-local Pi config fields required for `sdlc_code_index` discovery.\n5. Validate JSON syntax.\n6. Validate local `cgc mcp tools` availability without running provider lifecycle/index mutation tools.\n7. Confirm `sdlc_cvs_github` remains unchanged.\n\n## Acceptance\n\n- `sdlc_code_index` appears in Pi MCP server list after `/reload` or restart.\n- Server command is exactly `cgc` with args `mcp start`.\n- Timeout uses `requestTimeoutMs`; invalid fields `type`, `enabled`, and `timeout` are absent.\n- `sdlc_cvs_github` remains unchanged.\n- No provider install, watch, index, delete, reindex, update, credential access, database mutation, or remote/destructive operation occurs.\n- Any MCP tool results are treated as advisory; repository files and current issue authority remain authoritative.\n\n## Release, rollback, docs, operations\n\nRelease impact is repository configuration only unless Build discovers packaged artifact impact. Rollback restores prior `.pi/mcp.json` bytes. Operations note: Pi may require `/reload` or process restart before MCP server visibility changes.\n\n## Estimate and uncertainty\n\nEstimate: S. Uncertainty: medium because live Pi MCP server discovery may depend on session reload behavior and external `cgc` runtime state outside repository control.\n\n## Risks\n\n- Current session visibility can be stale after config edits.\n- External provider availability is user-owned and cannot be guaranteed by repository config alone.\n- Invoking provider mutation tools would violate the provider-neutral ownership boundary.\n\n## Plan status\n\nApproved on 2026-08-29. Ready for a separate `work-build hrn-00156` invocation. No Build, Verify, or Release work was performed during Plan."
