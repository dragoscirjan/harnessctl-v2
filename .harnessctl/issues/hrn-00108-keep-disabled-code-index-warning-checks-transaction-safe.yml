"body": "# Keep disabled code-index warning checks transaction-safe\n\n## Defect\n\nDisabled `sdlc-code-index` warning inspection occurs after the installer transaction and smoke-check exception boundary. `_target()` can reject a symlinked dormant path only after unrelated installation writes have committed, producing failure without rollback or the required warning.\n\n## Evidence\n\n- `src/harnessctl/install.py:450-477` contains smoke checks and rollback handling.\n- `src/harnessctl/install.py:478-488` inspects dormant skill paths after that exception boundary.\n- `src/harnessctl/install.py:983-996` rejects symlinks while resolving managed targets.\n\n## Impact\n\nA disabled install encountering a symlinked dormant skill can report failure after other selected-host outputs changed, violating transactional behavior and making the warning outcome unreliable.\n\n## Acceptance Criteria\n\n- All dormant-path validation that can fail occurs before mutation or inside the rollback-protected transaction.\n- A symlinked dormant OpenCode or Pi skill path fails before unrelated files change, or triggers exact rollback after mutation.\n- Regular existing dormant files retain exact bytes and emit one actionable warning per selected host.\n- Fresh disabled installs emit no code-index warning and create no code-index skill.\n- Focused tests cover OpenCode, Pi, and `all` selection with injected dormant symlinks and verify exact tree before-images on failure.\n- Existing enabled generation and non-destructive disabled behavior remain unchanged.\n- No external provider command executes.\n\n## Boundaries\n\nDo not delete, replace, follow, or otherwise mutate dormant symlinks or external provider state. Do not enter Build during Verify."
