    "body": "Build repair evidence: disabled dormant code-index paths are now resolved and symlink-validated before any installer mutation. Post-transaction handling only warns from prevalidated relative paths; it does not re-resolve, follow, delete, or mutate dormant files. OpenCode, Pi, and `all` symlink tests prove exact tree/referent before-images; regular dormant bytes/warnings and fresh-disabled behavior remain covered. Full quality/runtime/validation/diff checks passed; independent scoped re-review approved. No provider execution."
