"body": "# Default managed extension installs to latest unless pinned\n\n## Summary\n\nMake the Python installer install managed extension package sources at the latest published version by default, unless configuration explicitly locks a package source to a specific version.\n\n## Scope\n\n- Python installer version policy for managed extension registrations.\n- OpenCode `.opencode/opencode.json` plugin entries.\n- Pi `.pi/settings.json` package entries and `pi install -l` sources.\n- All managed extension packages, starting with `@harnessctl/opencode-tools` and `npm:@harnessctl/pi-tools`.\n\n## Non-goals\n\n- Do not publish packages.\n- Do not change runtime extension code.\n- Do not Build, Verify, or Release during Plan.\n\n## Evidence\n\n- `src/harnessctl/install.py`: `OPENCODE_TOOLS_PLUGIN = \"@harnessctl/opencode-tools@latest\"`; `PI_TOOLS = \"npm:@harnessctl/pi-tools@latest\"`.\n- `_merge_opencode_json` currently treats any `@harnessctl/opencode-tools@...` entry not equal to `@latest` as a conflict unless `force=True`.\n- `_inspect_pi_packages` currently rejects any related Pi package source not exactly equal to the required source.\n- Tests assert `@harnessctl/opencode-tools@latest` and `npm:@harnessctl/pi-tools@latest` in `tests/test_install.py`.\n- `sdlc_code_index` MCP server unavailable; direct source search used.\n\n## Ordered executable plan\n\n1. Define managed install-source policy helpers.\n   - Distinguish package identity from source version/tag.\n   - Represent default desired source as `latest`.\n   - Represent explicit locked source as exact preserved value.\n   - Cover npm-prefixed Pi sources and bare OpenCode plugin sources.\n\n2. Apply policy to installer reconciliation.\n   - OpenCode: stale managed default entries upgrade to latest; explicit pins remain exact when recognized as locked; duplicates still fail safely.\n   - Pi: package inspection accepts exact locked managed sources; missing default installs use latest; `pi install -l` uses resolved desired source.\n   - Keep extension-filter rejection for required packages that must autoload all extensions.\n\n3. Add/update tests and docs.\n   - Fresh install writes latest sources.\n   - Existing stale managed default upgrades to latest when not locked.\n   - Explicit locked source is preserved and not treated as conflict.\n   - Force behavior remains safe and explicit.\n   - Duplicate/conflict cases still fail before mutation.\n   - Docs describe latest-by-default and pinned-version override.\n\n## Acceptance\n\n- `@harnessctl/opencode-tools` and `npm:@harnessctl/pi-tools` install as latest by default.\n- Operator-pinned versions remain pinned.\n- Other managed extension installs follow the same policy.\n- OpenCode and Pi host JSON stay valid and preserve unrelated operator content.\n- Existing rollback and no-symlink/no-overwrite safety behavior remains intact.\n\n## Risks\n\n- Ambiguity: current config may not expose a formal lock flag; Build must confirm lock representation before editing.\n- Existing tests encode old conflict behavior for stale versions and must be deliberately updated.\n- Pi package source normalization must not weaken extension autoload validation.\n\n## Recommended next step\n\nRun `work-build hrn-00152`.\n"
