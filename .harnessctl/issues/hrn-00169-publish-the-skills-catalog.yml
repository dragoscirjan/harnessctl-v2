"body": "# Publish the Skills catalog\n\n## Objective\n\nHelp users discover and choose each shipped harnessctl skill by purpose, usage context, support, limitations, and evidence-backed status.\n\n## Outcome\n\nReplace the implementation-heavy Skills page with a reader-first catalog that explains what each skill is for, when to use it, what result to expect, where it is available, and what it cannot prove or authorize.\n\n## Information Design\n\n- Explain that a skill is reusable LLM guidance, not a node module, MCP server, configuration declaration, available tool, permission, or proof of provider operation.\n- Lead with a Choose by goal matrix for SDLC delivery, code quality, concise communication, TDD, code intelligence, memory, issue tracking, and version control.\n- Catalog exactly `sdlc`, `sdlc-code`, `sdlc-caveman`, `sdlc-develop-tdd`, `sdlc-code-index`, `sdlc-memory`, `sdlc-issue-tracking`, and `sdlc-cvs`.\n- Give every entry the same contract: purpose, use when, expected result, OpenCode and Pi availability, activation or configuration, prerequisites, limits, textual status, and adjacent evidence.\n- Preserve exact installation differences: core SDLC, code guidance, CVS, and issue tracking always install for selected hosts; TDD and Code Index require enablement; Caveman and Memory differ between OpenCode and Pi.\n- Keep legacy ID migration as a short compatibility note rather than the primary user journey.\n- Link exact settings to Skill Configuration, harness status to Harnesses, external capabilities to MCP Servers, and implementation packages to Node Modules.\n\n## Scope\n\n- Rewrite `docs/skills.md` around user goals and the fixed eight-entry catalog contract.\n- Reconcile claims against the canonical skill registry, root templates, installer behavior, generated outputs, current tests, and shared status/evidence vocabulary.\n- Replace brittle prose assertions with exact inventory, entry-contract, support, status, provenance, cross-link, and generated-index gates.\n- Preserve supported migration and dormant-skill facts without duplicating configuration or adapter implementation references.\n\n## Execution Order\n\n1. `hrn-00185` publishes the reader-first eight-skill catalog.\n2. `hrn-00186` enforces exact inventory and evidence drift gates after the catalog exists.\n\n## Acceptance Criteria\n\n- Every shipped skill is discoverable by canonical ID and user goal.\n- Catalog headings, the canonical registry, and eight root skill templates match exactly.\n- Every entry contains purpose, use conditions, expected result, supported harnesses, activation, dependencies, limitations, status, and provenance.\n- OpenCode and Pi installation conditions match current installer behavior.\n- Working claims use the shared textual status vocabulary and place source plus automated-test evidence next to the claim.\n- Claude and Codex limitations link to Harnesses instead of implying generated-skill support.\n- Documents and Web Retrieval are explicitly configuration domains, not generated skills.\n- Readers can distinguish a skill, node module, MCP server, configured declaration, available tool, permission, and verified provider operation.\n- Missing or extra skills, required entry fields, stale support mappings, unsupported statuses, ownership duplication, broken links, or stale LLM indexes fail focused checks.\n- Strict MkDocs, deterministic LLM generation, formatting, link checks, and focused documentation tests pass.\n\n## Evidence Sources\n\n- `src/harnessctl/templates.py` for canonical IDs and resource inventories.\n- `src/harnessctl/templates/skills/*/SKILL.md.j2` for purpose and behavioral boundaries.\n- `src/harnessctl/install.py` and installation tests for host and activation behavior.\n- `docs/status-and-evidence.md` for public status and provenance semantics.\n- Skill Configuration, Harnesses, MCP Servers, and Node Modules pages for linked ownership.\n\n## Risks\n\n- Generated, installed, enabled, discoverable, loaded, and operational are different states and must not be conflated.\n- OpenCode and Pi activation differences can drift unless tests derive expectations from current authority.\n- Existing prose-coupled tests can preserve obsolete implementation detail instead of user-facing contracts.\n- Provider or tool availability can become stale and must never be inferred from skill presence.\n\n## Dependencies And Release Boundary\n\nDepends only on closed foundation Epic `hrn-00167`. Cross-links to references, modules, MCP catalogs, and harness support are non-blocking.\n\nAfter Build and Verify, release through one scoped feature branch, commit, push, and ready pull request with fresh remote consent. No deployment or automatic merge.\n\n## Non-Goals\n\nDo not add, rename, configure, install, operate, or change the behavior of skills, adapters, modules, MCP servers, providers, or host integrations. Do not create a new HLD or LLD. Do not duplicate exact configuration field contracts or implementation-package catalogs."
