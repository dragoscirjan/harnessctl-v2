"body": "# Define and generate the Config v1 contract\n\n## Objective\n\nEstablish TypeScript Zod as the sole hand-maintained Config v1 shape/default authority and produce deterministic portable artifacts for all runtimes.\n\n## Scope\n\n- Rename the paused v3 contract slice to the first stable v1 model without losing validated behavior.\n- Define the capability-oriented Config v1 model and canonical defaults.\n- Generate `config-v1.schema.json` and `config-v1.defaults.json`.\n- Ship generated artifacts in npm and Python package layouts.\n- Add deterministic generation, fingerprints, and stale-artifact checks.\n- Retire Config v2/v3 config schemas and artifacts while preserving unrelated `memory-record-v1.schema.json`.\n- Fail generation when required Zod semantics cannot be represented portably.\n\n## Acceptance Criteria\n\n- Every Config v1 field, default, enum, safety constraint, and cross-field rule has one hand-maintained authority.\n- `configV1Schema` and `CONFIG_V1_DEFAULTS` are the canonical Config symbols; no Config v2/v3 config authority remains.\n- Generation deterministically produces the approved Config v1 schema/default artifacts with matching package fingerprints.\n- A stale generated artifact fails an automated check without rewriting under check mode.\n- Source, npm, and Python distribution tests resolve the Config v1 artifacts distinctly from memory-record v1 artifacts.\n- No runtime consumer migration is required for this Story to complete.\n\n## Dependencies\n\nNone.\n\n## Artifacts\n\n- `doc-00015` Config v1 Architecture and Ownership.\n- `doc-00016` Config v1 Contract, Generation, and Host Projection.\n\n## Estimate\n\nM. Existing tested v3 work is reusable, but every symbol, artifact path, package assertion, and contract identifier must be checked for stale version references.\n\n## Non-Goals\n\nRuntime consumer migration, MCP projection changes, documentation release, Config v2/v3 compatibility or migration code."
