    "body": "Implemented Config v1 generic MCP projection and permanent adopt-on-edit reconciliation. URL/command declarations produce neutral intents; OpenCode/Pi adapters infer host transport. Added trustworthy generated provenance for exact lifecycle update/removal; absent and exact desired paths are idempotent. Any pre-existing, modified, unproven, or provenance-divergent same-ID entry becomes permanently operator-owned, remains byte-preserved, and cannot be reclaimed, overwritten, or deleted under normal or force paths, even if it later equals desired output. Warnings identify ID/host/remediation without credential values. Lowercase environment targets align with Config v1 while credential source references retain safety validation. Tests cover both hosts, creation, idempotence, historical/generated update/removal, modified and pre-existing collisions, force, provenance chains, unrelated preservation, and credential-safe warnings. Build checks: 649 Python tests, Ruff format/lint, `git diff --check`; independent review round 3 approved with 214 focused tests and no findings. Full Verify and concurrent host-file mutation remain Verify-phase risks. No Verify, Release, commit, remote, destructive, or stash action performed."
