"body": "# Compile generic MCP declarations without reclaiming operator edits\n\n## Objective\n\nCompile Config v1 host-neutral URL/command MCP declarations into OpenCode and Pi configuration while permanently preserving pre-existing or operator-modified host entries.\n\n## Scope\n\n- Validate mutually exclusive URL-oriented and command-oriented declarations without a transport/type field.\n- Convert declarations to projection-neutral server intent.\n- Infer and render host-native transport only in OpenCode/Pi adapters.\n- Reconcile exact generated and recognized historical entries.\n- Adopt every other same-ID entry as operator-owned, preserve it byte-for-byte, and warn.\n- Remove overwrite/delete behavior for operator-owned entries, including force paths.\n\n## Acceptance Criteria\n\n- Config v1 has no MCP transport discriminator.\n- Adapters select the correct host-native transport from declaration shape.\n- Absent entries are created; exact desired entries are idempotent; exact recognized generated entries may update or be removed.\n- Pre-existing collisions and post-generation edits remain byte-preserved under normal and force compilation.\n- Unrelated host configuration remains unchanged.\n- Warnings identify server ID, host target, and safe manual remediation without exposing credentials.\n- Tests cover URL and command projection, creation, update, removal, historical values, collisions, edits, normal/force behavior, and both hosts.\n\n## Dependencies\n\nDepends on `hrn-00161` and `hrn-00162`.\n\n## Artifacts\n\nImplements MCP decisions in the Config v1 successors of `doc-00015` and `doc-00016`.\n\n## Estimate\n\nM.\n\n## Non-Goals\n\nInstalling, starting, authenticating, monitoring, or operating MCP servers; arbitrary host-native fields; forced ownership reclamation; Config v2/v3 compatibility."
