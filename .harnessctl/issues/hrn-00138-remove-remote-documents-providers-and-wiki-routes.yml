"body": "# Remove remote Documents providers and wiki routes\n\n## Goal\n\nDelete the unintended remote/provider Documents architecture while preserving local Documents and unrelated CVS/Issues behavior.\n\n## Scope\n\n- Remove GitHub, GitLab, Gitea, and Forgejo Documents branches from Python and TypeScript config, generated JSON Schema, templates, examples, fixtures, docs, and tests.\n- Remove Documents wiki contracts, provider capability mappings, credentials fields, MCP intents, fixed IDs/reservations, lookup paths, and remote guidance.\n- Reject legacy remote Documents config with a bounded removal instruction; never convert it to filesystem authority or retry through another route.\n- Preserve CVS and Issues provider configuration, commands, historical Gitea reconciliation, and operator-owned host data.\n- Add active-surface stale-provider audits with explicit exclusions for immutable comments, memory, changelog history, and superseded designs.\n\n## Acceptance Criteria\n\n- [ ] Current runtime and generated schemas accept no remote Documents authority, provider field, repository/URL/token field, or custom root/prefix.\n- [ ] No Documents wiki contract, MCP intent/ID/reservation, credential mapping, provider fixture, or operator guidance remains active or packaged.\n- [ ] Legacy remote config fails before local barrier/filesystem/cache access and without fallback or mutation.\n- [ ] CVS/Issues Gitea and Forgejo behavior remains byte- and route-compatible, including migration and rollback regressions.\n- [ ] Python, TypeScript, schema, installer, artifact, docs, package, and stale-active-surface tests pass."
