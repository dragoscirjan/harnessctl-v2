"body": "As a project operator\nI want configurable CVS and MCP-aware issue workflows\nSo that agents can use verified CLI or MCP transports across supported hosts.\n\n## Acceptance\n\n- [x] CVS config supports git/jj and GitHub/GitLab/Gitea/Forgejo.\n- [x] Issues and CVS skills select valid CLI/MCP transports deterministically.\n- [x] OpenCode and Pi MCP configuration installs safely without secrets.\n- [x] Documentation, artifacts, rollback, and cross-platform tests pass.\n\n## Design\n\n- `.specs/hld-00008-configurable-cvs-mcp-aware-issues-and-generated-host-mcp-configuration-v1.md`\n- `.specs/lld-00008-configurable-cvs-mcp-aware-issues-and-host-mcp-configuration-v1.md`"
