"body": "# Enforce documentation foundation quality gates\n\n## Objective\n\nFail visibly when the approved information architecture, rendering, accessibility conventions, evidence semantics, links, or generated outputs drift.\n\n## Scope\n\n- Keep the strict documentation build in the repository quality workflow.\n- Enforce the exact approved route inventory, explicit downstream ownership, and absence of legacy navigation groups.\n- Enforce canonical Markdown inventory and prohibition of domain claims in structural stubs.\n- Protect MkDocs search, code-copy, theme, responsive navigation, previous and next navigation, source authority, generated-site exclusion, and local tasks.\n- Test inline, reference-style, and anchored rendered evidence-link transformation outside fenced examples.\n- Preserve Mermaid syntax checks, accessible titles and descriptions, and diagram and text parity.\n- Protect visible plain-text status and evidence semantics.\n- Enforce deterministic generation and freshness of `llms.txt` and `llms-full.txt`.\n- Define later Verify criteria for desktop and mobile navigation, keyboard reachability, visible focus, contrast, readable light and dark presentation, responsive tables and code, Mermaid browser rendering, and generated-output inspection.\n\n## Acceptance Criteria\n\n- Missing or unexpected public routes, wrong ownership, legacy navigation, unsupported stub claims, broken source links, unresolved rendered links, malformed status definitions, inaccessible diagram structure, or stale LLM indexes fail deterministic local checks.\n- `mise run docs-build` remains strict and network-free.\n- Foundation checks cover only shared shell contracts, not downstream domain-content completeness.\n- Manual browser verification criteria are explicit for desktop and mobile but are executed only during formal Verify.\n- Focused owned checks report independently when repository-wide quality is blocked by unrelated existing files.\n\n## Dependencies And Order\n\nOrder 4. Depends on `hrn-00172`, `hrn-00173`, and `hrn-00179`.\n\n## Design Input\n\nApproved `.harnessctl/documents/doc-00017-documentation-website-foundation-and-information-architecture-v2.md` governs this Story.\n\n## Estimate\n\nM. Main uncertainty is deterministic rendered-output and accessibility coverage without making routine checks depend on a network or installed browser.\n\n## Existing Evidence\n\nCurrent tests already protect strict builds, current inventory and navigation, status vocabulary, evidence links, Mermaid integration, and several page claims. Old inventory, navigation, and domain-content assertions must be replaced rather than treated as the revised contract.\n\n## Non-Goals\n\n- Public deployment tests.\n- Full third-party accessibility certification.\n- Domain-content completeness checks owned by later Epics.\n- Product runtime changes.\n- Modifying unrelated `.opencode/opencode.json` or `.pi/settings.json` changes."
