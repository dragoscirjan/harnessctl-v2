    "body": "Build implementation complete; task remains in_progress pending separate closure confirmation and formal Verify. Removed TDD ownership marker and all disabled-state cleanup/warning/claim/specialized rollback behavior. Disabled reinstall now leaves generated or operator skill files byte-identical and dormant; fresh disabled installs generate no skill; disabled Build/Continue contain no TDD loading or enforcement. Enabled OpenCode/Pi skill and policy parity remain covered. Evidence: focused TDD installer tests 9 passed; affected Python suite 211 passed with 8 expected existing warnings; `mise run quality` passed (Python 255, Node 181, all configured gates); Ruff, Prettier, and `git diff --check` passed. Runtime smoke and independent review remain for `work-verify hrn-00074`."
