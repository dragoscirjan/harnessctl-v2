"body": "## Objective\n\nRemove TDD artifact cleanup and ownership metadata so `workflow.tdd.enabled` controls generated workflow use rather than filesystem deletion.\n\n## Scope\n\n- Remove TDD ownership-marker generation and disabled-state deletion, warning, stale-marker, private-claim, and specialized rollback logic from `src/harnessctl/install.py`.\n- Replace cleanup and race tests with focused coverage for fresh-disabled absence and enabled-to-disabled dormant-skill retention.\n- Update `docs/skills.md` to state that disabled installs leave existing TDD skill files untouched.\n- Preserve enabled OpenCode/Pi installation, byte parity, Build activation, Continue-to-Build activation, package inclusion, and existing installer conflict/rollback behavior.\n\n## Acceptance\n\n- [ ] No TDD ownership marker is generated.\n- [ ] A disabled reinstall never deletes or warns about existing TDD skill files.\n- [ ] A skill installed while enabled remains byte-identical after reinstalling with TDD disabled.\n- [ ] Fresh disabled installs do not generate `develop-tdd`.\n- [ ] Disabled Build and Continue guidance neither loads nor enforces TDD.\n- [ ] Enabled OpenCode/Pi behavior remains byte-equivalent.\n- [ ] Focused tests and `mise run quality` pass.\n\n## Dependencies and Order\n\nDepends on completed `hrn-00076`. Complete before final verification task `hrn-00077`.\n\n## Non-Goals\n\n- Runtime toggling without reinstall.\n- Deleting dormant or operator-owned skill files.\n- Changing the TDD skill content, configuration contract, host selection, or Plan/Verify/Release/merge behavior.\n- Framework-specific test commands.\n\n## Estimate and Uncertainty\n\nSmall. Primary changes are installer, focused tests, and skills documentation. Uncertainty is limited to simplifying cumulative lifecycle coverage without weakening enabled-path evidence."
