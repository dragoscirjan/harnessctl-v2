"body": "# Publish evidence-backed installation guidance\n\n## Objective\n\nDocument the shortest supported source-checkout installation path for OpenCode and Pi without overstating unsupported distribution or harness paths.\n\n## Scope\n\n- Replace the structural stub in `docs/installation.md` with prerequisites and source-checkout installation steps.\n- Cover target-project selection, harness selection, Pi package consent, generated locations, host reload/restart, conflicts, forced replacement, managed skill-set replacement, and rollback.\n- Derive claims from current installer source, tests, `mise.toml`, and existing canonical documentation.\n\n## Acceptance Criteria\n\n- Prerequisites distinguish the harnessctl source checkout, destination project, selected supported harness, host model/provider configuration, `mise`, and `uv` requirements.\n- OpenCode and Pi commands and target locations are evidence-backed and identify Pi's interactive and noninteractive package-consent boundary.\n- Installation explains expected generated commands/skills/tools, host reload or restart, conflict behavior, `--force`, and the separately consented `--replace-sdlc-skill-set` migration boundary.\n- Rollback uses a prior harnessctl version or revision with `--force` and accurately describes user-owned or legacy content that is not deleted automatically.\n- Claude and Codex are explicitly unsupported and link to the Harnesses page for current status.\n- No package-index or binary distribution path is claimed unless current repository evidence proves it supported.\n\n## Dependencies And Order\n\nNo child dependency. The Epic dependency `hrn-00167` is already closed. This Story may proceed in parallel with the Home and Docs landing Story.\n\n## Linked Artifacts\n\nApproved `doc-00017` v2 defines the route and ownership boundary; no new design artifact is required.\n\n## Estimate And Uncertainty\n\nEstimate `M`. Medium uncertainty because installer flags, consent behavior, generated locations, and rollback claims require source-and-test reconciliation.\n\n## Non-Goals\n\n- Changing installer behavior, adding distribution channels, configuring model providers, or operating external packages.\n- Replacing the Harnesses catalog or exhaustive configuration/reference content.\n- Supporting Claude or Codex.\n- Publishing or deploying generated site output."
