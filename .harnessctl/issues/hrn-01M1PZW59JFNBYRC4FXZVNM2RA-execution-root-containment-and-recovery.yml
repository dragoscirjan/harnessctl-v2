"body": "# Execution-root containment and recovery\n\n## Objective\n\nResolve one immutable project execution context per host session and route project-facing generic operations to it without changing the host process cwd.\n\n## Scope\n\n- Implement control-root repository discovery and fresh binding/workspace/Git validation before each project operation.\n- Return explicit primary and execution roots plus repository, workspace, Epic, lifecycle, and generation evidence.\n- Canonicalize existing paths and nearest existing ancestors for new paths; reject traversal, symlink escape, absolute primary access, and cross-workspace access.\n- Route generic config, filesystem Issues, Documents, repository Memory, comments, links, checkpoints, artifacts, and caches through explicit execution roots.\n- Define exact recovery from host evidence and common-directory authority; reject ambiguity, missing worktrees, branch drift, Epic mismatch, illegal lifecycle, or stale generations.\n- Preserve separately registered control-plane/integration access to primary without treating arbitrary absolute paths as authorization.\n\n## Acceptance\n\n- Two sessions launched from one primary resolve and mutate only their independently bound workspace authorities and files.\n- No downstream generic operation re-infers project root from process cwd after resolution.\n- Existing and new targets cannot traverse or symlink outside the execution root.\n- Absolute primary and other-workspace paths fail before reads or mutations unless a registered control/integration operation owns them.\n- Restart recovery accepts one exact current record and rejects stale or ambiguous evidence.\n- Missing worktree, repository mismatch, branch drift, Epic mismatch, closed lifecycle, and stale generation return stable typed failures.\n- Workspace-disabled mode preserves existing adapter roots and creates no binding lookup side effects.\n\n## Artifacts\n\n- Execution-context resolver and containment helpers under `extensions/generic-tools`.\n- Root-aware adapter seams for generic config, issue, document, memory, and artifact operations.\n- Focused isolation, canonicalization, symlink, topology, recovery, and disabled-parity tests.\n\n## Dependencies And Order\n\nSequence 2. Depends on `hrn-01M1PZVHHZ2BC4CZYTQ3CP4T36`. Blocks the operation coordinator and host adapters.\n\n## Estimate\n\nM, medium uncertainty around cross-platform realpath behavior and complete generic-operation coverage.\n\n## Non-Goals\n\n- No host-specific interception, free-form external-tool proxy, lifecycle-template policy, automatic reconciliation, primary mutation, or workspace enablement."
