    "body": "Build slice implemented. `ServerIntent` now supports optional local URLs and validated ordered environment-name bindings; OpenCode/Pi omit empty environment objects while existing CVS projections remain exact. Added fixed `code_index` identity and provider-neutral recognized-definition reconciliation: switch requires force, exact disabled entries are removed, divergent entries are warned/preserved, unrelated JSON is retained, and injected failure restores the exact tree. Tests use inert fixture commands only; no third-party lifecycle executes. Evidence: `tests/test_mcp_projection.py` 21 passed; `tests/test_install.py` plus projection suite 182 passed with 8 established warnings; `mise run quality` passed (Python 278, Node 189); Ruff and `git diff --check` passed. Task remains in_progress; real provider mappings and skill work remain out of scope."
