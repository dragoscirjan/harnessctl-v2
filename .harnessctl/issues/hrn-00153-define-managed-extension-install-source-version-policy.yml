"body": "# Define managed extension install-source version policy\n\n## Summary\n\nDefine helper model for managed extension source identity, default latest source, and explicit pinned source.\n\n## Scope\n\n- Support OpenCode bare plugin source syntax, e.g. `@harnessctl/opencode-tools@latest`.\n- Support Pi package source syntax, e.g. `npm:@harnessctl/pi-tools@latest`.\n- Cover future managed extension packages through shared helpers, not package-specific string checks only.\n\n## Acceptance\n\n- Helpers can identify the managed package identity independent of version/tag.\n- Helpers can produce default latest source.\n- Helpers can represent/preserve explicit locked source.\n- Invalid/malformed package entries still fail safely before mutation.\n"
