"body": "# Preserve unrelated top-level JSON bytes during MCP migration\n\n## Defect\n\nMCP identity migration preserves raw values for untouched MCP-container members but reserializes unrelated top-level operator values.\n\n## Classification\n\nConfirmed compatibility defect discovered during Verify. It violates `hrn-00132` acceptance requiring modified legacy entries and unrelated operator JSON to remain byte-equivalent.\n\n## Evidence\n\n- `src/harnessctl/install.py::_dump_json_preserving_unchanged_members` extracts raw top-level members only to locate the MCP container, then preserves raw values solely for unchanged container members.\n- A direct exact-legacy migration probe changed unrelated top-level `{\"weight\":1e+02}` to formatted `{\"weight\":100.0}` while preserving the untouched MCP sibling value text.\n- Existing migration tests assert raw modified-legacy MCP values but do not assert raw unrelated top-level values.\n- `mise run quality` and `mise run build` pass, so current gates do not detect this acceptance failure.\n\n## Scope\n\n- Preserve exact raw JSON value text for every unchanged unrelated top-level member while changing only harnessctl-owned host members.\n- Preserve existing raw-value behavior for unrelated MCP siblings and modified legacy entries.\n- Cover OpenCode and Pi, all four providers, force and non-force migration, and transaction rollback.\n- Do not preserve or restore values at harnessctl-owned paths that the approved install must change.\n- Do not broaden legacy recognition or mutate arbitrary/global configuration.\n\n## Acceptance\n\n- [ ] Exact legacy migration changes only owned MCP identity paths and other explicitly owned host paths.\n- [ ] Unchanged unrelated top-level values remain byte-equivalent, including noncanonical numeric and escape spellings.\n- [ ] Unchanged unrelated MCP sibling values and modified legacy definitions remain byte-equivalent with bounded warnings.\n- [ ] OpenCode/Pi provider, force, and rollback coverage detects any raw-value normalization regression.\n- [ ] `mise run quality` and `mise run build` pass.\n\n## Impact\n\nUpgrade can rewrite operator-authored JSON representation outside harnessctl ownership despite semantic equivalence. No secret exposure or provider-side operation is involved."
