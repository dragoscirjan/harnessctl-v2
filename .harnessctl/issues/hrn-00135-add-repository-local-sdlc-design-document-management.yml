"body": "# Add repository-local SDLC design document management\n\n## Outcome\n\nProvide an SDLC-owned design-document domain comparable to filesystem Issues: one fixed repository authority, four design kinds, nine normalized lifecycle tools, disposable SQLite projection, and thin OpenCode/Pi adapters. The Documents lifecycle is the product. This repository's completed `.specs` conversion is bootstrap history, not a shipped harnessctl feature.\n\n## Authority\n\n- Canonical active Markdown lives directly under `.harnessctl/documents`; archive and ordinary lifecycle recovery state remain beneath that fixed root.\n- SQLite is disposable and rebuilt only from a completely validated Documents, Issues, and Memory graph.\n- Kinds are exactly `hld`, `lld`, `design-overview`, and `gdd`; statuses are `draft`, `review`, and `approved`.\n- Task artifacts, Issues, Memory, and inert `.specs-v1` history remain separate domains.\n- Remote wikis, provider routes, Documents MCP intents, configurable roots/providers, `.specs`, `.ai.tmp`, and user-global OpenCode/Pi files are not authorities.\n\n## Scope\n\n- Retain `document_id`, `document_create`, `document_list`, `document_get`, `document_update`, `document_version`, `document_validate`, `document_archive`, and `document_restore` with strict local semantics.\n- Keep deterministic IDs, exact-byte optimistic revisions, immutable versions, locking, bounded no-follow reads, atomic publication/rollback, ordinary Documents journal recovery, archive/restore, issue-reference preflights, and cache repair.\n- Validate the complete proposed Documents graph before every publication, including file, aggregate-byte, lineage-version, destination, encoded-byte, and issue-link limits.\n- Integrate document generation, review, approval, versioning, validation, and approved-path linking into SDLC Plan; expose identical generic/OpenCode/Pi contracts without a Documents skill or agent.\n- Preserve all 19 converted records across 14 lineages, their canonical issue links, embedded `metadata.legacy_spec`, v1-v3 history, two approved v4 successors, immutable comments, and `.specs-v1`.\n- Before removing temporary completion evidence, bind its exact 19 source/target paths, source/target digests, and lineage identities into immutable checked-in preservation evidence validated against canonical files and metadata after deletion.\n- Remove every migration-only API, CLI option, runtime, Python bridge, streaming publisher, recovery/completion protocol, package resource, generated artifact, build hook, provenance carrier, test, and current operational instruction.\n- Remove remote Documents config/wiki contracts/provider intents and exact managed generated-skill output while preserving modified operator output with warning.\n- Preserve all CVS and Issues Gitea/Forgejo behavior, historical managed-definition handling, task links, Memory, external MCP configuration, and unrelated host state.\n\n## Non-Goals\n\n- Supporting migration or upgrades from `.specs` in this or any external repository.\n- Retaining a reusable or disposable migration helper after the completed repository conversion.\n- Rewriting superseded designs, immutable issue comments, memory, changelog history, or `.specs-v1` evidence.\n- Remote Documents providers, credentials, synchronization, provider SDKs, future-provider seams, agents, generated Documents skills, generic drafts, task documents, PRDs, attachments, WYSIWYG editing, or full-text search.\n\n## Acceptance Criteria\n\n- [ ] Only fixed repository-local Documents authority and exactly four design kinds are accepted across Python, TypeScript, schemas, adapters, cache, docs, and artifacts.\n- [ ] All nine lifecycle tools are deterministic, bounded, cross-platform, exact-revision safe, atomic, recoverable, and equivalent through OpenCode and Pi.\n- [ ] Every mutation validates its complete proposed graph before publication; valid 2,000-to-2,001 file and 100-to-101 version transitions reject with canonical bytes and SQLite generation/rows unchanged.\n- [ ] Ordinary Documents lifecycle recovery, archive/restore, issue-reference preflights, cache cold/corrupt rebuild, and exact revision behavior remain covered.\n- [ ] All 19 converted records and 14 lineages remain content-preserved and valid alongside the two approved v4 successors; every converted record retains complete legacy provenance.\n- [ ] Temporary completion evidence and persistent checked-in preservation evidence agree on all 19 source/target paths, digests, and lineage identities before deletion; afterward the persistent evidence validates canonical targets and metadata without the completion record.\n- [ ] Canonical structured issue links resolve; no new `.specs` or `.ai.tmp` link compatibility exists; `.specs-v1` remains inert and unchanged.\n- [ ] Installer API/help, Python artifacts, npm exports/bin/tarballs, root scripts, lockfile direct declarations, current docs, active designs, and generated output expose no migration capability.\n- [ ] No Documents wiki route, provider contract, MCP intent/ID/reservation, credential field, generated skill, or agent remains. Exact old managed skill output is removed transactionally; modified operator content is preserved with warning.\n- [ ] Existing CVS/Issues provider separation, historical Gitea/Forgejo preservation, task links, Memory, external MCP configuration, and unrelated host JSON remain covered.\n- [ ] Tests with absent/hostile `HOME` prove no reads or copies from user-level OpenCode/Pi configuration.\n- [ ] Current docs point to approved v4 designs and explain fixed authority/lifecycle, approved-path issue linking, errors, and historical-evidence exclusions without migration or remote-provider guidance.\n- [ ] Package parity, Changeset scope, stale-active-surface audits, full quality, full build, Documents validation, Issues validation, and final dirty-worktree loss review pass.\n\n## Design\n\nApproved HLD `doc-00013` v4 and LLD `doc-00014` v4 supersede v3 for active decisions. Earlier versions, immutable comments, and `.specs-v1` remain historical evidence.\n\n## Delivery\n\nReuse existing children only. Preserve converted authority and persistent evidence first; reconcile issue links; remove migration-only surfaces; retain ordinary Documents recovery; rebuild artifacts and run complete gates. Create no migration helper and no new issue."
