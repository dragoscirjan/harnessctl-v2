"body": "# Integrate Graphify\n\n## Objective\n\nProject Graphify as a portable local structural provider selected by `mcp.servers.sdlc-code-index` for OpenCode and Pi.\n\n## Isolated Scope\n\n- Define strict `providers.graphify` typed options and documented defaults for safe graph paths, code-only mode, and other non-secret controls.\n- Keep executable command, arguments, fixed ID, target environment names, and credentials code-owned.\n- Map the selected provider to its documented operator-installed MCP serving command.\n- Generate exact fixed-ID `sdlc-code-index` OpenCode and Pi entries without installing, probing, extracting, or serving a graph.\n- Specialize the `sdlc-code-index` skill for portable graph queries, confidence-aware relationships, source verification, and stale/unavailable fallback.\n- Document operator-owned extraction, graph refresh, optional semantic/model processing, privacy, and code-only local mode.\n\n## Acceptance Direction\n\n- Missing Graphify options normalize consistently in Python, TypeScript, Zod, and generated schema.\n- Code-only defaults require no model credential.\n- Host entries use fixed ID `sdlc-code-index` and equivalent supported semantics.\n- Tests validate configuration and projection without extracting or serving a graph.\n- Documentation distinguishes deterministic code extraction from optional semantic processing.\n\n## Dependencies and Order\n\nDepends on `hrn-00084`; planned after CodeGraphContext.\n\n## Non-Goals\n\n- Do not install Graphify, run extraction, own graph output, start servers, or make commands project-configurable.\n- Do not guarantee relationship precision beyond independently verified provider behavior.\n"
