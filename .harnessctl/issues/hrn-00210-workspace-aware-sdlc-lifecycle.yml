"body": "# Workspace-Aware SDLC Lifecycle\n\n## Objective\n\nMake every Epic lifecycle command enforce and preserve the configured Epic workspace boundary while retaining existing behavior when workspace support is disabled.\n\n## Approved Design\n\nUse the normalized Git workspace contract in `doc-00019` without changing its primitives. Compile `skills.cvs.workspaces` into OpenCode and Pi SDLC resource rendering and gate lifecycle policy on that capability.\n\n- Initiative Plan never creates a workspace.\n- New or uncommitted Epic authority stops with an explicit external handoff: commit the named authority file from the clean primary checkout, then rerun `work-plan <epic-id>`. Plan does not commit, push, switch the host cwd, or imply that it did.\n- For committed Epic authority, Plan calls `workspace_ensure`. Invocation from primary returns the deterministic workspace path and stops for reinvocation there; invocation from the exact existing Epic workspace may continue planning.\n- Build, Verify, Release, and Continue obtain authoritative workspace status and stop before phase mutation when cwd, branch, mapping, Epic identity, or lifecycle state is wrong.\n- Checkpoints carry advisory workspace identity and lifecycle evidence. Fresh issue, source, Git, tests, provider, and workspace status remain authoritative.\n- After a verified ready PR, Release requests normal local mutation confirmation, calls `workspace_mark_cleanup_ready`, verifies that state, and stops. It never merges, removes the active cwd, or deletes the branch.\n- Physical cleanup is a later explicit `workspace_cleanup` invocation from the exact primary checkout under `doc-00019`.\n\n## Scope\n\n- Compile workspace capability context through `src/harnessctl/install.py` and SDLC rendering.\n- Update canonical Plan, Build, Verify, Release, Continue, and checkpoint templates.\n- Update generated OpenCode and Pi projections.\n- Update `docs/sdlc.md` and `FLOWS.md`.\n- Add policy and integration tests for enabled and disabled configurations.\n\n## Delivery Plan\n\n1. `hrn-01M1MV650AKH2ZH6Z5HQSGGMV5` - Plan workspace bootstrap and routing.\n2. `hrn-01M1MV6FT4V982H88KYWGG6HSW` - Build and Verify workspace enforcement.\n3. `hrn-01M1MV6GC3D07ZRGZR6J1VTJEV` - Workspace-aware checkpoints and Continue.\n4. `hrn-01M1MV73WV3K0NB0XM8XQMAD94` - Release cleanup-ready handoff.\n5. `hrn-01M1MV7WK0AJRAE2V45WGHTW5A` - Projection documentation and lifecycle compatibility gates.\n\nChildren carry their exact dependencies, artifacts, acceptance criteria, estimates, and non-goals. Sequence 2 and 3 follow Plan policy; Release follows Plan plus Build/Verify enforcement; final compatibility gates follow all policy slices.\n\n## Acceptance Criteria\n\n- `skills.cvs.workspaces: true` produces workspace-aware lifecycle resources for OpenCode and Pi.\n- Initiative Plan creates no workspace.\n- Uncommitted Epic authority yields the explicit committed-authority handoff and no hidden Git or cwd mutation.\n- Committed Epic Plan ensures or recognizes only the deterministic Epic workspace and reports its exact path.\n- Build, Verify, Release, and Continue mutate phase state only from the exact authoritative active Epic workspace.\n- Separate Epics cannot cross workspace, branch, mapping, or checkpoint identity boundaries.\n- Continue rejects workspace drift using fresh status rather than trusting checkpoint memory.\n- Release preserves existing remote-consent and ready-PR gates, never implies merge, never removes active cwd, and marks cleanup-ready only after verified readiness.\n- Later cleanup is explicit, primary-checkout-only, and retains the branch under `doc-00019`.\n- Workspace-disabled rendering and lifecycle behavior remain compatible.\n- Canonical templates, generated projections, documentation, focused tests, and repository-standard quality/build gates agree and pass.\n\n## Verification Strategy\n\nDuring Build, run the smallest focused template, installer, documentation, generated-output, and release-artifact tests after each slice. During Verify, map every criterion to fresh evidence and run the enabled/disabled matrix, lifecycle routing and isolation cases, checkpoint drift cases, Release cleanup-ready cases, full repository quality checks, build, and generated-resource consistency gates. Verify does not repair failures.\n\n## Risks And Mitigations\n\n- Template token and byte budgets may constrain wording. Keep policy concise and assert generated behavior rather than duplicate prose.\n- Host cwd cannot be persistently switched by a tool invocation. Stop and return the exact reinvocation path instead of claiming continuation.\n- Stale checkpoint or workspace metadata could route the wrong Epic. Treat normalized status and current authority as authoritative and fail closed.\n- Release cleanup can destroy active context if performed in-phase. Limit Release to cleanup-ready marking and defer physical cleanup to a separate primary-checkout action.\n\n## Rollback\n\nDisable workspace policy rendering while preserving existing worktrees, branches, and Git common-directory metadata. Do not auto-delete workspace state during rollback.\n\n## Estimate\n\nM, 2-4 engineering days, medium uncertainty.\n\n## Non-Goals\n\n- No changes to normalized workspace primitives from `hrn-00209` / `doc-00019`.\n- No automatic authority commit, push, host cwd switch, merge, deploy, cleanup, branch deletion, or Epic reopening.\n- No Initiative workspace, Jujutsu workspace, migration, or alternate-provider support."
