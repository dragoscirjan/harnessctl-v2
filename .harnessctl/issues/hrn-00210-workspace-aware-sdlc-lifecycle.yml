"body": "# Workspace-Aware SDLC Lifecycle\n\n## Objective\n\nIntegrate Plan, Build, Verify, Release, and Continue with session-bound execution roots and deterministic phase coordinators so users remain in the primary-launched host session while the complete Epic lifecycle executes transparently inside its isolated workspace.\n\n## Plan Status\n\nThe previous executable plan is superseded. It incorrectly treated host process cwd as workspace authority and required reinvocation from the worktree. Do not Build this Epic or any existing child until a later exact `work-plan hrn-00210` rewrites the child scopes after `hrn-01M1PX20Z7J3A6RX95P7DGXF33` is merged, rebuilt/installed, and loaded by a fresh or reloaded harness.\n\n## Revised Boundary\n\n- Depend on `hrn-01M1PX20Z7J3A6RX95P7DGXF33` and consume the approved successor to review HLD `doc-01M1PX3FGJKTHDVZJFQ7S9J8YX`.\n- Plan creates or attaches a session workspace and continues immediately through its execution root; it never asks the user to change cwd or relaunch in another directory.\n- Build, Verify, Release, and Continue resolve the session binding and validate repository, Epic, workspace identity, branch, topology, lifecycle, binding generation, and execution root before project mutation.\n- Each phase delegates routine mechanics to a deterministic coordinator that exposes legal semantic operations from the routing foundation. Prompts do not compose command sequences, choose argv/cwd, bypass approvals, or infer completion evidence.\n- Repository checks, builds, installs, and delivery actions use registered operations and declared task targets. Missing automation is a capability blocker, not permission for model-generated shell.\n- Exceptional commands are limited to verbatim user commands or separately previewed and approved invocation-specific operations.\n- Initiative Plan remains workspace-free; an Epic-less implementation request may use a provisional workspace during Epic Plan under the routing foundation.\n- Checkpoints record workspace, binding, coordinator state, and completed operation IDs as advisory recovery evidence; fresh state remains authoritative.\n- Continue recovers interrupted or lost bindings only when ownership and legal next operation are unambiguous; multiple candidates require user selection.\n- Release retains the workspace while PR, review, checks, or integration is pending. Cleanup becomes eligible only after integration, no-loss, and no-live-session proof.\n- Workspace-disabled rendering and behavior remain compatible.\n\n## Existing Children Requiring Replan\n\nThe following child plans encode obsolete cwd, primitive, or prompt-driven orchestration assumptions and are not Build-ready:\n\n1. `hrn-01M1MV650AKH2ZH6Z5HQSGGMV5` - Plan workspace bootstrap and routing.\n2. `hrn-01M1MV6FT4V982H88KYWGG6HSW` - Build and Verify workspace enforcement.\n3. `hrn-01M1MV6GC3D07ZRGZR6J1VTJEV` - Workspace-aware checkpoints and Continue.\n4. `hrn-01M1MV73WV3K0NB0XM8XQMAD94` - Release cleanup-ready handoff.\n5. `hrn-01M1MV7WK0AJRAE2V45WGHTW5A` - Projection documentation and lifecycle compatibility gates.\n\nA later Epic Plan must revise, replace, or close these children with exact dependencies, artifacts, acceptance criteria, estimates, migration, and non-goals. This Initiative Plan does not create a replacement executable child plan.\n\n## Acceptance Direction\n\n- No lifecycle phase asks the user to relaunch or invoke from a workspace directory.\n- Every project operation in a bound lifecycle targets the exact execution root and cannot silently fall back to primary.\n- Separate sessions and Epics cannot cross workspace, authority, branch, checkpoint, binding, operation, or evidence boundaries.\n- Existing-Epic and provisional-Epic Plan flows continue in-session after binding.\n- The same authoritative phase state deterministically exposes the same legal operation set; illegal ordering and stale state fail before execution.\n- Model text cannot alter executable, argv, cwd, approval class, transition, or evidence schema for routine lifecycle work.\n- Continue detects stale or ambiguous bindings and coordinator state from fresh evidence and never deletes an interrupted workspace.\n- Release preserves remote-consent gates and workspace state through review/integration; cleanup requires proven integration and no data/live-owner loss.\n- Harness self-development keeps controlling code stable and activates workspace changes only after merge plus intentional rebuild/install and reload.\n- Enabled and disabled OpenCode/Pi resources, tests, docs, and generated projections agree.\n\n## Dependencies And Order\n\nClosed `hrn-00208` and `hrn-00209` remain historical prerequisites. `hrn-01M1PX20Z7J3A6RX95P7DGXF33` is the immediate blocking foundation and must complete before this Epic is replanned or built.\n\n## Verification Direction\n\nThe later plan must cover same-primary concurrent sessions, binding and topology drift, execution-root containment, deterministic phase state machines, typed operation descriptors, model-input isolation, consent immutability, declared task targets, exceptional-command refusal/approval, all lifecycle phases, checkpoint recovery, existing/provisional Epic flows, review-pending retention, integration proof, cleanup ownership, disabled compatibility, generated resources, docs, package builds, and fresh-process host integration.\n\n## Estimate\n\nM-L, 4-7 engineering days after the routing foundation, medium uncertainty.\n\n## Non-Goals\n\n- No persistent process cwd switching or user workspace relaunch.\n- No reimplementation of session routing or command construction inside lifecycle prompts.\n- No LLM-generated routine command pipelines or prompt-only safety state machine.\n- No automatic merge, deploy, primary mutation, cleanup, branch deletion, workspace reopening, or ambiguous recovery.\n- No Initiative workspace, Jujutsu, external daemon, alternate provider, or legacy authority rewrite."
