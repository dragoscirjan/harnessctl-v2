    "body": "Plan blocked: approved `doc-00019` requires first `workspace_ensure` from a clean primary checkout with Epic authority already in primary `HEAD`, while Initiative/New-Epic Plan creates uncommitted authority, performs no commit, and cannot persistently switch host cwd. Lifecycle templates cannot satisfy `/work-plan <epic-id>` workspace creation without redefining `hrn-00209` primitives or requiring an external commit. Confirmed decision: stop `hrn-00210` planning and replan `hrn-00209` with an explicit safe bootstrap contract."
