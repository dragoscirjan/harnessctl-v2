"body": "# Add bounded work-refresh repository reconciliation\n\n## Objective\n\nAdd a sixth standalone SDLC command that safely re-familiarizes agents with current repository authority and refreshes supported local projections without entering or resuming an Epic phase.\n\n## Scope\n\n- Add `work-refresh` command, prompt metadata, SDLC reference, installation/package outputs, docs, migration coverage, and host parity.\n- Permit execution before an Epic; keep it outside Plan/Build/Verify/Release and exclude it from `work-continue`.\n- Reconcile memory rather than regenerate it: validate canonical YAML, rebuild disposable cache through normalized tools, preserve valid historical records, and require confirmation for each store/supersede/tombstone.\n- Discover configured repository-scoped tool databases from live schemas. Refresh only when a safe supported operation exists and exact action-specific consent is obtained.\n- Add a narrow code-index refresh exception for `work-refresh`; ordinary SDLC phases remain retrieval-only and provider lifecycle ownership remains external.\n- Report refreshed, skipped, unsupported, stale, and blocked capabilities with evidence.\n\n## Acceptance Criteria\n\n- Both hosts install and render `work-refresh`; existing five commands retain behavior.\n- Command can run without an Epic and cannot be resumed as a phase.\n- No direct SQLite edits, wholesale memory replacement, guessed provider operations, credential access, provider installation/start/deletion/clear/configuration, remote mutation, or destructive fallback.\n- Reindex requires active configured provider, verified live capability, repository scope, and fresh exact consent.\n- Tests cover registry, rendering, install/package inventory, migration, memory invariants, provider capability/consent paths, and docs.\n- Focused and full quality checks pass during Build/Verify.\n\n## Dependencies\n\nClosed foundations: `hrn-00041`, `hrn-00061`, `hrn-00105`. No open blocker.\n\n## Artifacts\n\nIssue plan plus later source, templates, tests, docs, and generated package artifacts. No separate design document.\n\n## Estimate\n\n3-5 engineering days.\n\n## Risks\n\n- Accidental weakening of provider ownership boundary.\n- Stale memory rewritten as current fact.\n- Unsupported provider APIs inferred.\n- Existing five-command inventory assumptions missed.\n\n## Non-Goals\n\n- Remote repository sync.\n- Provider installation or daemon management.\n- Universal database adapters.\n- Direct cache/database mutation.\n- Autonomous memory deletion.\n- Changing phase semantics.\n- Implementation during this Plan invocation.\n\n## Ordered Tasks\n\n1. `hrn-00122` - Define work-refresh contract and safety boundaries.\n2. `hrn-00123` - Integrate work-refresh into command distribution.\n3. `hrn-00124` - Implement bounded refresh orchestration.\n4. `hrn-00125` - Verify compatibility and document work-refresh.\n"
