"body": "# Integrate CodeGraphContext\n\n## Objective\n\nShip CodeGraphContext `0.6.5` as the first real and default provider for the fixed `mcp.servers.sdlc-code-index` structural slot in OpenCode and Pi, with privacy-safe defaults and operator-owned installation/index lifecycle.\n\n## Approved Contract\n\n```yaml\nmcp:\n  servers:\n    sdlc-code-index:\n      enabled: true\n      provider: codegraphcontext\n      config:\n        database: ladybugdb\n        index_source: false\n        ignore_project_env: true\n```\n\n- `database` is the strict literal `ladybugdb` for this adapter version.\n- `index_source` is a strict boolean and defaults to `false`; `true` is the only source-storage opt-in.\n- `ignore_project_env` is the strict literal `true`; harnessctl cannot enable project `.env` loading.\n- Python validation/defaults, TypeScript Zod/defaults, generated JSON Schema, provider-aware merge, and projection mapping must agree.\n- Unknown fields, commands, arguments, arbitrary environment, credentials, remote databases, allowed-root expansion, nulls, and incompatible types fail closed.\n\n## Provider Mapping\n\nCode-owned environment values map the validated contract to:\n\n- `database` -> `CGC_RUNTIME_DB_TYPE=ladybugdb`\n- `index_source` -> `INDEX_SOURCE=true|false`\n- `ignore_project_env` -> `CGC_IGNORE_PROJECT_ENV=1`\n- Fixed safety values: `ALLOW_DB_DELETION=false`, `ENABLE_AUTO_WATCH=false`, `SCIP_INDEXER=false`, and `ENABLE_VECTOR_RESOLVE=false`\n\nNo credential or source environment-variable value is stored in project configuration.\n\n## Repository Tooling and Host Projection\n\n- Declare `[tools.\"pipx:codegraphcontext\"]` version `0.6.5` in `mise.toml`; existing mise-managed uv makes the pipx backend use uvx.\n- The operator runs `mise install`. Harnessctl installation never installs or updates the provider.\n- OpenCode receives fixed command `['mise', 'exec', '--', 'cgc', 'mcp', 'start']`.\n- Pi receives fixed command `mise` and args `['exec', '--', 'cgc', 'mcp', 'start']`.\n- Generated commands do not embed a `pipx:` package/version, preventing package retrieval from being part of MCP startup configuration.\n- Downstream projects must declare and install the documented prerequisite before using the generated entry.\n\n## Scope\n\n- Extend provider-neutral intents with validated code-owned literal environment values while preserving existing source-environment references and byte-exact CVS projections.\n- Add desired and recognized CodeGraphContext intents for fixed ID `sdlc-code-index` without executable availability probes.\n- Preserve conflict, force replacement, exact recognized removal, modified-entry preservation/reporting, unrelated JSON, and transactional rollback behavior.\n- Specialize the generated skill for supported retrieval operations only; MCP output remains advisory evidence and source verification/fallback remains mandatory.\n- Update configuration, code-intelligence, skills, prerequisite, privacy, packaging, release metadata, and isolated-artifact coverage.\n\n## Ordered Work\n\n1. `hrn-00096`: strict provider contract and safety mapping.\n2. Mise-backed adapter and host reconciliation Task: depends on `hrn-00096`.\n3. Skill, docs, artifacts, and release-evidence Task: depends on the adapter Task.\n\n## Acceptance Criteria\n\n- Default and partial configurations normalize exactly to the approved contract in Python and TypeScript.\n- Zod and generated JSON Schema expose only the approved CodeGraphContext fields and constraints.\n- Every accepted value has an explicit code-owned host mapping; no arbitrary pass-through exists.\n- OpenCode and Pi project equivalent fixed-ID local MCP definitions with deterministic safety environment values.\n- Existing CVS projections remain byte-equivalent.\n- Disabled/conflict/force/removal/modified/rollback cases remain covered for the real adapter.\n- `mise.toml` pins CodeGraphContext `0.6.5` through `pipx:` with existing uv; no dedicated task is added.\n- Docs state the operator must run `mise install` and separately run `cgc index`; harnessctl does neither.\n- Skill permits structural retrieval but not indexing, watching, deletion, bundle import, raw mutation, setup, or lifecycle authority.\n- Focused tests, generated contracts, wheel/sdist isolated checks, and `mise run quality` pass in Build.\n- Verify performs a fresh runtime MCP handshake, acceptance mapping, privacy/security/compatibility review, and independent implementation review.\n\n## Dependencies and Release\n\nBlocked by `hrn-00084` until its formal Verify evidence is complete. This Epic remains the release gate for the provider-neutral foundation. Release requires both Epics to verify; no provider package publication or remote deployment is owned here.\n\n## Artifacts\n\n- Python config/intents/installer and tests\n- TypeScript Zod/defaults/generated contract and tests\n- `mise.toml` and lockfile changes produced by approved repository tool installation\n- Generated `sdlc-code-index` skill and package artifacts\n- Configuration, skills, and CodeGraphContext prerequisite/privacy documentation\n- Changeset for affected published JavaScript packages\n\n## Rollback\n\nRemove the CodeGraphContext desired/recognized adapter and repository tool declaration, restore the strict empty provider branch, regenerate contracts, and preserve unrelated host JSON plus the provider-neutral fixed slot.\n\n## Risks\n\n- Upstream `0.6.x` documentation and package metadata drift; pin `0.6.5` and verify observed CLI/schema behavior.\n- `mise exec` depends on project context and a prior operator installation; fail with actionable documentation rather than auto-installing.\n- Provider MCP exposes destructive and lifecycle tools; fixed environment and skill boundaries do not replace operator access controls, so Verify must review effective behavior.\n- Independent planning review was unavailable because the reviewer API could not connect; independent implementation review remains mandatory before release.\n\n## Non-Goals\n\n- No project-configurable executable, args, MCP ID, target environment names, credentials, remote database, or allowed roots.\n- No harnessctl-owned provider install/update/uninstall, initialization, indexing, watching, database deletion, model download, daemon management, or package retrieval at MCP startup.\n- No multiplexer, second structural provider process, cloud database, telemetry integration, or performance-claim acceptance.\n"
