"body": "Given the approved compact SDLC LLD\nWhen skill resources and prompt budgets are introduced\nThen rendering is path-safe, deterministic, and measured.\n\n## Deliverables\n\n- Add nested skill resource registry and renderer with path validation.\n- Characterize old memory-enabled prompt sizes.\n- Add word/byte budget helpers and tests.\n\n## Acceptance\n\n- [x] Nested resource paths reject traversal, absolute paths, backslashes, and portable collisions.\n- [x] Rendering uses StrictUndefined and normalized final newlines.\n- [x] Baseline and target budgets are deterministic in tests.\n- [x] Focused Python checks pass."
