"body": "Given a valid issue provider configuration\nWhen harnessctl installs OpenCode assets\nThen it generates a self-contained provider-specific issue-tracking skill\nAnd excludes unrelated provider instructions.\n\n## Technical Requirements\n\n- Add Jinja issue-tracking skill adapted from the existing OpenCode skill.\n- Embed hierarchy, Gherkin, comments, links-over-text, and provider failure rules.\n- Install under `.opencode/skills/issue-tracking/SKILL.md`.\n- Preserve exact-tree rollback, conflict handling, and Pi boundary.\n\n## Acceptance Criteria\n\n- [x] Filesystem skill uses normalized harnessctl tools and revisions.\n- [x] Hosted-provider skills route only through configured CLI guidance.\n- [x] Forgejo syntax is not invented.\n- [x] Installer rollback and release artifacts include the skill."
