"body": "# Validate provider guide artifacts and release evidence\n\n## Objective\n\nProve the completed guide and artifacts are current, consistent, packaged, and safe without executing a provider or overstating unobservable effects.\n\n## Scope\n\n- Recheck every claim, URL, version/tag/commit, access date, license, and MCP-applicability classification.\n- Validate all provider sections against `hrn-00110`, the Epic-approved nonprecedential exception, and research records.\n- Validate OpenCode/Pi examples and `mcp_server` mapping against the provider-neutral contract.\n- Validate documentation inventory, links, package artifacts, and Changeset policy from `hrn-00113`: a Changeset only for published-package impact, otherwise the documented exemption.\n- Confirm skill templates and generated skills are unchanged.\n- Verify the historical GitNexus output quarantine, no subsequent provider calls, and locally observable no-intentional-mutation evidence. Record provider-side retention, egress, and remote state as `Unknown` without logs or snapshots.\n- Run formatting, focused tests, full quality, runtime smoke, and independent correctness/security/privacy review.\n- Record evidence only; corrections return to the owning Task or a defect.\n\n## Acceptance\n\n- Claims have current citations or explicit unknown/unsupported/stale markers and satisfy the 7-day/recheck policy.\n- License, security/privacy, and applicability fields satisfy `hrn-00110` except for the exact Epic-approved historical invocation exception.\n- Existing docs/package tests and applicable Changeset policy pass without unplanned authoring here.\n- Formatting, focused checks, `mise run quality`, and `mise run runtime-smoke` pass.\n- Independent correctness/security/privacy review has no unresolved findings.\n- The one historical GitNexus `list_repos` invocation is disclosed and nonprecedential; its output is absent from claims, citations, search inputs, corroboration, qualifications, matrices, and guide wording.\n- No subsequent provider call or live handshake occurs.\n- Available local evidence shows no intentional provider-state mutation was observed. Provider-side retention, egress, and remote state remain explicitly `Unknown`; validation does not claim absolute zero impact.\n- Rollback evidence enumerates exact guide/link/public-guide-test/package-inventory and any conditional Changeset removals, confirms research guards and skill artifacts are outside Task 113 rollback scope, and confirms no intentional local external-state mutation was observed.\n\n## Dependencies\n\nDepends on `hrn-00113`.\n\n## Artifacts\n\nValidation evidence, exception/quarantine assessment, explicit residual uncertainty, and independent review findings recorded on this Task.\n\n## Estimate\n\nS/M.\n\n## Non-Goals\n\nProduct/documentation authoring; formal Work Verify/Release; provider execution; another provider-call exception; proof of unobservable provider-side absence; scope expansion."
