"body": "# Concurrent Epic Workspaces\n\n## Outcome\n\nUsers launch every OpenCode or Pi tab from the normal primary checkout while each SDLC session transparently creates, binds, recovers, and executes against an isolated Git workspace. Project authority, source, commands, tests, builds, installs, memory, checkpoints, and generated Epic artifacts remain isolated until deliberate integration.\n\n## Architectural Boundary\n\n- Keep the long-lived harness process and repository discovery rooted at the primary checkout.\n- Maintain a session-local binding from host session to workspace and optional Epic; never use a repository-global active workspace.\n- Treat the bound workspace as the execution root for every project-facing operation.\n- Keep only workspace discovery, bindings, locks, lifecycle coordination, integration, and cleanup in shared control-plane state.\n- Enforce routing in adapters and tool boundaries rather than relying on process cwd or agent memory.\n- Execute routine lifecycle mechanics through typed semantic operations and deterministic phase coordinators. Program code selects executable, argv, cwd, consent class, transition, and evidence; the LLM does not compose routine commands.\n- Use repository-declared task targets for bootstrap, checks, builds, installs, and other supported automation. Unsupported work fails closed rather than falling back to model-generated shell.\n- Permit an exceptional command only when supplied verbatim by the user or separately previewed and approved for that invocation.\n- Support provisional collision-safe workspace identity before a new Epic exists, then bind the Epic without renaming the workspace.\n- Keep dependencies, build outputs, and generated state workspace-local; allow only safe global content-addressed caches.\n- Preserve opt-in `skills.cvs.workspaces`, default `false`, and existing behavior when disabled.\n- Support Git worktrees only in this Initiative.\n\n## Why Four Epics\n\nSafe transparent concurrency requires four independently verifiable outcomes: collision-safe canonical identities, safe Git primitives, session-bound execution routing plus typed orchestration, and lifecycle integration. The original three-Epic design incorrectly assumed the host process could or should move into the Epic workspace. Routing and deterministic operation execution must be delivered and activated before lifecycle policy depends on them.\n\n## Delivery Order\n\n1. `hrn-00208` - Collision-Safe Issue and Document Identities: closed, unchanged.\n2. `hrn-00209` - Git Epic Workspace Primitives: closed baseline, unchanged.\n3. `hrn-01M1PX20Z7J3A6RX95P7DGXF33` - Session-Bound Workspace Execution Routing: bootstrap with workspaces disabled.\n4. `hrn-00210` - Workspace-Aware SDLC Lifecycle: replan and execute only after routing foundation merge, rebuild/install, and host reload.\n\n`doc-00019` remains the historical primitive baseline. Review HLD `doc-01M1PX3FGJKTHDVZJFQ7S9J8YX` defines the proposed successor architecture. The routing Epic must produce its detailed LLD before Build.\n\n## Acceptance Direction\n\n- Multiple sessions launched from one primary checkout execute independently in different workspaces without user cwd changes or relaunch between lifecycle phases.\n- Existing-Epic and new-Epic Plan flows both establish a recoverable session binding and continue immediately through the execution root.\n- Source, Issues, Documents, repository Memory, comments, checkpoints, tests, builds, installs, and generated Epic artifacts do not leak into primary or another workspace.\n- Control-plane records are race-aware, recoverable, and validated against Git topology.\n- Bound tools cannot silently target primary, escape through absolute/symlink paths, or run without provable workspace targeting.\n- The same trusted state and typed inputs resolve to the same operation descriptor; model text cannot alter executable, argv, cwd, consent, transition, or evidence.\n- Routine bootstrap, checks, builds, installs, Git actions, and cleanup use registered semantic operations or declared task targets, not LLM-composed shell sequences.\n- Release retains workspaces while review or integration is pending; cleanup occurs only after integration and no-loss/no-live-owner proof.\n- Workspace-disabled behavior remains compatible.\n- OpenCode and Pi adapters, generated resources, docs, and fresh-process integration behavior remain consistent.\n\n## Bootstrap And Compatibility\n\nDeliver `hrn-01M1PX20Z7J3A6RX95P7DGXF33` through the established non-workspace workflow while workspaces remain disabled. This avoids requiring the defective routing implementation to build itself. After merge, intentionally rebuild/install and reload the harness; then re-enable workspace support and replan `hrn-00210`. Existing worktrees, branches, and common-directory records are preserved and adopted only with mechanically verified ownership.\n\n## Overlap Risk\n\nThe routing Epic changes generic workspace state, typed operation execution, OpenCode and Pi adapters, built-in tool enforcement, and bootstrap behavior. It must complete before lifecycle templates are changed. Parallel implementation with `hrn-00210` would create incompatible assumptions and is prohibited.\n\n## Risks\n\n- Host interception APIs may not cover every built-in or external tool. Inventory and prove them in the routing LLD; fail closed for unsupported tools.\n- Session recovery may be host-specific. Use stable host identity where available and explicit unambiguous recovery otherwise.\n- An incomplete operation registry could push work toward unsafe ad hoc commands. Treat missing operations as explicit capability gaps and require reviewed program additions.\n- Git isolation prevents filesystem collisions but not semantic merge conflicts. Synchronize and resolve inside workspaces before integration.\n- Harness self-development cannot hot-load its new implementation safely. Validate through fresh child processes and activate only after merge/reload.\n\n## Rollback\n\nDisable session binding and workspace routing while preserving all worktrees, branches, and control-plane records. Never silently redirect a bound session to primary, delete workspace state, or rewrite canonical authority.\n\n## Non-Goals\n\n- Persistent host shell/process directory switching.\n- Repository-global active workspace.\n- LLM-generated routine command pipelines or prompt-only lifecycle safety.\n- Automatic stash, commit, merge, primary mutation, cleanup, branch deletion, or secret copying.\n- Hot-loading Harnessctl code under active development.\n- Initiative workspaces, Jujutsu workspace support, external workspace daemon, or legacy ID rewrite."
