    "body": "Build evidence: added exact sdlc-code inventory/dispatch, installer parity, committed-output drift, nested conflict/symlink/rollback, package artifact, Build/Continue, and documentation tests; generated byte-equivalent `.opencode/skills/sdlc-code/` and `.pi/skills/sdlc-code/` trees; documented install/reload/rollback/global-skill boundaries. `uv run pytest tests/test_docs.py tests/test_templates.py tests/test_install.py tests/test_issue_skill.py tests/test_release_artifacts.py -q`: 299 passed, 8 preexisting migration warnings. Focused Ruff and `git diff --check` passed. Independent review round 2 approved with no findings. No Changeset: `.changeset/README.md` requires one only for changed published npm packages; this Python/template/docs slice changes none. Full Verify and live host discovery intentionally not run in Build."
