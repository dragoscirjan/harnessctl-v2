"body": "# Document and test composable coding guidance\n\n## Objective\n\nProve the composable coding-guidance contract, protect it from drift, and document operator-visible behavior and rollout.\n\n## Scope\n\n- Add focused renderer, installer, SDLC Build/Continue, selected-host parity, package-resource, and generated-output tests.\n- Cover representative single-language, shell/shebang, ambiguous-extension, artifact, and composite dispatch rules.\n- Add static checks ensuring all declared references exist and all 25 audited subjects are accounted for.\n- Update SDLC, skills, installation, and relevant root documentation.\n- Add Changeset metadata.\n\n## Acceptance Criteria\n\n- Tests prove root/reference byte parity and complete packaged resource inventory for OpenCode and Pi.\n- Tests prove Build activation, Build-resume activation, and absence from non-Build phase policy.\n- Dispatch contract covers Python, C/C++ header ambiguity, Bash/POSIX shell selection, TSX, Vue or Svelte embedded TypeScript, and documentation/configuration relevance filtering.\n- Drift checks fail for missing declared references or unaccounted audited subjects.\n- Documentation states precedence, compatibility detection, optional-tool boundaries, global-skill non-ownership, reinstall/restart steps, and rollback.\n- Focused checks pass in Build; later Verify owns full `mise run quality`, applicable runtime smoke and artifact checks, and independent prompt review.\n\n## Dependencies And Estimate\n\nDepends on `hrn-00117`. Estimate `M`.\n\n## Non-Goals\n\nDo not perform formal Verify or Release, modify global skills, install language tooling, commit, or publish."
