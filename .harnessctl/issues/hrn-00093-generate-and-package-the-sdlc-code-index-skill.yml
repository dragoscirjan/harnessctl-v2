"body": "# Generate and package the sdlc-code-index skill\n\n## Objective\n\nRename and package one provider-aware retrieval skill against the standardized nested MCP server contract, then complete shared integration evidence without adding a provider command.\n\n## Scope\n\n- Replace the unreleased canonical `code-index` template and directories with `sdlc-code-index`.\n- Read enabled/provider/config from validated `mcp.servers.sdlc-code-index`; compile only the selected provider and fixed `sdlc-code-index` server identity into the skill.\n- Install byte-equivalent skill content for enabled selected OpenCode and Pi hosts.\n- Preserve relationship/search evidence boundaries, unavailable or stale index handling, local source verification, and Glob/Grep/read fallback.\n- Fresh disabled installs omit the skill; disabling does not delete a prior generated skill, which remains dormant without an active host entry.\n- Update configuration, skills, MCP/code-intelligence, package, release, and root documentation for the standard entry shape and renamed paths.\n- Update template, selected-host, package artifact, isolated-wheel/install, docs, inventory, and full quality coverage plus the required Changeset.\n- Retain prior implementation comment `hrn-00093-C0001` as historical evidence for the superseded unreleased names; it does not satisfy this revised contract.\n\n## Acceptance Criteria\n\n- Enabled selected hosts receive byte-equivalent `.opencode/skills/sdlc-code-index/SKILL.md` and `.pi/skills/sdlc-code-index/SKILL.md` files.\n- Skill specialization uses the validated provider and exact fixed MCP ID `sdlc-code-index`; full provider config is not rendered into prompts.\n- Disabled fresh installs receive neither active host entry nor new skill; previous generated skill bytes remain untouched.\n- Skill guidance never treats provider output as source authority and falls back when MCP evidence is missing, stale, incomplete, or unsuitable.\n- The skill does not instruct harnessctl to install, set up, initialize, index, start, update, or remove third-party tools.\n- Wheel/sdist and isolated installed-package tests include and render the renamed skill.\n- Documentation describes `enabled`, `provider`, and strict provider-specific `config`, separates host projection from operator prerequisites, and records the `hrn-00085` release gate.\n- Focused checks and `mise run quality` pass; formal Verify owns runtime smoke and independent review.\n\n## Dependencies and Order\n\nDepends on completed `hrn-00092` for reusable intent/reconciliation history and corrective `hrn-00095` for the standardized fixed identity. Final Task. Estimate M.\n\n## Non-Goals\n\n- No real provider command, arbitrary provider config pass-through, provider-specific tool catalogue, or behavioral execution of an AI host.\n- No cleanup or ownership of third-party files, indexes, databases, daemons, models, or credentials.\n- No compatibility alias for unreleased `code-index` or `code_index` names.\n"
