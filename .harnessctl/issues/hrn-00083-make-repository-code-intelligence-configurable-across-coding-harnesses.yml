"body": "# Make repository code intelligence configurable across coding harnesses\n\n## Outcome\n\nOpenCode and Pi receive configurable MCP-based repository intelligence through a nested `mcp.servers` registry. The primary structural slot is `mcp.servers.sdlc-code-index`, defaults to CodeGraphContext, selects one active structural provider at install time, and generates one MCP-reliant `sdlc-code-index` skill.\n\n## Boundary\n\nOne stable logical slot cannot represent several simultaneously active provider processes. `sdlc-code-index` therefore selects one structural provider. Companion, semantic, and experimental capabilities use separate logical `mcp.servers` keys and fixed identities so several capabilities can coexist without a multiplexing proxy.\n\nEach logical server owns an enabled state, provider selection when applicable, and strict per-provider typed default objects. Commands, arguments, fixed host IDs, target environment names, and credential values remain trusted provider constants. Project configuration may expose only documented safe typed paths, modes, source environment-variable names, privacy controls, and similar non-secret options.\n\nHarnessctl validates configuration and projects documented MCP definitions into OpenCode and Pi. Every third-party executable, package, index, database, daemon, model, credential, and provider lifecycle remains operator-owned.\n\n## Naming and Configuration Direction\n\n- Primary config key: `mcp.servers.sdlc-code-index`.\n- Generated skill name and directory: `sdlc-code-index`.\n- Stable selected-host MCP ID: `sdlc-code-index` where host schemas permit arbitrary map keys.\n- Structural provider map: `codegraphcontext`, `gitnexus`, and `graphify`, with strict typed defaults defined by their provider Epics.\n- Default structural provider: `codegraphcontext`.\n- MCP is primary for indexed intelligence; Glob/Grep/read remains a source-verifying fallback for unavailable, stale, incomplete, or unsuitable MCP evidence.\n- Unreleased top-level `code_index`, skill `code-index`, and ID `code_index` are replaced atomically; no compatibility alias is required.\n\n## Provider Direction\n\n- CodeGraphContext is the default structural provider and first provider planned.\n- GitNexus is noncommercial and explicit opt-in only.\n- Graphify supplies portable local structural graphs.\n- Repomix is a context-packing companion with a separate logical server.\n- FastCode remains a separate experimental capability blocked on a valid license artifact.\n- CocoIndex Code is semantic retrieval with a separate logical server.\n\n## Acceptance Direction\n\n- Shared nested config, projection, ownership, reconciliation, and `sdlc-code-index` skill precede provider adapters.\n- Every supported logical MCP has documented schema defaults suitable for install-time configuration.\n- OpenCode and Pi receive equivalent supported capability semantics and deterministic fixed identities.\n- Provider tests verify generated host configuration and skill behavior without executing third-party setup, indexing, or provider processes.\n- Provider output is retrieval evidence, not source authority; fallback behavior is explicit.\n- Prerequisites, telemetry, external services, credential names, privacy, and license limits are documented per provider.\n- Vendor claims are not acceptance evidence; provider plans define independent verification.\n\n## Non-Goals\n\n- Do not implement providers during Initiative planning.\n- Do not introduce an MCP multiplexing service.\n- Do not make executable commands, arguments, fixed IDs, target environment names, or credential values project-configurable.\n- Do not install, download, initialize, index, update, start, probe by execution, or remove third-party tools.\n- Do not classify Repomix or semantic retrieval as structural indexing.\n- Do not endorse GitNexus for commercial use.\n- Do not index arbitrary repository files in issue or memory SQLite projections.\n"
