"body": "## Objective\n\nClose cross-host, package, documentation, and quality evidence for the configurable TDD capability under the confirmed rule that disabled means not loaded or enforced.\n\n## Scope\n\n- Complete config, template, installer, host-parity, release-artifact, documentation, and runtime-smoke coverage.\n- Verify fresh-disabled absence and enabled-to-disabled dormant-skill retention without ownership metadata or cleanup.\n- Verify disabled Build and Continue guidance neither loads nor enforces TDD.\n- Document disabled default, opt-in YAML, installation paths, Build/Continue activation, and dormant-skill behavior.\n- Run the repository quality and runtime-smoke gates during Verify.\n\n## Acceptance\n\n- [ ] Python, TypeScript, and generated JSON Schema contracts agree.\n- [ ] OpenCode and Pi generated TDD skills are byte-equivalent when enabled.\n- [ ] Fresh disabled installs do not generate the TDD skill.\n- [ ] Enabled-to-disabled reinstall preserves the existing skill bytes while disabled Build and Continue guidance omits TDD loading and enforcement.\n- [ ] Release artifacts contain all required templates and no unintended unconditional TDD behavior.\n- [ ] `docs/configuration.md`, `docs/skills.md`, and `docs/sdlc.md` describe enabled, disabled, and dormant-skill behavior with examples.\n- [ ] Full quality and runtime-smoke gates pass in Verify.\n\n## Dependencies\n\nBlocked by `hrn-00076` and corrective Task `hrn-00081`.\n\n## Non-Goals\n\n- Ownership markers, disabled-state cleanup, cleanup-race handling, or specialized cleanup rollback.\n- Deployment or data migration.\n- New operational runbook.\n\n## Estimate\n\nSmall after `hrn-00081`. Low design uncertainty; remaining uncertainty is final repository-wide verification."
