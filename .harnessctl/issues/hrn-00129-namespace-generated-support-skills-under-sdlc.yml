"body": "# Namespace generated support skills under `sdlc-`\n\n## Outcome\n\nHarnessctl-generated support skills use the existing `sdlc-` namespace while the three established SDLC skill IDs remain unchanged. This distinguishes generated support skills without imposing an unnecessary rename on `sdlc`, `sdlc-code`, or `sdlc-code-index`.\n\n## Canonical Names\n\n- `caveman` -> `sdlc-caveman`\n- `cvs` -> `sdlc-cvs`\n- `develop-tdd` -> `sdlc-develop-tdd`\n- `issue-tracking` -> `sdlc-issue-tracking`\n- `memory` -> `sdlc-memory`\n- `sdlc` -> `sdlc`\n- `sdlc-code` -> `sdlc-code`\n- `sdlc-code-index` -> `sdlc-code-index`\n\n## Scope\n\n- Rename the five support skill IDs, directories, registries, smoke checks, cross-loads, templates, tests, documentation, generated host outputs, and packaged artifacts.\n- Retain the installed IDs and paths for `sdlc`, `sdlc-code`, and `sdlc-code-index`.\n- Keep functional configuration and MCP identities such as `skills.sdlc-code-index` unchanged.\n- Replace the unshipped `--replace-harnessctl-skill-set` option with `--replace-sdlc-skill-set`; no compatibility alias is required.\n- Fresh installs create only the corrected canonical names.\n- Normal and `--force` upgrades preserve legacy support trees and warn with exact selected-host paths.\n- Explicit migration removes only disclosed legacy support paths transactionally.\n- Preserve optional caveman, memory, TDD, and code-index behavior.\n\n## Non-Goals\n\n- No rename of the three established `sdlc*` skills, commands, tool or MCP IDs, providers, or functional configuration keys.\n- No global `~/.config/opencode` mutation, compatibility alias skills, automatic deletion, or product migration support for unshipped `harnessctl-*` names.\n- No separate HLD or LLD; the bounded contracts are recorded here.\n\n## Lightweight Design\n\nUse an explicit canonical map because five IDs change and three remain identical. Keep the five legacy support IDs separate from canonical identities so the three retained `sdlc*` directories can never become migration deletion targets.\n\nWithout `--replace-sdlc-skill-set`, detect candidate legacy roots without recursively inspecting their entries. Warn and preserve all content even when a retained tree contains symlinks or special entries. `--force` changes overwrite handling only and never grants migration consent.\n\nWith explicit replacement consent, validate each selected-host legacy root as a real directory and recursively reject symlinks or special entries before any mutation. Disclose only root paths, capture file bytes and existence plus directory topology, write canonical outputs, delete only authorized legacy support trees, and restore documented before-images on failure. Keep existing path-escape and selected-host defenses.\n\n## Ordered Work\n\n1. Complete `hrn-00130`: correct the canonical map, physical templates, frontmatter, generated loads, installer paths, smoke checks, CLI flag, tests, docs, changelog, package artifacts, and committed OpenCode/Pi outputs.\n2. Complete `hrn-00131`: separate non-traversing no-consent detection from explicit destructive-tree validation and add symlink/special-entry retention and rejection coverage.\n3. Run focused Build checks, then use a separate Verify phase for the full quality, artifact, parity, lint, and build gates.\n\nNo new Story, Task, Bug, dependency, or relationship is required. Both existing Bugs remain open until implementation and verification provide completion evidence.\n\n## Acceptance\n\n- Fresh OpenCode, Pi, and all-harness installs expose only applicable corrected IDs and no `harnessctl-*` IDs.\n- `sdlc`, `sdlc-code`, and `sdlc-code-index` installed paths, frontmatter, resources, and generated loads remain unchanged.\n- The five support skills use their `sdlc-` names consistently across source, generated hosts, docs, and release artifacts.\n- Existing `skills.sdlc-code-index` configuration remains valid and produces `sdlc-code-index`.\n- Without migration consent, normal and `--force` upgrades do not traverse or mutate legacy support trees, including trees containing symlinks or special entries; warnings identify only selected-host roots.\n- Explicit migration validates before mutation, affects only disclosed selected-host roots for the five legacy support IDs, and never deletes the three retained `sdlc*` trees.\n- Canonical conflicts fail before mutation. Injected failures restore captured file bytes and existence plus directory topology.\n- Enabled and disabled caveman, memory, TDD, and code-index behavior remains unchanged apart from the five support skill names.\n- Focused migration tests, full quality task, isolated wheel/sdist tests, byte-equivalent OpenCode/Pi trees, documentation checks, lint, and build pass.\n\n## Verification\n\n- Exercise fresh and upgrading OpenCode, Pi, and all-harness installs with enabled and disabled optional skills.\n- Cover normal install, `--force` without consent, explicit migration, customized files, symlinks and special entries, canonical conflicts, selected-host boundaries, and injected rollback failures.\n- Assert the three retained `sdlc*` trees are never migration candidates.\n- Confirm source, generated trees, package contents, and active docs contain no unintended `harnessctl-*` IDs.\n- Run the repository quality task, isolated release-artifact suite, and build in Verify.\n\n## Release, Rollback, Documentation, Operations\n\n- Publish as a breaking rename for five support skills only. Document the exact five renames, three retained IDs, `--replace-sdlc-skill-set`, no-consent behavior, and rollback guarantee.\n- No deployment or runtime operation is required.\n- Successful explicit migration is destructive only to disclosed legacy support paths. Failed migration restores file bytes and existence plus directory topology; metadata beyond this documented before-image is not guaranteed.\n\n## Estimate and Uncertainty\n\nEstimated 1-2 developer days. Uncertainty is medium because the corrective Build must rework a large uncommitted generated-tree diff and preserve migration safety.\n\n## Risks\n\n- Incorrect mapping could classify a retained `sdlc*` tree as legacy and delete it.\n- Stale `harnessctl-*` references may remain across generated outputs, docs, or package tests.\n- Recursive traversal before consent would continue blocking safe upgrades.\n- Rollback claims could exceed the byte, existence, and directory-topology behavior actually tested.\n\n## Dependencies and Relationships\n\nNo external dependency. Child Bugs: `hrn-00130`, then `hrn-00131`; ordering does not require a formal dependency relationship."
