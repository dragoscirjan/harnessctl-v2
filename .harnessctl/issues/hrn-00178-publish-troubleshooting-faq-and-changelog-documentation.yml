"body": "# Publish troubleshooting, FAQ, and changelog documentation\n\n## Objective\n\nHelp users recover from failures, answer recurring questions, and distinguish shipped, unreleased, package, and documentation changes without duplicating canonical guides or references.\n\n## Scope\n\n- Replace `docs/troubleshooting.md` with symptom-first guidance for installation, configuration, harness, skill, command, package/module, and MCP failures.\n- Give each troubleshooting entry an observable symptom or stable error, likely cause, safe diagnostics, recovery, escalation evidence, and canonical reference link.\n- Replace `docs/faq.md` with concise conceptual, support, compatibility, and lifecycle answers that link to authority.\n- Replace `docs/changelog.md` with evidence-backed product, package, documentation, and explicitly Unreleased streams.\n- Add useful contextual Troubleshooting links to Installation, Configuration, Harnesses, Skills, Node Modules, MCP Servers, and Command Reference.\n- Add focused documentation contracts and regenerate deterministic `docs/llms.txt` and `docs/llms-full.txt`.\n\n## Design\n\nUse lightweight information design in this Epic. Keep stable symptom-oriented headings and searchable user-visible errors. Apply the status and evidence vocabulary from `docs/status-and-evidence.md`. Existing guides, catalogs, and references remain owners of exact contracts; help pages summarize and link.\n\n## Acceptance Criteria\n\n- Troubleshooting covers all seven failure categories with the required symptom, cause, diagnostic, recovery, escalation, and reference fields.\n- Stable searchable wording covers overwrite refusal, invalid Config v1, duplicate mapping keys, unsupported harnesses, Pi consent/runtime failures, disabled code-index warnings, MCP smoke-check failures, and incomplete rollback.\n- Diagnostics never request credential values or secret-bearing full configurations. Destructive repair is excluded; warnings and safer alternatives are explicit.\n- FAQ answers recurring questions briefly and links canonical authority instead of copying contracts.\n- Changelog entries are dated and versioned where applicable, source-linked, and clearly distinguish shipped `0.2.0`, package releases such as `0.1.10`, documentation changes, and Unreleased work.\n- Release claims have adjacent checked-in changelog or GitHub Release evidence. Documentation changes have dated commit or merged-PR evidence.\n- Configuration, registration, authentication, and operation remain distinct. No provider-operation, publication, ETA, or unsupported-host claim is inferred.\n- The three pages leave the structural-stub set; contextual links, public-doc safety rules, strict documentation build, and deterministic LLM indexes remain valid.\n\n## Ordered Delivery\n\n1. Story: Publish symptom-first troubleshooting guidance, estimate M, order 1.\n2. Story: Publish the harnessctl FAQ, estimate S, order 2.\n3. Story: Publish the evidence-backed changelog, estimate S, order 3.\n4. Task: Enforce help and changelog documentation contracts, estimate S, order 4, depends on all three Stories.\n\n## Verification\n\nLater Verify runs `uv run pytest tests/test_docs.py tests/test_install.py tests/test_config_v1.py tests/test_release_artifacts.py`, `mise run docs-build`, focused Prettier and Ruff checks, deterministic index checks, and `git diff --check`. Browser and theme checks are not required for this content-only Epic.\n\n## Release And Rollback\n\nLater Release uses one scoped branch, commits, push, and ready PR with fresh remote consent. Merge and deployment require separate consent. Roll back help pages, contextual links, tests, and generated indexes together.\n\n## Non-Goals\n\n- Product, installer, configuration, package, dependency, or runtime changes.\n- Provider operation, publication, incident disclosure, ETAs, theme work, browser testing, or deployment.\n- Rewriting authoritative root or package changelogs and release notes.\n\n## Dependencies, Risks, And Estimate\n\nDepends only on closed foundation Epic `hrn-00167`; cross-links are non-blocking. Estimate M. Risks: unsafe diagnostic wording, duplicated contracts, stale release evidence, confusing Unreleased with shipped state, and tests coupled to unstable prose. No current blocker."
