"body": "# Prevent CodeGraphContext startup from copying project credentials\n\n## Defect\n\nThe unreleased harnessctl-owned CodeGraphContext `0.6.5` adapter starts an external provider without a reliable context/storage isolation control. In per-repo mode, upstream startup can create `.codegraphcontext/` and copy global `.env` bytes into the repository. Mise write sandboxing was proven fail-open in the available environment.\n\n## Evidence\n\n- The generated fixed startup path was `mise exec -- cgc mcp start` with harnessctl-owned desired/recognized intents.\n- Installed CodeGraphContext `0.6.5` can create per-repo state and copy global `.env` during context resolution before explicit operator setup.\n- `CGC_IGNORE_PROJECT_ENV=1` prevents loading project environment but does not prevent credential-file copying.\n- An isolated Build probe showed `mise exec --deny-write` permitted a forbidden write and a per-repo provider startup copied `.env`; the failed repair was removed.\n\n## Approved Atomic Remediation\n\nAtomically remove harnessctl ownership of the CodeGraphContext/code-index startup path and migrate configuration to the provider-neutral skill contract:\n\n```yaml\nskills:\n  sdlc-code-index:\n    enabled: false\n    mcp_server: sdlc-code-index\n```\n\nThe config migration and runtime removal must land in one slice because the current adapter consumes the current provider schema. `mcp_server` becomes validated guidance data only and must never enter intent generation or reconciliation.\n\n## Scope\n\n- Replace provider-owned Python/TypeScript defaults, validation, Zod branches, generated JSON Schema, and provider-aware merge with the strict known skill entry.\n- Enforce the approved portable identifier contract and reject the reserved `cvs_` prefix.\n- Reject both legacy top-level `code_index` and legacy `mcp.servers` before merge with explicit migration guidance.\n- Remove CodeGraphContext/code-index desired and recognized intents, fixed command/arguments, literal environment support used only by the adapter, availability assumptions, repository mise declaration, and lock entry.\n- Preserve generic CVS/issue intent rendering and source-environment mapping.\n- Leave every existing code-index host MCP subtree untouched under enabled, disabled, `--force`, and rollback paths.\n\n## Acceptance Criteria\n\n- Defaults are exactly `skills.sdlc-code-index.enabled: false` and `mcp_server: sdlc-code-index` in Python and TypeScript.\n- Python validation, TypeScript Zod, generated JSON Schema, and partial merges agree.\n- `mcp_server` accepts only 1–64 lowercase ASCII characters, starts/ends alphanumeric, permits only alphanumeric/`_`/`-` internally, and rejects `cvs_`.\n- Unknown skill IDs/fields, invalid identifiers, nulls, arrays, provider fields, commands, credentials, and arbitrary config fail clearly.\n- Legacy `code_index` and `mcp.servers` are rejected before merge with migration guidance.\n- CodeGraphContext/code-index desired and recognized intents, fixed command, literal safety environment, probe assumptions, mise declaration, and lock entry no longer exist.\n- Enabling or disabling the skill never creates, changes, recognizes, removes, probes, or runs any code-index MCP entry.\n- Existing host MCP entries remain byte-for-byte unchanged under enabled, disabled, force, conflict, and transactional rollback coverage.\n- Generic CVS and issue MCP projections remain byte-equivalent.\n- No provider command or lifecycle action executes.\n- Focused Python/TypeScript tests, generated-contract drift checks, `mise run quality`, issue validation, and `git diff --check` pass before closure.\n\n## Migration And Rollback\n\nExisting host MCP entries and installed provider tools remain user-owned. Documentation will require manual audit/removal and optional uninstall. Rollback must preserve those host subtrees and must never restore the unsafe adapter as a compatibility path.\n\n## Non-Goals\n\n- Final provider-neutral skill text, disabled-file warning UX, package artifacts, Changeset, and implementation documentation; these are owned by dependent Task `hrn-00106`.\n- Any replacement launcher, sandbox workaround, provider runtime configuration, repository indexing, provider lifecycle ownership, Release, commit, push, or parent-Epic closure."
