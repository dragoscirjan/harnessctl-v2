"body": "# Research repository-context and indexing MCP providers\n\n## Objective\n\nProduce current, source-backed evidence for Repomix, FastCode, and CocoIndex using the approved provider evidence and freshness policy, including whether each exposes an applicable MCP integration.\n\n## Scope\n\nFor each provider, research status/version, license, installation/update, MCP applicability, OpenCode and Pi configuration where supported, server-name mapping, lifecycle/storage, credentials/privacy/telemetry, capabilities/limitations, stale-index behavior, removal, and authoritative sources.\n\n## Acceptance\n\n- Each provider has a completed evidence matrix following `hrn-00110`.\n- The research explicitly determines whether an applicable MCP integration exists; unsupported or ambiguous applicability is stated rather than inferred.\n- Operational claims cite official sources with URL, access date, and release/tag/commit where available.\n- Any OpenCode/Pi example remains user-owned and maps only the chosen server name into `skills.sdlc-code-index.mcp_server`.\n- Privacy, telemetry, credentials, retention, storage, model, database, sandbox, and remote-service behavior is stated only when sourced; unknowns remain explicit.\n- Conflicting, stale, or unavailable evidence is recorded without inference.\n- No provider command is executed and no provider-owned state is changed.\n\n## Dependencies\n\nDepends on `hrn-00110`.\n\n## Artifacts\n\nStructured research records and source citations for the Repomix, FastCode, and CocoIndex sections of `docs/code-intelligence-providers.md`.\n\n## Estimate\n\nM.\n\n## Non-Goals\n\n- Authoring the final consolidated guide.\n- Treating a non-MCP tool as an MCP integration without evidence.\n- Selecting a default provider or running provider software."
