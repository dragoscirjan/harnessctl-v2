"body": "# Reconcile stale active decisions and events during work-refresh\n\n## Parent\n\n`hrn-00121`\n\n## Defect\n\n`work-refresh` explicitly compares active facts and lessons but provides no reconciliation path for active decision or event claims invalidated by current repository authority.\n\n## Evidence\n\n`src/harnessctl/templates/skills/sdlc/references/refresh.md.j2:15-19` preserves decisions and events while limiting comparison to facts and lessons.\n\n## Impact\n\nMaterially stale active memory can survive refresh and mislead later work.\n\n## Acceptance Criteria\n\n- Refresh inspects active decision/event claims only when current authority can invalidate their reusable current-state meaning.\n- Immutable history remains preserved.\n- Each correction uses one separately proposed and confirmed supersede or tombstone with provenance.\n- Canonical template, generated hosts, public docs, and focused tests agree.\n- Full quality checks pass.\n\n## Non-Goals\n\nRewriting valid history or wholesale memory regeneration.\n"
