"body": "# Preserve Gitea and Forgejo boundaries during Documents cleanup\n\n## Goal\n\nKeep the already-built CVS and Issues Gitea/Forgejo separation intact while removing every Documents-specific provider coupling.\n\n## Scope\n\n- Preserve official Gitea `gitea-mcp` and Forgejo `forgejo-mcp` binaries, fixed IDs, pins, environment mappings, route attribution, and deduplication for CVS and Issues.\n- Preserve exact historical Gitea migration, modified historical definition warnings/blocking, unrelated raw JSON bytes, force semantics, and rollback behavior.\n- Identify Documents-only reuse of provider intents, IDs, reservations, contracts, config, fixtures, and guidance so `hrn-00138` can remove it narrowly.\n- Prevent cleanup from deleting, weakening, aliasing, or merging CVS/Issues provider behavior.\n\n## Acceptance Criteria\n\n- [ ] CVS and Issues Gitea routes use only official `gitea-mcp`; Forgejo routes use only `forgejo-mcp`.\n- [ ] Exact historical definitions still migrate transactionally; modified `cvs_gitea` and `sdlc_cvs_gitea` definitions remain byte-preserved, warn, and block replacement under force and non-force.\n- [ ] No Documents configuration or route is required to retain CVS/Issues provider behavior.\n- [ ] Removing Documents provider surfaces changes no unrelated host JSON, provider route, or rollback behavior.\n- [ ] Focused provider, installer, migration, docs, package, and regression tests pass."
