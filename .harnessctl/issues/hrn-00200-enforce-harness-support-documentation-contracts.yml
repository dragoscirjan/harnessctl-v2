"body": "# Enforce harness support documentation contracts\n\n## Objective\n\nProtect the approved Harnesses content contract against unsupported claims and documentation drift.\n\n## Scope\n\n- Strengthen focused assertions in `tests/test_docs.py`.\n- Derive supported host inventory from current installer authority where practical.\n- Require exact host statuses, comparison dimensions, evidence classes, review date, canonical links, and support-boundary language.\n- Confirm deterministic `docs/llms.txt` and `docs/llms-full.txt` generation and strict MkDocs compatibility.\n\n## Acceptance Criteria\n\n- Tests fail when a supported host is missing or extra, a status drifts from authority, or Claude/Codex are presented as implemented or promised.\n- Tests fail when installation, commands or prompts, skills, project tools, MCP projection, configuration, prerequisites, or limitations disappear.\n- Tests require adjacent source/test evidence, an explicit evidence review date, canonical cross-links, and generated/installed/registered/configured/operational distinctions.\n- Focused docs tests, deterministic generators, strict MkDocs, focused Ruff/Prettier, and Git diff checks pass in later Build/Verify phases.\n\n## Dependency\n\nDepends on `hrn-00199`; enforce contracts after the guide content exists.\n\n## Non-Goals\n\nDo not add runtime integration tests, operate external providers, test the temporary theme visually, or change product behavior."
