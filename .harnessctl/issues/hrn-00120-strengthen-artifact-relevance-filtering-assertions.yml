"body": "# Strengthen artifact relevance-filtering assertions\n\n## Evidence Gap\n\nThe artifact relevance-filtering test checks only that Markdown, JSON, and YAML references contain the word `class`. It would also pass inverted guidance that incorrectly mandates class-oriented rules.\n\n## Evidence\n\n- `tests/test_templates.py:193-194` asserts only `\"class\" in ...lower()` for the three artifact references.\n- Current reference implementations explicitly reject irrelevant class-oriented guidance, but the test does not prove that direction.\n- Independent Verify review identified the false-positive path during `work-verify hrn-00115`.\n\n## Impact\n\nA future policy regression could impose irrelevant class/interface/dependency-injection rules on documentation or configuration while the intended acceptance test still passes. Current implementation behavior is correct; verification strength is insufficient.\n\n## Acceptance Criteria\n\n- Markdown, JSON, and YAML assertions verify explicit exclusion of irrelevant class-oriented guidance, not mere keyword presence.\n- The test would fail if any covered artifact reference were inverted to mandate class/interface/dependency-injection policy.\n- Representative artifact relevance checks and full `mise run quality` pass.\n- No production prompt meaning changes unless testing exposes an actual inconsistency.\n\n## Boundaries\n\nStrengthen focused acceptance evidence only. Do not broaden language coverage, redesign dispatch, add tools, or enter Release."
