"body": "# Preserve CVS and Issues Gitea migration behavior during Documents cleanup\n\n## Defect boundary\n\nRemote Documents removal must not regress the historical Gitea reconciliation already repaired for CVS and Issues. Exact old Forgejo-backed Gitea definitions remain eligible for managed migration, while operator-modified historical definitions under either `cvs_gitea` or `sdlc_cvs_gitea` remain byte-preserved, warn, and block planned canonical replacement under force and non-force.\n\n## Scope\n\n- Keep historical recognition limited to the established old local `forgejo-mcp` executable signature and existing IDs.\n- Preserve exact migration, modified-definition blocking, unrelated canonical conflict force behavior, raw JSON preservation, and transaction rollback.\n- Remove only Documents-specific Gitea/Forgejo intents, reservations, configuration, contracts, and guidance.\n- Reconcile current design/docs/tests so historical behavior is owned by CVS/Issues, not by a Documents provider seam.\n\n## Acceptance Criteria\n\n- [ ] Exact historical Gitea definitions under legacy or canonical IDs still migrate transactionally when the existing CVS/Issues replacement is planned.\n- [ ] Modified historical definitions under both IDs survive byte-equivalently with deterministic warnings and block replacement under both force modes.\n- [ ] Ordinary non-historical canonical conflicts retain normal force behavior.\n- [ ] Documents cleanup emits no Gitea/Forgejo Documents intent and changes no CVS/Issues provider identity, environment, route, raw JSON, or rollback semantics.\n- [ ] OpenCode, Pi, and `all` regression tests cover exact/modified definitions, both IDs, both force modes, rollback, and absence of Documents coupling.\n- [ ] HLD/LLD v2 and current CVS guidance agree; focused and full gates pass.\n\n## Evidence\n\nHistorical Verify/Build comments below remain authoritative evidence for the repaired behavior; the Plan pivot changes ownership and removal boundaries, not those guarantees."
