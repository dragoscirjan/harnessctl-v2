"body": "# Publish harness support documentation\n\n## Objective\n\nExplain what a coding harness is and publish evidence-backed current support for OpenCode, Pi, Claude, and Codex without conflating generated artifacts, registration, configuration, or verified operation.\n\n## Scope\n\n- Rewrite `docs/harnesses.md` as the canonical reader-facing harness support guide.\n- Define a coding harness and its role in installing and using harnessctl.\n- Give OpenCode, Pi, Claude, and Codex one explicit current status.\n- Compare installation, commands or prompts, skills, project tools, MCP projection, configuration, prerequisites, and known limitations.\n- Place current source and automated-test evidence beside support claims and state the evidence review date.\n- Link Installation, Skills, MCP Servers, Node Modules, command, configuration, and status references instead of duplicating their contracts.\n- Add focused drift contracts in `tests/test_docs.py` and regenerate `docs/llms.txt` and `docs/llms-full.txt`.\n\n## Approved Child Plan\n\n1. `hrn-00199` Story, estimate `M`, order 1: publish the evidence-backed harness support guide.\n2. `hrn-00200` Task, estimate `S`, order 2: enforce harness support documentation contracts; depends on `hrn-00199`.\n\nComplete content before its drift gates.\n\n## Acceptance Criteria\n\n- OpenCode, Pi, Claude, and Codex each have one explicit status backed by current authority.\n- OpenCode and Pi use `working` only for behavior supported by installer source and relevant automated tests.\n- Claude and Codex use `not implemented` without implying planned delivery, runtime behavior, or support copied from another host.\n- Readers can compare installation support, commands or prompts, skills, tools, MCP projection, configuration, prerequisites, and limitations.\n- Every support claim identifies adjacent source or automated-test evidence and one explicit review date.\n- The page distinguishes generated, installed, registered, configured, and operational states.\n- Installation, catalogs, commands, configuration, and status semantics are linked rather than copied.\n- Focused tests fail on host/status inventory drift, missing comparison dimensions, absent evidence/date, missing canonical links, unsupported wording, or stale generated indexes.\n\n## Verification Strategy\n\nA later Verify phase runs `uv run pytest tests/test_docs.py`, `mise run docs-build`, focused Ruff and Prettier checks, and `git diff --check`. Browser and temporary-theme assessment are not required for this content-only Epic.\n\n## Evidence Sources\n\n- `src/harnessctl/install.py` for supported targets, generated locations, host prerequisites, and registration behavior.\n- `tests/test_install.py`, template tests, and release-artifact tests for covered installation behavior.\n- `docs/status-and-evidence.md` for status and provenance semantics.\n- `docs/installation.md`, `docs/skills.md`, `docs/mcp-servers.md`, `docs/node-modules.md`, `docs/command-reference.md`, and configuration references for linked ownership.\n- Approved `doc-00017` v2 for the Harnesses route and documentation boundary.\n\n## Risks\n\n- Generated, installed, registered, configured, and operational states can be conflated.\n- Pi package and MCP-adapter prerequisites can be understated.\n- Absence of Claude and Codex targets can be generalized beyond harnessctl integration.\n- Evidence dates and prose-only support mappings can drift.\n\n## Dependencies And Boundaries\n\nThe only Epic dependency, `hrn-00167`, is closed. Adjacent content cross-links are non-blocking.\n\nDo not change product, installer, configuration, command, skill, module, provider, or host behavior. Do not operate a harness or provider, promise delivery dates, duplicate adjacent references, or perform theme work.\n\n## Release And Rollback\n\nLater Release uses one scoped feature branch, commit, push, and ready pull request after Verify. No deployment or merge is included. Rollback reverts the Harnesses page, focused tests, and regenerated LLM indexes together."
