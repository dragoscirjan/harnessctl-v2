"body": "# Provide opt-in repository intelligence guidance across coding harnesses\n\n## Outcome\n\nHarnessctl provides an opt-in, provider-neutral `sdlc-code-index` skill and sourced integration guidance for external repository-intelligence MCP servers. Users choose, install, configure, secure, operate, and remove each external server.\n\n## Product Contract\n\n```yaml\nskills:\n  sdlc-code-index:\n    enabled: false\n    mcp_server: sdlc-code-index\n```\n\n- The skill is disabled by default.\n- `mcp_server` defaults to `sdlc-code-index` and is compiled into skill guidance only.\n- The server name is strictly validated and safely rendered in Python, TypeScript, Zod, and generated JSON Schema contracts.\n- Enabling the skill generates byte-equivalent selected-host skill files for OpenCode and Pi.\n- Disabling a fresh installation creates no code-index skill. Disabling later leaves existing generated skill bytes dormant unless normal managed-file update semantics replace them.\n\n## Boundaries\n\nHarnessctl does not create, change, recognize, remove, probe, install, start, index, watch, update, or otherwise operate code-index MCP server entries or provider runtimes. Existing external MCP entries remain untouched and require user audit or removal. Generic CVS and issue MCP behavior remains unchanged.\n\nThe unreleased provider-owned `mcp.servers.sdlc-code-index` schema is replaced atomically. Legacy provider configuration is rejected with migration guidance rather than silently interpreted or disabled.\n\n## Epics\n\n1. `hrn-00105` removes harnessctl-owned provider configuration and runtime projection, introduces the strict disabled-by-default skill registry contract, and remediates `hrn-00102` by eliminating the unsafe startup path.\n2. `hrn-00103` publishes one consolidated, sourced, versioned external integration guide after the implementation contract is stable.\n\n## Acceptance\n\n- Python and TypeScript defaults, validation, Zod, and generated schema agree on the exact skill contract.\n- The skill remains provider-neutral, names only the configured MCP server, treats MCP results as advisory evidence, and retains source verification plus Glob/Grep/read fallback.\n- Selected-host generation, disabled-fresh absence, dormant behavior, package artifacts, and isolated rendering are tested.\n- Code-index configuration causes zero host MCP mutation and executes no provider command or lifecycle action.\n- Provider guidance covers installation, OpenCode/Pi configuration, server-name mapping, lifecycle, storage, privacy, telemetry, licensing, limitations, and current source/version references.\n- Quality, package/runtime smoke, migration, and independent review gates pass before release.\n\n## Historical Authority\n\n`hrn-00083` and provider Epics `hrn-00085` through `hrn-00090` are superseded history. Closed foundation Epic `hrn-00084` and completed descendants remain immutable implementation history; their unreleased provider-runtime direction is not the current product contract.\n\n## Non-Goals\n\n- Provider executables, commands, arguments, environment values, credentials, storage paths, or lifecycle ownership.\n- Automatic MCP host configuration or cleanup.\n- Provider multiplexing, probing, installation, startup, indexing, watching, deletion, model setup, or database management.\n- Endorsing one provider as the default runtime."
