"body": "# Retire completed repository-only .specs migration machinery\n\n## Goal\n\nPreserve the already converted canonical Documents authority, then remove all reusable migration machinery. The one-time `.specs` conversion served only this unreleased repository and must not ship as a harnessctl feature.\n\n## Preservation Gate\n\nBefore deleting migration code or temporary control evidence:\n\n- Validate exactly 19 completion mappings into 19 source-derived canonical records across 14 lineages.\n- Verify each canonical target path and `targetSha256` against current bytes.\n- Verify each target's `metadata.legacy_spec` source path, source digest, original frontmatter/status, decoder version, field conversions, and rewrites.\n- Distinguish the two approved v4 successors from the 19 converted records; 21 direct active files exist at Plan completion.\n- Validate canonical issue links, absent direct `.specs/*.md` sources and migration `transaction.json`, unchanged `.specs-v1`, Documents authority, and Issues authority.\n- Bind exact source/target paths, source/target digests, and lineage identities into immutable checked-in preservation evidence that remains testable after completion-state deletion.\n\n## Removal Scope\n\n- Delete migration runtime, CLI arguments/entrypoint/service, migration-only streaming transaction, Python bridge, packaged runner/resources, provenance carrier, resource-generation scripts, package hooks/bin/exports, consent/API/CLI option, migration tests, current guidance, and generated outputs.\n- Remove the temporary completion record and now-empty migration-specific control directory only after persistent preservation evidence passes.\n- Remove empty `.specs`; keep `.specs-v1` byte-unchanged as inert history.\n- Retain ordinary Documents lifecycle transactions, journal recovery, archive/restore, exact revisions, issue-reference preflights, and cache rebuild.\n- Preserve immutable comments, superseded designs, changelog history, canonical per-document provenance, and unrelated dirty-worktree changes.\n\n## Acceptance Criteria\n\n- [ ] Temporary completion evidence and persistent checked-in preservation evidence agree on all 19 source/target paths, digests, and 14 lineage identities before deletion.\n- [ ] After completion deletion, persistent evidence validates every canonical target and `metadata.legacy_spec` without migration runtime or control state.\n- [ ] All 19 converted records and 14 lineages remain valid and content-preserved alongside the two approved v4 successors; canonical issue links remain valid.\n- [ ] `.specs-v1` remains unchanged; direct `.specs/*.md`, empty `.specs`, and migration-specific control state are removed only after preservation validation.\n- [ ] Installer API/help, Python artifacts, npm exports/bin/tarballs, root scripts, lockfile direct declarations, tests, current docs, and generated output expose no migration capability.\n- [ ] Ordinary Documents recovery and all nine lifecycle tools remain intact and covered.\n- [ ] No new `.specs` or `.ai.tmp` link compatibility exists.\n- [ ] Focused preservation/absence tests, complete quality/build/package/artifact gates, Documents validation, Issues validation, and final diff-loss review pass.\n\n## Failure Rule\n\nAny mapping, digest, provenance, lineage, issue-link, or `.specs-v1` mismatch blocks deletion. SQLite is never preservation evidence. Never reset or clean the dirty worktree."
