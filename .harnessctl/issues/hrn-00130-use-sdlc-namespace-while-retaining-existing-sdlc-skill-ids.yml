"body": "# Use `sdlc-` namespace while retaining existing SDLC skill IDs\n\n## Objective\n\nCorrect the uncommitted `harnessctl-*` implementation to the approved namespace: five support skills gain `sdlc-`, while `sdlc`, `sdlc-code`, and `sdlc-code-index` remain unchanged.\n\n## Canonical Names\n\n- `caveman` -> `sdlc-caveman`\n- `cvs` -> `sdlc-cvs`\n- `develop-tdd` -> `sdlc-develop-tdd`\n- `issue-tracking` -> `sdlc-issue-tracking`\n- `memory` -> `sdlc-memory`\n- `sdlc` -> `sdlc`\n- `sdlc-code` -> `sdlc-code`\n- `sdlc-code-index` -> `sdlc-code-index`\n\n## Scope\n\n- Correct canonical registries, physical template directories, frontmatter, generated cross-loads, OpenCode/Pi installer targets, smoke checks, focused tests, docs, changelog, wheel/sdist contents, and committed host outputs.\n- Replace the unshipped `--replace-harnessctl-skill-set` option with `--replace-sdlc-skill-set` without a compatibility alias.\n- Keep functional configuration and MCP identities unchanged.\n- Treat only the five old unprefixed support IDs as migration candidates. The three retained `sdlc*` IDs are canonical and must never be deletion targets.\n- Do not add product compatibility for unshipped `harnessctl-*` names.\n\n## Acceptance\n\n- Fresh OpenCode, Pi, and all-harness installs expose applicable corrected IDs and no `harnessctl-*` IDs.\n- `sdlc`, `sdlc-code`, and `sdlc-code-index` paths, frontmatter, resources, and loads remain unchanged.\n- The five support skills use `sdlc-` consistently in source, generated outputs, docs, smoke checks, and packages.\n- Existing `skills.sdlc-code-index` configuration remains valid and produces `sdlc-code-index`.\n- `--replace-sdlc-skill-set` authorizes migration only for disclosed selected-host roots of the five legacy support IDs; `--force` alone never authorizes deletion.\n- Optional caveman, memory, TDD, and code-index behavior remains unchanged.\n- Focused tests and lint pass before Verify.\n\n## Order and Estimate\n\nExecute before `hrn-00131`, then integrate both in one corrective Build. Estimate: 0.5-1 day; medium uncertainty from the large uncommitted generated-tree correction.\n\n## Non-Goals\n\nNo command, provider, tool/MCP, functional config, global-skill, or established `sdlc*` rename. No compatibility alias for unshipped names.\n\n## Route\n\nPlan reconciled in `hrn-00129`. Ready for `work-build hrn-00129`; remain open until Build and Verify provide completion evidence."
