"body": "# Workspace identity and session binding core\n\n## Objective\n\nProvide stable workspace identity and concurrency-safe host-session binding state independent of process cwd and optional Epic authority.\n\n## Scope\n\n- Add strict v2 workspace records keyed by collision-safe `ws-<ULID>` identity under Git common-directory control state.\n- Add strict v1 session binding records keyed by host and SHA-256 of opaque session ID; never expose raw session IDs.\n- Implement provisional allocation, binding, Epic attachment without branch/path rename, explicit v1 adoption, release, and exact recovery.\n- Preserve `doc-00019` v1 records; reject ambiguous or mismatched adoption without rewriting legacy state.\n- Use one repository-scoped lock, expected generations, exclusive temporary writes, bounded stale-lock handling, and atomic replacement.\n- Derive repository identity from canonical Git common-directory identity rather than display path alone.\n\n## Acceptance\n\n- Provisional workspaces allocate deterministic `harnessctl/workspace/<workspace-id>` branches and sibling paths without requiring Epic authority.\n- Attaching an Epic changes authority metadata and generations only; branch/path/commits remain unchanged.\n- Concurrent binding or attachment attempts serialize and stale generations fail before mutation.\n- Partial, malformed, unknown-schema, repository-mismatched, or future-generation records fail closed.\n- Exact v1 adoption creates v2 state while leaving the source v1 record, path, branch, and commits untouched.\n- Opaque session IDs do not appear in files, logs, errors, memory, or model-visible output.\n- Disabled workspace mode creates and consults no v2 workspace or binding records.\n\n## Artifacts\n\n- Generic workspace/session-binding state modules and exports under `extensions/generic-tools`.\n- Focused schema, locking, generation, allocation, attachment, adoption, concurrency, and recovery tests.\n- Typed error contracts needed by later routing and adapters.\n\n## Dependencies And Order\n\nSequence 1. Depends on closed `hrn-00208` and `hrn-00209`. Blocks all later children in this Epic.\n\n## Estimate\n\nM, medium uncertainty around cross-platform canonical repository identity and atomic durability.\n\n## Non-Goals\n\n- No host adapters, execution-root file routing, operation coordinator, lifecycle-template integration, workspace cleanup, legacy record deletion, or workspaces enablement."
