"body": "# Pi session routing adapter\n\n## Objective\n\nBind Pi project operations and supported built-ins to the current session's execution root while Pi remains launched from primary.\n\n## Scope\n\n- Use `sessionManager.getSessionId()` as opaque binding identity and host cwd only for control-root discovery.\n- Append non-authoritative custom recovery entries containing repository/workspace/Epic/generation evidence after successful binding transitions.\n- Resolve fresh binding state per call and override supported built-ins using Pi's exported read/write/edit/grep/find/ls/bash definition factories bound to the execution root.\n- Use `tool_call` to reject unsupported, external, stale, escaped, or semantically unrouteable calls; do not trust argument mutation without revalidation.\n- Route custom config, issue, document, memory, workspace, and operation tools through the generic resolver.\n- Apply the immutable exceptional-command consent boundary to direct user shell and keep routine Git/bootstrap/checks in the semantic registry.\n- Add capability detection with documented minimum/supported ranges and fail-closed diagnostics.\n\n## Acceptance\n\n- Two Pi sessions launched from primary independently use their bound roots for custom and supported built-in project tools.\n- Session start, switch, fork, resume, compaction, and reload preserve or recover one unambiguous binding and reject stale evidence.\n- Overridden built-ins receive a freshly resolved root and retain schema validation and containment.\n- Unsupported or external tools cannot silently access primary or another workspace while bound.\n- Missing session, custom-entry, override-factory, or rejection capabilities prevent routing startup with a stable diagnostic.\n- Model input cannot change routine command mechanics, cwd, consent, transitions, or evidence.\n- Disabled workspace mode preserves current Pi behavior.\n\n## Artifacts\n\n- Pi session binding/recovery integration, built-in overrides, and capability probe.\n- Minimum and known-compatible version fixtures.\n- Lifecycle, recovery, fork, override, exceptional-command, rejection, concurrent-session, and disabled-parity tests.\n\n## Dependencies And Order\n\nSequence 5. Depends on `hrn-01M1PZVHHZ2BC4CZYTQ3CP4T36`, `hrn-01M1PZW59JFNBYRC4FXZVNM2RA`, and `hrn-01M1PZWVCG54SEYZ57F23EJHF7`. May proceed in parallel with the OpenCode adapter after shared core completion.\n\n## Estimate\n\nM, medium uncertainty because exported override factories are proven locally but lifecycle recovery still needs range fixtures.\n\n## Non-Goals\n\n- No generic external-tool proxy, host cwd change, hot-loading, exact-version architecture binding, `hrn-00210` lifecycle policy, or workspaces enablement."
