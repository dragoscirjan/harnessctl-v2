"body": "# Align Python YAML parsing with TypeScript config validation\n\n## Summary\n\nPython configuration loading accepts duplicate YAML keys and can raise an unhandled `TypeError` for non-string mapping keys, while TypeScript rejects malformed YAML. Both runtimes must reject the same invalid documents through stable configuration errors.\n\n## Evidence\n\n- `src/harnessctl/config.py:97` uses `yaml.safe_load`, which applies last-key-wins duplicate handling.\n- `extensions/generic-tools/config.ts:78-84` rejects parser-reported duplicate-key errors.\n- `src/harnessctl/config.py:381-384` sorts and joins unknown keys without first requiring strings.\n\n## Acceptance Criteria\n\n- Python rejects duplicate YAML mapping keys at every nesting level with `ConfigError`.\n- Python rejects non-string mapping keys at every nesting level with `ConfigError`, never raw `TypeError`.\n- Error messages identify malformed configuration without exposing secret values.\n- Python and TypeScript tests cover duplicate root/nested keys and non-string root/nested keys.\n- Existing valid partial migration, unknown-compatible top-level extension, and strict known-branch behavior remains green.\n\n## Non-Goals\n\n- No new configuration fields or compatibility alias for the unreleased legacy `code_index` key.\n"
