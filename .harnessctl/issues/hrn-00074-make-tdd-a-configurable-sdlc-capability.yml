"body": "As a harnessctl user\nI want TDD to be an opt-in SDLC capability\nSo that configured development follows Red-Green-Refactor without changing existing projects by default.\n\n## Scope\n\n- Add boolean `workflow.tdd.enabled`, default `false`.\n- Preserve partial config-v2 migration and existing unknown-field compatibility.\n- Add a canonical generated `develop-tdd` skill using Red-Green-Refactor behavior.\n- Install the skill for selected OpenCode and Pi hosts only when enabled.\n- Compile enabled SDLC Build and Build-resuming Continue guidance to load `develop-tdd` before implementation.\n- Compile all TDD loading and enforcement out of Build and Continue guidance when disabled.\n- Treat existing TDD skill files as dormant when disabled; never delete, modify, warn about, or track ownership of them.\n- Update configuration/schema, templates, installer, package/release artifacts, tests, and docs.\n\n## Non-Goals\n\n- Config v3.\n- Runtime toggling without reinstall.\n- Framework-specific test commands.\n- Changes to Plan, Verify, Release, or merge policy.\n- Deleting dormant or operator-owned TDD skill files.\n- TDD loading or enforcement when the setting is disabled.\n\n## Design\n\nLightweight design embedded here. Extend the existing `workflow` configuration with `tdd.enabled`; specialize generated skill installation and SDLC Build/Continue guidance at install time. The canonical skill follows test-first Red-Green-Refactor: observe the correct failure, implement the minimum passing change, then refactor while tests remain green.\n\nEnabled selected hosts receive the canonical skill, and generated Build policy loads and enforces it. Continue loads that Build policy only when resuming Build. Disabled fresh installs do not generate the skill. Enabled-to-disabled reinstall leaves any existing skill untouched while compiling TDD loading and enforcement out of Build and Continue. No ownership marker, disabled-state cleanup, or specialized cleanup rollback exists.\n\n## Ordered Work\n\n1. Add the TDD workflow configuration contract (`hrn-00075`, done).\n2. Install and activate the configurable TDD skill (`hrn-00076`, done; cleanup requirement superseded by this revision).\n3. Enforce TDD when Continue resumes Build (`hrn-00080`).\n4. Remove TDD cleanup and ownership metadata (`hrn-00081`).\n5. Verify and document configurable TDD behavior (`hrn-00077`).\n\n## Acceptance\n\n- [ ] Given omitted or `false` configuration, generated Build and Continue guidance neither loads nor enforces TDD.\n- [ ] Given a fresh disabled installation, no `develop-tdd` skill is generated.\n- [ ] Given an existing TDD skill and disabled configuration, reinstall leaves the skill untouched and dormant.\n- [ ] Given `workflow.tdd.enabled: true`, selected hosts receive `develop-tdd`, and Build or Build-resuming Continue loads it before code changes.\n- [ ] Given enabled TDD execution, work follows observable Red, Green, and Refactor boundaries.\n- [ ] Python, TypeScript, generated JSON Schema, OpenCode, Pi, packaged artifacts, and docs remain consistent.\n- [ ] Existing config-v2 users retain current behavior by default.\n- [ ] Full repository quality and runtime-smoke gates pass in Verify.\n\n## Release, Rollback, Docs, Operations\n\n- Use the normal package release; no deployment or data migration.\n- Roll back workflow enforcement by disabling the setting and reinstalling; dormant skill files may remain and are not used by generated Build/Continue policy.\n- Update `docs/configuration.md`, `docs/skills.md`, and `docs/sdlc.md`.\n- No operational runbook is required.\n\n## Risks\n\n- Dormant installed skill may be mistaken for active policy: mitigate with explicit docs and assertions that disabled Build/Continue guidance does not load or enforce it.\n- Host behavior drift: mitigate with byte-parity and selected-host tests.\n- Enabled but inactive skill: mitigate with compile-time Build and Continue guidance and assertions.\n- Config shape drift: mitigate with cross-language and schema contract tests.\n\n## Evidence\n\n- `src/harnessctl/config.py`\n- `extensions/generic-tools/config.ts`\n- `extensions/generic-tools/schemas.ts`\n- `src/harnessctl/templates.py`\n- `src/harnessctl/install.py`\n- `src/harnessctl/templates/skills/sdlc/references/build.md.j2`\n- `src/harnessctl/templates/skills/sdlc/references/continue.md.j2`\n- `docs/configuration.md`\n- `docs/skills.md`\n- `docs/sdlc.md`\n\n## Estimate and Uncertainty\n\nFour implementation/verification Tasks plus resolved defects. Remaining work is small: remove the rejected cleanup subsystem, retain focused inactive-policy coverage, then Verify. Main uncertainty is regression exposure from simplifying cumulative installer tests; product semantics are confirmed."
