"body": "# Make workspace-binding publication crash-atomic\n\n## Summary\n\nVerify found that workspace and binding records are published through separate atomic renames with only in-process compensation.\n\n## Evidence\n\n`extensions/generic-tools/execution-context.ts:825-840` writes the workspace first and binding second. A process exit between writes bypasses the catch rollback. Approved LLD `doc-01M1PZMXJ99DRRW65A1E22G7TH` requires failed multi-record transitions to leave the previous valid generation authoritative.\n\n## Impact\n\nA crash can expose a partially published transition after restart, producing mismatched authority or generations.\n\n## Acceptance Criteria\n\n- Multi-record transitions have a durable commit/recovery protocol under the common-directory authority.\n- Readers never treat a partially published generation as authoritative.\n- Recovery is deterministic and non-destructive after failure at every publication boundary.\n- Fault-injection restart tests cover allocation, attachment, adoption, and rebind publication.\n"
