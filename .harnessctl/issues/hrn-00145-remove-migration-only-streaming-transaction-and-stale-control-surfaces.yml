"body": "# Remove migration-only streaming transaction and stale control surfaces\n\n## Summary\n\nThe streaming transaction and quarantine/recovery machinery exists only for the completed repository-specific `.specs` conversion. Harnessctl is unreleased and no external repository needs this migration path. Removing the subsystem is simpler and safer than extending its operator-state authentication model.\n\n## Scope\n\n- Delete `extensions/generic-tools/streaming-transaction.ts`, its tests, migration callers, exports, generated runner copies, and migration-specific control protocol.\n- Remove migration completion/recovery/quarantine behavior and its package/provenance surfaces after persistent preservation evidence validates the converted authority.\n- Remove only the migration-specific completion directory and stale control remnants; preserve the ordinary `.harnessctl/documents/.control` root.\n- Retain ordinary Documents lifecycle transaction/recovery behavior in `documents.ts`, including create/update/version/archive/restore rollback and issue-reference safety.\n- Preserve all canonical Documents, issue links, embedded legacy provenance, `.specs-v1`, immutable comments, and unrelated operator/worktree state.\n\n## Acceptance Criteria\n\n- [ ] No migration streaming transaction, preparation/quarantine recovery, completion protocol, export, runner copy, package resource, or test remains in active source/artifacts.\n- [ ] Migration-specific control state is removed only after the 19-record persistent preservation gate passes.\n- [ ] Ordinary Documents lifecycle recovery remains intact and its focused tests pass.\n- [ ] Existing, replaced, nonempty, unowned, or unrelated operator state is never removed as migration cleanup.\n- [ ] Canonical Documents and Issues validate; `.specs-v1` remains unchanged.\n- [ ] Stale-surface, package/artifact, full quality/build, and final diff-loss checks pass."
