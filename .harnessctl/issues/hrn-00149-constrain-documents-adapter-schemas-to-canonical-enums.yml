"body": "# Constrain Documents adapter schemas to canonical enums\n\n## Summary\n\nOpenCode and Pi publish broader Documents tool schemas than the canonical domain. Create/update/version status fields and list kind/status fields accept arbitrary strings at the adapter boundary even though authority permits exactly four kinds and three statuses.\n\n## Scope\n\n- Reuse canonical `DOCUMENT_KINDS` and `DOCUMENT_STATUSES` in OpenCode and Pi schemas.\n- Constrain `document_create`, `document_update`, and `document_version` kind/status inputs to canonical enums.\n- Constrain `document_list` kind/status filters to canonical enums.\n- Preserve generic runtime validation, metadata handling, normalized results, and all nine tool contracts.\n\n## Acceptance Criteria\n\n- [ ] OpenCode and Pi schemas accept only `hld`, `lld`, `design-overview`, and `gdd` for every kind input.\n- [ ] OpenCode and Pi schemas accept only `draft`, `review`, and `approved` for every status input.\n- [ ] Adapter parity tests cover create, list, update, and version schema acceptance/rejection for kind and status.\n- [ ] Generic behavior and existing lifecycle/package tests remain green.\n- [ ] Focused and full configured quality/build gates pass.\n\n## Evidence\n\nVerify round 3 found unrestricted `schema.string()` status/list fields in `extensions/opencode-tools/document-tools.ts:20,48,66-67` and unrestricted TypeBox strings in `extensions/pi-tools/document-tools.ts:21,39,61-62`. Existing tests constrain create-kind and list-location only. This violates Epic `hrn-00135` acceptance criterion 1 and Stories `hrn-00137`/`hrn-00139` adapter equivalence requirements."
