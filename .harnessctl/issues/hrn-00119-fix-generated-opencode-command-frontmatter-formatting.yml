"body": "# Fix generated OpenCode command frontmatter formatting\n\n## Defect\n\nGenerated OpenCode commands omit the blank line between YAML frontmatter and the Markdown heading. Prettier rejects all five committed `work-*` commands, so the full repository quality gate fails.\n\n## Evidence\n\n- `src/harnessctl/templates.py:150` joins the closing frontmatter delimiter directly to the rendered command body.\n- `.opencode/commands/work-build.md`, `work-continue.md`, `work-plan.md`, `work-release.md`, and `work-verify.md` each lost the separator line after installer regeneration.\n- `mise run quality` failed in `node-format` on exactly those five files during `work-verify hrn-00115`.\n- Existing renderer coverage checks command body parity but does not enforce valid frontmatter spacing.\n\n## Impact\n\nEpic `hrn-00115` cannot pass Verify or proceed to Release. Regenerating commands through the supported installer produces repository-format-invalid output.\n\n## Likely Cause\n\nThe OpenCode command wrapper in `src/harnessctl/templates.py` ends with one newline instead of the blank-line separator expected by the repository Markdown formatter.\n\n## Acceptance Criteria\n\n- OpenCode command rendering emits valid YAML frontmatter followed by the repository-required blank line.\n- All five repository-local `.opencode/commands/work-*.md` files are regenerated from the corrected renderer.\n- A structural regression test fails if frontmatter and command body are not separated correctly.\n- Focused renderer/installer checks, full `mise run quality`, and `git diff --check` pass.\n- Pi command behavior and command semantics remain unchanged.\n\n## Boundaries\n\nCorrect only renderer formatting, generated outputs, and focused regression coverage. Do not change command semantics, Epic architecture, global skills, or enter Release."
