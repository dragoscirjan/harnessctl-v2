"body": "# Clarify disabled code-index host MCP documentation\n\n## Defect\n\n`docs/skills.md` says a fresh disabled code-index install does not inspect or change host MCP entries. The installer still performs unrelated generic CVS and issue MCP projection, which can read and update host configuration. Only code-index configuration and code-index MCP entries are outside harnessctl ownership.\n\n## Evidence\n\n- `docs/skills.md:49-50` makes the unqualified host MCP claim.\n- `src/harnessctl/install.py:125-127,314-339` still computes and projects generic MCP intents.\n- `src/harnessctl/mcp.py:54-71` retains CVS and issue intents by design.\n\n## Impact\n\nOperators may infer that disabling code indexing suppresses every host MCP configuration interaction. That conflicts with intended unchanged generic CVS/issues behavior and overstates the code-index isolation guarantee.\n\n## Acceptance Criteria\n\n- Documentation scopes non-inspection and non-mutation guarantees to code-index configuration and code-index MCP entries.\n- Documentation states that unrelated configured generic CVS/issues MCP projection remains active and unchanged.\n- Documentation tests reject the unqualified whole-host claim and assert the corrected boundary.\n- No installer behavior or external provider lifecycle changes are introduced.\n- Focused docs tests, repository quality, issue validation, and `git diff --check` pass.\n\n## Boundaries\n\nDocumentation-only corrective work unless Build discovers contradictory implementation evidence. Do not execute or manage an external provider. Do not enter Build during Verify."
