    "body": "Build repair evidence: canonical SDLC guidance is compiled from `skills.sdlc-code-index.enabled`; enabled output loads the skill when relationship-aware retrieval/impact is relevant, while disabled output explicitly refuses discoverable retained copies and falls back to source/Glob/Grep/reads. OpenCode/Pi parity, stale retained-byte behavior, wheel/sdist isolated rendering, and docs are covered. Docs place runtime MCP handshake outside harnessctl SDLC as a separate user-authorized operation. Full quality/runtime/validation/diff checks passed; independent scoped re-review approved. No provider execution."
