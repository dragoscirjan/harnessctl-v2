    "body": "Build evidence ready. Core SDLC now explicitly loads available `sdlc-code-index` before relevant relationship-aware retrieval or impact analysis and falls back to direct source discovery, Glob, Grep, and file reads when unavailable or unsuitable. Canonical template, OpenCode/Pi installed-output byte parity, wheel/sdist isolated rendering, and docs are covered. Affected suites: 249 passed. Full `mise run quality`: 309 Python + 202 Node tests and all lint/format/type/package/artifact checks passed. `mise run runtime-smoke`, Bug/Epic validation, memory validation, and `git diff --check` passed. No external provider, remote, destructive, Verify, or Release action ran. Awaiting separate closure confirmation."
  - "id": "hrn-00107-C0002"
    "created_at": "2026-08-22T23:01:59.815Z"
    "created_by": "lead-engineer"
    "body": "Formal Verify regression: core SDLC loads any discoverable `sdlc-code-index`, but disabled installation intentionally preserves prior files as discoverable and active-capable. A disabled user can therefore load stale provider-specific guidance instead of falling back. Docs also assign runtime MCP handshake ownership to Verify despite external lifecycle remaining user-owned. Reopen for enabled-state-aware loading, disabled stale-copy coverage, and corrected operations wording. Independent correctness and security/privacy reviews both requested changes."
  - "id": "hrn-00107-C0003"
