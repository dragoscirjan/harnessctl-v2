"body": "# Make SDLC explicitly load the code-index skill when relevant\n\n## Summary\n\nThe generated `sdlc-code-index` skill is discoverable by supported hosts, but the canonical `sdlc` skill never instructs the LLM to load it. Host discovery alone does not reliably integrate code-index retrieval into SDLC work.\n\n## Evidence\n\n- `src/harnessctl/templates/skills/sdlc/SKILL.md.j2` contains no `sdlc-code-index` instruction.\n- `src/harnessctl/templates/skills/sdlc-code-index/SKILL.md.j2` defines retrieval, source-verification, fallback, and lifecycle boundaries only after that separate skill is loaded.\n- `src/harnessctl/templates.py` registers both as sibling installable skills; registration does not make one load the other.\n\n## Impact\n\nPlan, Build, Verify, Release, or Continue can perform relevant codebase retrieval or impact analysis without loading the available code-index guidance. Usage is therefore opportunistic rather than an explicit SDLC behavior.\n\n## Acceptance Criteria\n\n- The canonical SDLC prompt explicitly instructs the LLM to load `sdlc-code-index` when it is available and relationship-aware codebase retrieval or impact analysis is relevant.\n- The instruction remains conditional so disabled or unavailable code-index operation continues through direct source discovery, Grep, Glob, and file reads.\n- Loading the skill preserves its advisory-evidence, source-authority, fallback, and no-lifecycle-authority boundaries.\n- Every generated OpenCode and Pi SDLC skill receives byte-equivalent guidance.\n- Canonical template, installed-output, and wheel/sdist isolated-package tests prove the instruction is present.\n- Documentation describes explicit conditional loading rather than relying on host discovery.\n- No external MCP provider command executes during implementation or tests.\n\n## Boundaries\n\nDo not register, install, configure, start, probe, index, watch, mutate, or remove an external MCP server. Do not add provider-specific instructions.\n\n## Verification Classification\n\nRequirements/integration defect found during formal Verify of `hrn-00105`."
