"body": "# Install ask-user-question extension for Pi\n\n## Summary\n\nInstall the pinned `@juicesharp/rpiv-ask-user-question` extension for Pi so interactive Pi sessions provide native option-picking through the `ask_user_question` tool.\n\n## Planning\n\n- Mode: standalone Epic; no parent.\n- Classification: bounded installer enhancement with an external package dependency.\n- Design depth: none. The change extends the established Pi package pipeline without changing architecture, data flow, or public package APIs. A design overview would duplicate existing installer design; HLD or LLD would be disproportionate.\n- Estimate: Small, one Build session plus Verify.\n\n## Scope\n\n- Add pinned source `npm:@juicesharp/rpiv-ask-user-question@2.7.1`.\n- Require it for `--harness pi` and `--harness all`, independent of MCP intents.\n- Route it through existing consent, preflight, isolated environment, install, registration inspection, smoke-check, transaction tracking, and best-effort rollback behavior.\n- Extend source/name validation and allowed Pi package actions for the new identity.\n- Preserve deterministic package order.\n- Extend installer and release-artifact tests.\n- Update `README.md`, `docs/skills.md`, and `docs/cvs.md` where Pi-installed packages and commands are documented.\n\n## Non-Goals\n\n- Forking, wrapping, or modifying the upstream extension.\n- Managing `~/.config/rpiv-ask-user-question/config.json`.\n- Adding the tool to OpenCode or changing other harness behavior.\n- Making the tool available in Pi noninteractive mode; upstream intentionally removes it there.\n- Auto-upgrading beyond version `2.7.1`.\n- Changing Pi consent flags or rollback guarantees.\n\n## Evidence\n\n- Installer package pipeline: `src/harnessctl/install.py:107-108`, `src/harnessctl/install.py:386-559`, and `src/harnessctl/install.py:1096-1141`.\n- Existing regression coverage: `tests/test_install.py`.\n- Repository verification tasks: `mise.toml:54-171`.\n- Upstream package: MIT, Node 22+, Earendil Pi peers, npm `2.7.1`, tag commit `3ae7bfbf7802ec9392a7d9228a30c82399a7f88b`.\n- Duplicate search found no existing Initiative or Epic matching this outcome.\n\n## Ordered Work\n\n1. Add installer tests proving the new package participates in Pi planning, consent, exact install order, configured-package detection, smoke checks, failure handling, and rollback.\n2. Add the pinned constant and include it in `required_pi_packages` for Pi and all.\n3. Extend package identity/name validation and `_run_pi_package_action` allowlisting.\n4. Update package registration and release-artifact assertions affected by the new required package.\n5. Update installer-facing documentation with the exact pinned command, interactive-only behavior, restart expectation, license, and unmanaged optional config.\n6. Run targeted then repository-wide verification.\n\n## Dependencies\n\n- Runtime: Pi coding agent and npm availability already required by the existing Pi package pipeline.\n- External: `@juicesharp/rpiv-ask-user-question@2.7.1`.\n- Issue dependencies: none.\n- Issue relationships: none.\n\n## Acceptance Criteria\n\n1. Given `harness=pi` or `harness=all`, the install plan requires exact source `npm:@juicesharp/rpiv-ask-user-question@2.7.1`, even without MCP intents.\n2. Given the exact source is absent, no package command runs without existing explicit Pi package-install authorization.\n3. Given authorization, installation uses exact noninteractive command form `pi install -l npm:@juicesharp/rpiv-ask-user-question@2.7.1 --approve` in deterministic order.\n4. Given the exact source is already registered, it is not reinstalled.\n5. Given malformed, duplicate, unpinned, or wrong-version relevant registration, preflight fails before package mutation or project writes.\n6. Given post-install verification or later installation failure, only transaction-installed packages are removed; pre-existing packages remain untouched and tracked project state is restored.\n7. Smoke checks require exact registration for every required Pi package.\n8. OpenCode-only installation behavior remains unchanged.\n9. Documentation states tool name `ask_user_question`, interactive/RPC/ACP support, noninteractive absence, restart expectation, MIT license, pin, and unmanaged optional user config.\n10. Targeted and full repository quality checks pass.\n\n## Verification\n\n- Targeted: `uv run pytest tests/test_install.py tests/test_release_artifacts.py`.\n- Formatting: `mise run python-format-check`.\n- Lint: `mise run python-lint`.\n- Full regression and artifact gates: `mise run quality`.\n- Automated tests do not require a live npm package installation; subprocesses remain mocked or isolated.\n\n## Release\n\n- Release in the next normal `harnessctl` version with release notes identifying the new Pi dependency and pinned version.\n- No migration or deployment operation is required.\n\n## Rollback\n\n- Revert the required package constant/list, validation, tests, and docs in a subsequent release.\n- Existing runtime rollback remains best-effort because npm metadata, caches, downloads, and lifecycle effects may remain after package removal.\n\n## Operations\n\n- No service, secret, API key, model call, telemetry, or managed config.\n- Upstream version changes require deliberate pin review and evidence refresh.\n\n## Risks And Mitigations\n\n- Risks: upstream package disappearance, transitive dependency drift, Pi compatibility drift, and user surprise from an additional consent-gated package.\n- Mitigations: exact pin, license and peer verification, fail-closed registration checks, explicit consent, isolated tests, and release notes.\n\n## Blockers\n\nNone known.\n"
