"body": "Given a proposed store, supersede, or record import, when mutation policy is evaluated, then concise caveman input is required without invalidating existing records.\n\nAcceptance:\n- Mutation limits are 240 summary characters, 2,000 detail characters, and 12 non-empty detail lines.\n- Preview and mutating import return equivalent diagnostics.\n- Existing records at canonical v1 limits still load, validate, retrieve, and export."
