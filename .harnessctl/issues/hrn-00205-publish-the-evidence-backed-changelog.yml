"body": "# Publish the evidence-backed changelog\n\n## User Story\n\nAs a harnessctl user, I want a source-linked change history so that I can distinguish shipped product and package releases, documentation updates, and unreleased work.\n\n## Scope\n\n- Replace `docs/changelog.md` with an explanation of authoritative release streams and evidence.\n- Present shipped root release `0.2.0`, public package releases such as `0.1.10`, explicitly Unreleased work, and dated documentation changes as distinct sections.\n- Link checked-in root/package changelogs, current GitHub Releases, and dated merged PR or commit evidence.\n- Keep authoritative changelogs and release notes as detail owners.\n\n## Acceptance Criteria\n\n- Shipped entries are dated and versioned where applicable and have adjacent authoritative evidence.\n- Unreleased entries remain visibly Unreleased and are never described as shipped or assigned an inferred date.\n- Package release state is not inferred solely from incomplete local tags.\n- Documentation changes are labeled as documentation and source-linked to dated commits or merged PRs.\n- The page makes no publication, provider-operation, compatibility, or ETA claim beyond current evidence.\n\n## Dependencies And Order\n\nParent `hrn-00178`; order 3; no child dependency. Linked design authority: `doc-00017` v2 and `docs/status-and-evidence.md`.\n\n## Estimate And Risks\n\nEstimate S. Main risks are stale release data and mixing Unreleased, package, product, and documentation streams.\n\n## Non-Goals\n\nNo release creation, package publication, rewriting authoritative changelogs/release notes, provider operation, roadmap, deployment, or theme/browser work."
