"body": "# Git Epic Workspace Primitives\n\n## Objective\n\nProvide deterministic, enforceable, opt-in Git workspace operations so multiple agents can work on separate Epics from one clone without sharing a working tree or index.\n\n## Requirements And Scope\n\n- Add required `skills.cvs.workspaces` across canonical Config v1 contracts, defaulting to `false`; explicitly enable it in this repository.\n- Reject `workspaces: true` unless CVS is enabled and `skills.cvs.local` is `git`, with equivalent TypeScript and Python validation.\n- Render workspace capability into canonical and installed `sdlc-cvs` guidance.\n- Implement normalized `workspace_ensure`, `workspace_status`, `workspace_mark_cleanup_ready`, and `workspace_cleanup` operations in generic-tools and expose them equally through OpenCode and Pi.\n- Use one deterministic branch and linked worktree per active canonical Epic.\n- Keep workspace operational state local to the shared Git common directory, not tracked canonical authority.\n- Fail closed on dirty, stale, mismatched, ambiguous, interrupted, bare-repository, or unsafe cleanup state.\n- Return the expected workspace path when cwd is wrong; never claim a command can persistently change the host process cwd.\n\n## Approved Design\n\nImplement approved LLD `doc-00019`.\n\n- Branch: `harnessctl/epic/<canonical-epic-id>`.\n- Path: sibling `<primary-parent>/<primary-name>--workspaces/<canonical-epic-id>`.\n- Discover primary/current/linked topology from NUL-delimited Git porcelain and reject ambiguous ownership.\n- Persist schema-versioned records under the resolved Git common directory with a shared common-dir lock and lifecycle `creating -> active -> cleanup_ready -> closed`.\n- Before first creation, require a clean primary checkout and active Epic authority committed in primary `HEAD`.\n- Record creation intent, invoke Git through bounded argument-array subprocesses without a shell, then promote only after exact topology verification.\n- Serialize concurrent mutations; recover interrupted creation only from exact mechanical evidence, otherwise require manual intervention.\n- Mark cleanup-ready only from the matching clean active workspace. Never remove the current cwd.\n- Clean up only from the exact primary checkout and only a matching clean cleanup-ready registered worktree. Remove the worktree, retain the Epic branch, and record closed.\n- Do not silently adopt, repair, delete, or migrate externally changed state.\n\n## Executable Plan\n\n1. `hrn-00214` Workspace Configuration and Generated Contracts: add the setting, defaults, cross-field refinements, generated schemas/defaults/fingerprints, Python parity, installer rendering, repository opt-in, and focused tests.\n2. `hrn-00215` Git Workspace State Engine: implement topology discovery, deterministic mapping, shared metadata/locking, safe Git execution, state transitions, race/interruption recovery, cleanup protections, and real-repository tests. Depends on `hrn-00214`.\n3. `hrn-00216` OpenCode and Pi Workspace Tool Parity: register all four tools with identical contracts, cwd routing, errors, and adapter/integration tests. Depends on `hrn-00214` and `hrn-00215`.\n4. `hrn-00217` Documentation, Compatibility, and Release Gates: update public/generated guidance, Changesets, package evidence, and complete quality gates. Depends on `hrn-00214`, `hrn-00215`, and `hrn-00216`.\n\n## Acceptance Criteria\n\n- Default-disabled installations preserve existing CVS behavior and existing worktrees, branches, and metadata.\n- TypeScript and Python reject workspace enablement unless CVS is enabled with local Git, using precise config paths.\n- Distinct Epics map to distinct deterministic branches and paths; concurrent or repeated ensure for one Epic converges idempotently.\n- First creation refuses uncommitted Epic authority or a dirty primary checkout.\n- Status verifies repository/common directory, Epic, primary/current/expected paths, branch, registration, cleanliness, and lifecycle without mutation.\n- Interrupted creation, path/ref collisions, stale metadata, external worktree changes, malformed state, wrong cwd/branch/path, and paths containing spaces are tested and fail safely.\n- Cleanup-ready never deletes active cwd. Cleanup only runs from primary, refuses dirty/current/descendant/mismatched/unregistered targets, retains the branch, and records closed.\n- OpenCode and Pi expose equivalent tools and behavior through shared generic logic.\n- Canonical config, generated contracts/fingerprints, Python loader, installer templates, installed projections, documentation, packages, and tests remain synchronized.\n\n## Verification\n\n- Run generic-tools config, contract-generation/check, workspace unit, concurrency, interruption, and temporary real-Git repository suites.\n- Run Python Config v1, installer, template, docs, and release-artifact tests.\n- Run OpenCode and Pi unit and integration suites, typecheck, lint, format, and build.\n- Run repository quality, build, generated-contract, package, and compatibility gates.\n- Verify disabled-mode upgrade behavior and no canonical Issue, Document, or cache migration.\n\n## Migration And Rollback\n\nNo authority, cache, branch, or worktree migration. The setting defaults off; this repository opts in explicitly. Disable `skills.cvs.workspaces` first to roll back behavior. Disabling or older code must leave existing linked worktrees, retained branches, and common-dir metadata untouched. Cleanup remains an explicit later operation from the primary checkout.\n\n## Release And Documentation\n\nUse the repository's standard Changesets/package/PR flow only after Build and Verify. Document configuration, Git-only support, deterministic naming, command location requirements, lifecycle states, deferred cleanup, recovery failures, branch retention, and unsupported Jujutsu behavior. No automatic merge or deployment behavior is added.\n\n## Operations\n\nNo daemon or service is introduced. Git is invoked locally with bounded execution and output. Operators resolve reported stale/manual-intervention states explicitly; tools do not force-remove, reset, delete branches, or retry ambiguous mutations.\n\n## Risks\n\n- Git interruption between intent and topology update; mitigate with common-dir locking, durable state, and exact recovery evidence.\n- Cross-platform path/canonicalization differences; mitigate with canonical paths and real temporary repositories including spaces.\n- Manual Git worktree changes causing stale records; detect and fail rather than silently adopt.\n- Generated TypeScript/Python contract drift; enforce generation and fingerprint checks.\n- Dependency `hrn-00208` remains open; Build is blocked until collision-safe authority identities complete.\n\n## Estimate\n\nL, approximately 5-8 engineering days. Highest uncertainty is concurrent process/interruption behavior and cross-platform Git path semantics.\n\n## Non-Goals\n\n- Initiative workspaces or more than one workspace per Epic\n- Jujutsu workspace support\n- Persistent shell/process cwd switching\n- Branch deletion or workspace reopening\n- Automatic merge, PR verification, or remote provider orchestration\n- SDLC lifecycle integration owned by `hrn-00210`\n- Rewriting existing Issue, Document, memory, cache, branch, or worktree authority\n"
