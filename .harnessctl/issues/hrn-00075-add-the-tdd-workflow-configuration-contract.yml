"body": "## Objective\n\nDefine one compatible config-v2 switch for opt-in TDD behavior.\n\n## Scope\n\n- Add `workflow.tdd.enabled` to Python and TypeScript defaults.\n- Validate it as boolean while preserving current partial-overlay migration and unknown-field compatibility.\n- Generate the matching JSON Schema contract and update focused config tests.\n\n## Acceptance\n\n- [ ] Omitted setting resolves to `false` in Python and TypeScript.\n- [ ] Explicit `true` and `false` are accepted consistently.\n- [ ] Non-boolean values fail with a path-specific error.\n- [ ] Generated JSON Schema exposes the same default-compatible shape.\n- [ ] Existing config-v2 and partial-overlay cases remain compatible.\n\n## Dependencies\n\nNone. First ready Task.\n\n## Non-Goals\n\n- Installing or activating the skill.\n- Config v3 or unrelated workflow validation.\n\n## Estimate\n\nSmall. Moderate uncertainty around preserving loose legacy `workflow` fields."
