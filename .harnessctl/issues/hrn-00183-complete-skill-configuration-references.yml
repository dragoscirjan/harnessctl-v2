"body": "# Complete Skill Configuration references\n\n## Objective\n\nMake Skill Configuration cover every current configurable Config v1 skill domain exactly once.\n\n## Scope\n\n- Reconcile the existing Issues, Documents, Memory, Code Index, and CVS routes as exact configuration references.\n- Add Caveman, TDD, and Web Retrieval routes under Skill Configuration.\n- For each domain, document controls, defaults, dependencies, provider or MCP references, credential handling, safety boundaries, unsupported behavior, and source provenance.\n- Link Skills, MCP Servers, Node Modules, and conceptual guides instead of duplicating catalogs or tutorials.\n\n## Acceptance Criteria\n\n- Reference routes have exact parity with `issues`, `documents`, `cvs`, `caveman`, `tdd`, `codeIndex`, `webRetrieval`, and `memory` in Config v1.\n- Every configurable field/default links to Config Schema authority and appears under one canonical domain owner.\n- Credentials use environment-variable names or placeholders only.\n- Existing guide prose is preserved where useful but exact configuration, guide, and catalog intents are visibly distinct.\n- Navigation, deep links, and cross-links remain stable and accessible.\n\n## Dependencies And Order\n\nOrder 4. Depends on `hrn-00180` and `hrn-00181` for Config File and Schema conventions.\n\n## Artifacts\n\nExisting Skill Configuration pages; new Caveman, TDD, and Web Retrieval pages; `mkdocs.yml`; Config v1 schema/defaults; focused docs tests.\n\n## Estimate And Uncertainty\n\nM. Main uncertainty is separating mixed existing guide/reference prose without breaking useful links.\n\n## Non-Goals\n\nSkills or MCP catalog content; provider setup tutorials; capability behavior or configuration changes."
