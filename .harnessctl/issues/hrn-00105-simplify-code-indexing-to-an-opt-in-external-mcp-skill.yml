"body": "# Simplify code indexing to an opt-in external MCP skill\n\n## Objective\n\nReplace the unreleased provider-owned code-index configuration and runtime adapter with a disabled-by-default, provider-neutral generated skill that references a user-managed external MCP server by name.\n\n## Approved Contract\n\n```yaml\nskills:\n  sdlc-code-index:\n    enabled: false\n    mcp_server: sdlc-code-index\n```\n\n`mcp_server` is guidance data only. It never identifies an owned host entry and never authorizes installation, startup, indexing, mutation, recognition, reconciliation, or removal.\n\n## Lightweight Design\n\n- `mcp_server` is 1–64 lowercase ASCII characters.\n- It starts and ends with an alphanumeric character; interior characters are alphanumeric, `_`, or `-`.\n- The `cvs_` prefix is reserved for harnessctl-owned MCP identities and is rejected.\n- Both legacy top-level `code_index` and legacy `mcp.servers` are rejected before default merge with explicit migration guidance.\n- A fresh disabled install writes no code-index skill.\n- If disabled while a prior skill exists, harnessctl preserves its bytes, warns that the discoverable file remains active-capable, and names the manual removal path. It never deletes the file automatically.\n- Existing code-index host MCP entries remain byte-for-byte untouched under enabled, disabled, `--force`, and transactional rollback paths.\n- Generic CVS and issue MCP projection behavior remains unchanged.\n\n## Scope\n\n- Atomically migrate Python/TypeScript/Zod/generated-schema configuration while removing the live CodeGraphContext/code-index runtime adapter.\n- Remove provider schemas, defaults, discriminators, desired/recognized intents, fixed commands, literal environment mappings, probes, CodeGraphContext mise declaration/lock entry, and provider-specific template guidance.\n- Add strict cross-runtime defaults and validation for the known `skills.sdlc-code-index` entry.\n- Generate the canonical provider-neutral `sdlc-code-index` skill only for enabled selected hosts, with byte parity across OpenCode and Pi.\n- Preserve disabled-fresh absence and explicit warning-backed dormant-file behavior.\n- Ensure code-index configuration performs zero OpenCode/Pi MCP host mutation.\n- Update tests, generated contracts, package artifacts, implementation/migration docs, and Changeset metadata.\n\n## Ordered Work\n\n1. `hrn-00102` atomically removes the unsafe adapter and migrates the config contract. This coupling is mandatory because the current adapter consumes the current provider schema.\n2. `hrn-00106` finalizes the provider-neutral generated skill, disabled warning/dormancy behavior, package artifacts, docs, Changeset, and release evidence.\n3. Guide Epic `hrn-00103` remains blocked until this Epic verifies.\n\n## Acceptance\n\n- Python and TypeScript defaults are exactly `enabled: false` and `mcp_server: sdlc-code-index`.\n- Python validation, TypeScript Zod, generated JSON Schema, and partial-merge behavior agree.\n- Unknown skill IDs/fields, invalid or reserved identifiers, nulls, arrays, provider fields, commands, credentials, and arbitrary pass-through fail clearly.\n- Legacy `code_index` and `mcp.servers` fail before merge with actionable migration guidance.\n- Enabling selected hosts writes byte-equivalent canonical skills containing only the configured server name and provider-neutral retrieval guidance.\n- A fresh disabled install writes no code-index skill; later disablement preserves exact prior bytes and warns with the manual removal path.\n- Enabled, disabled, `--force`, migration, and rollback runs leave existing code-index host MCP subtrees unchanged.\n- CodeGraphContext/code-index desired and recognized intents, commands, literal environment, probe, mise declaration, and lock entry are absent.\n- Existing generic CVS and issue MCP projections remain byte-equivalent.\n- Wheel/sdist and isolated installed-package coverage verify canonical neutral rendering.\n- No provider command executes during installation or tests.\n- `mise run quality`, `mise run runtime-smoke`, issue validation, and `git diff --check` pass; formal Verify supplies independent correctness, security, privacy, maintainability, and compatibility review.\n\n## Migration And Operations\n\n- No compatibility alias is retained because the contract is unreleased.\n- Existing host MCP entries and installed provider tools are user-owned and never removed.\n- Documentation requires manual config migration, host-entry audit/removal, optional provider uninstall, and manual deletion of retained dormant skills.\n\n## Artifacts\n\nExpected changes include Python/TypeScript config contracts, generated JSON Schema, installer/template/MCP ownership boundaries, tests, package resources, implementation/migration documentation, Changeset metadata, and removal of the CodeGraphContext mise declaration/lock entry.\n\n## Rollback\n\nRollback returns to the last verified provider-neutral skill-only state. It must never restore the unsafe CodeGraphContext adapter as a compatibility fallback and must preserve user-owned host MCP subtrees.\n\n## Risks\n\n- Dormant skills remain discoverable and require an explicit warning.\n- Silent legacy acceptance could retain unsafe provider assumptions.\n- Removing recognized definitions must not become implicit host cleanup.\n- A permissive server-name contract could create cross-host ambiguity.\n- The dirty cumulative branch requires scoped diffs and no unrelated reversions.\n\n## Non-Goals\n\n- Selecting, installing, configuring, probing, starting, indexing, watching, deleting, upgrading, or removing any provider.\n- Generating, recognizing, reconciling, or removing code-index MCP host entries.\n- Provider-specific environment, credentials, storage, commands, tool catalogs, or lifecycle instructions inside the generated skill.\n- Implementing the consolidated external-provider guide owned by `hrn-00103`.\n- Closing the parent Initiative or performing Release work."
