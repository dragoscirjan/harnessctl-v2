"body": "# Finalize the provider-neutral sdlc-code-index skill and release evidence\n\n## Objective\n\nComplete the user-facing, provider-neutral generated skill after `hrn-00102` removes the unsafe runtime adapter and establishes the strict skill config contract.\n\n## Scope\n\n- Render only the validated `mcp_server` name into the canonical `sdlc-code-index` template.\n- Remove provider variables and all CodeGraphContext-specific specialization from the template.\n- Keep MCP output advisory: verify claims against source, configuration, tests, and VCS; use Glob, Grep, and reads when MCP evidence is unavailable, stale, incomplete, or unsuitable.\n- Generate byte-equivalent skills for enabled selected OpenCode/Pi hosts.\n- For a fresh disabled install, write no skill.\n- When disabled with an existing managed skill, preserve exact bytes and warn that the discoverable file remains active-capable, naming the manual removal path. Never delete it automatically.\n- Ensure enabled, disabled, `--force`, migration, and rollback paths never mutate code-index host MCP entries.\n- Update package resources, wheel/sdist and isolated installed-package tests, implementation/migration docs, root/docs indexes, and Changeset metadata.\n\n## Acceptance Criteria\n\n- The canonical template is provider-neutral and contains only the validated configured server name plus retrieval/source-verification/fallback guidance.\n- The template grants no provider installation, setup, startup, indexing, watching, mutation, deletion, model, credential, storage, or lifecycle authority.\n- Enabled OpenCode and Pi outputs are byte-equivalent.\n- Disabled fresh installs create no skill; later disablement preserves exact bytes and emits one actionable manual-removal warning per selected host with an existing skill.\n- Invalid and `cvs_`-reserved server names fail in the config layer before rendering.\n- Arbitrary existing code-index MCP host entries remain byte-for-byte unchanged under enabled, disabled, `--force`, and rollback tests.\n- Package resources contain the neutral template; wheel/sdist and isolated installed-package rendering/installation pass.\n- Documentation explains the new config, explicit legacy migration, dormant discoverability, manual host-entry audit/removal, optional provider uninstall, and user-owned external MCP lifecycle.\n- Changeset describes the opt-in skill contract without claiming provider runtime ownership.\n- Focused tests, generated-contract checks, `mise run quality`, `mise run runtime-smoke`, issue validation, and `git diff --check` pass.\n\n## Dependencies And Estimate\n\nDepends on `hrn-00102`. Estimate M. This Task must complete before Epic `hrn-00105` can enter formal Verify and before guide Epic `hrn-00103` proceeds.\n\n## Artifacts\n\nCanonical skill template, installer behavior, selected-host tests, package resource and isolated artifact tests, implementation/migration documentation, root/docs navigation, and Changeset metadata.\n\n## Rollback\n\nRestore only the last verified provider-neutral skill/package state. Never restore the unsafe adapter or mutate user-owned host MCP entries.\n\n## Risks\n\n- Retained disabled skills remain discoverable; warning text and tests must not imply deletion.\n- Provider-specific wording could accidentally recreate lifecycle authority.\n- Cumulative dirty work requires scoped review and no unrelated reversions.\n\n## Non-Goals\n\n- External provider installation/configuration details owned by `hrn-00103`.\n- Provider command execution, probing, indexing, storage, credentials, lifecycle ownership, formal Verify, Release, commit, or remote action."
