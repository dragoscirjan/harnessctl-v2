"body": "## Objective\n\nPrevent canonical Issue and Document identity/path collisions when independent Git worktrees create authority concurrently, while preserving every existing numeric authority record.\n\n## Requirements And Boundaries\n\n- Generate every new filesystem Issue as `<configured-prefix><ULID>` and every new Document as `doc-<ULID>`.\n- Use exactly 26 uppercase Crockford characters for new suffixes; reject lowercase and ambiguous `I`, `L`, `O`, and `U`.\n- Continue reading existing numeric Issue suffixes and Document suffixes of at least five digits without rewriting them.\n- Preserve canonical YAML locations/formats, revisions, locks, comments, relationships, links, versions, archives, and disposable cache architecture.\n- Preserve Issue comment IDs as `<issue-id>-C####`.\n- Exclude workspace primitives/lifecycle (`hrn-00209`, `hrn-00210`), remote-provider IDs, a daemon/shared allocator, cache schema redesign, and automatic legacy-ID migration.\n\n## Approved Design\n\nCanonical LLD: `.harnessctl/documents/doc-00018-collision-safe-canonical-authority-identities-v1.md` (`doc-00018`, approved).\n\n- Extract Memory's existing 48-bit timestamp plus 80-bit cryptographic-randomness Crockford ULID implementation into one shared generic-tools utility with deterministic test seams.\n- Centralize legacy/new identity predicates and escaped-prefix matching across Issue, Document, link, filename, and cache paths.\n- New creation emits ULIDs only. Exclusive publication remains fail-closed; no identity/path collision may overwrite authority.\n- Mixed ordering is legacy IDs first, numeric order within legacy IDs, then lexicographic uppercase ULID order.\n- SQLite IDs remain strings; no cache schema migration is expected.\n- Dual-format readers become permanent compatibility after any ULID authority is committed.\n\n## Executable Decomposition\n\n1. `hrn-00211` Shared ULID and Dual-Format Issue Identities.\n   Implement shared generation and Issue create/read/validate/discover/sort/comment compatibility. No child dependency. Estimate M, moderate uncertainty.\n2. `hrn-00212` Dual-Format Document and Projection Compatibility.\n   Implement Document creation/lifecycle plus Issue document links and local mixed-identity projections. Depends on `hrn-00211`. Estimate M, moderate uncertainty.\n3. `hrn-00213` Adapter, Documentation, and Release Compatibility Gates.\n   Prove OpenCode/Pi parity, update user-facing/generated documentation, add release metadata, and run all gates. Depends on `hrn-00211` and `hrn-00212`. Estimate S-M, moderate uncertainty.\n\nExecute in dependency order. Do not implement workspace primitives until this public identity contract stabilizes.\n\n## Acceptance Criteria\n\n- Concurrent creation from independent worktree snapshots produces distinct canonical Issue and Document paths without a shared numeric allocator or filesystem lock.\n- New Issue and Document creation never emits sequential numeric IDs.\n- Existing numeric Issues, Documents, links, relationships, comments, versions, archives, revisions, and cache projections remain readable and valid.\n- Mixed catalogs discover, validate, sort, link, archive, restore, and project deterministically.\n- Invalid length, lowercase, ambiguous-character, unsafe, prefix-mismatched, and metadata/filename-mismatched forms fail closed.\n- Generated collision paths never overwrite authority.\n- OpenCode and Pi expose identical accepted and emitted identity behavior.\n- No canonical file rewrite or SQLite schema migration is required.\n\n## Verification Plan\n\n- Add deterministic shared-identifier tests for timestamp encoding, entropy, alphabet, length, invalid forms, and collision behavior.\n- Run focused generic-tools Issue, Issue contract, Issue storage, Document, Document contract, and local-persistence suites covering numeric, ULID, and mixed graphs.\n- Cover comments, relationships, document links, versions, archive/restore/recovery, complete-graph validation, canonical filename mismatch, and cache rebuild behavior.\n- Run OpenCode and Pi unit/integration parity suites.\n- Run package typecheck, lint, format, build, generated-contract checks, then configured repository quality checks.\n\n## Migration And Rollback\n\nNo migration job and no automatic rewrite. Before ULID adoption, a normal code revert is safe. After a ULID authority is committed, rollback may stop new ULID generation but must retain dual-format readers; numeric-only rollback would break persisted authority.\n\n## Documentation And Release\n\nDocument exact accepted/emitted forms, strict Crockford alphabet/case, no-migration behavior, mixed ordering, and rollback constraint. Add Changeset or equivalent release metadata for all shipped affected packages under repository policy. Package publication, branch push, and PR creation belong to later lifecycle phases.\n\n## Operations\n\nNo daemon, central service, shared worktree lock, operator data action, or cache schema migration. Validation operates directly on existing numeric and new mixed canonical graphs.\n\n## Risks\n\n- Hidden numeric-only regular expressions or fixture assumptions across generic tools and adapters.\n- Configurable-prefix parsing regressions.\n- Mixed-format ordering drift if parsing/comparison logic is duplicated.\n- Complete-graph and archive recovery paths may expose indirect identity assumptions.\n- ULIDs solve allocation collisions only; revisions and Git reconciliation still govern concurrent semantic edits to the same record.\n\n## Estimate\n\nM-L, approximately 3-5 engineering days, moderate uncertainty due broad parser, compatibility, fixture, adapter, and recovery-path coverage.\n\n## Comments\n"
