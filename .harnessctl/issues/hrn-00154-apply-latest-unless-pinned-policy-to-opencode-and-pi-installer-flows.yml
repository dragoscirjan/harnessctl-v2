"body": "# Apply latest-unless-pinned policy to OpenCode and Pi installer flows\n\n## Summary\n\nReplace hard-coded exact-source conflict checks with managed source policy in installer host config reconciliation.\n\n## Scope\n\n- `_merge_opencode_json` for `.opencode/opencode.json` plugin list.\n- `_inspect_pi_packages`, `_pi_invocation`, and install authorization path for `.pi/settings.json` and `pi install -l`.\n- Preserve rollback, symlink, duplicate, and operator-content safety behavior.\n\n## Acceptance\n\n- Fresh OpenCode install writes latest plugin source.\n- Fresh Pi install requests latest package source.\n- Stale managed default source upgrades to latest unless represented as an explicit lock.\n- Explicit locked source remains exact and blocks unintended replacement.\n- Extension-filtered required Pi packages still fail safely.\n"
