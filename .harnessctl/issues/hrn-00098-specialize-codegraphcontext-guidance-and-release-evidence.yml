"body": "# Specialize CodeGraphContext guidance and release evidence\n\n## Objective\n\nComplete the provider integration with retrieval-only generated guidance, explicit operator prerequisites/privacy boundaries, package evidence, and release metadata.\n\n## Scope\n\n- Specialize `sdlc-code-index` generation for CodeGraphContext's observed structural retrieval capabilities while requiring live schema discovery.\n- Keep provider results advisory; require source/config/test/VCS confirmation and Glob/Grep/read fallback for unavailable, stale, incomplete, or unsuitable evidence.\n- Explicitly forbid indexing, watching, deletion, bundle import/clear, raw mutation queries, setup, model download, and lifecycle inference from skill text.\n- Document repository and downstream mise declaration, operator `mise install`, separate `cgc index`, embedded LadybugDB storage, source-index opt-in, project-env isolation, safety environment, refresh ownership, and version drift.\n- Update wheel/sdist/isolated render/install checks, docs inventories, root guidance, and Changeset metadata.\n\n## Acceptance Criteria\n\n- Enabled OpenCode/Pi hosts receive byte-equivalent generated skill bytes specialized only by validated provider/fixed ID data.\n- Disabled fresh installs receive no new skill or active entry; previously generated skill bytes remain dormant and unchanged.\n- Skill names supported retrieval concepts without inventing tool names, parameters, or response fields; it directs live schema inspection.\n- Skill never authorizes provider lifecycle or destructive/mutating tools.\n- Documentation distinguishes harnessctl projection from operator tool installation, repository indexing, storage/privacy choices, and refresh/removal.\n- Docs state CodeGraphContext `0.6.5` is the tested pin and note upstream documentation drift.\n- Package resources, isolated wheel/sdist rendering/install, focused tests, generated contracts, `mise run quality`, and diff/issue validation pass.\n- Verify owns runtime MCP handshake, current acceptance mapping, security/privacy/compatibility review, and independent review.\n\n## Dependencies and Order\n\nDepends on `hrn-00097`; indirectly blocked by `hrn-00084`. Final Build Task for `hrn-00085`.\n\n## Artifacts\n\nGenerated skill/template tests; configuration/skills/code-intelligence documentation; package artifact tests; Changeset and Build evidence.\n\n## Estimate\n\nS. Medium risk because guidance must constrain a provider exposing both retrieval and lifecycle/mutation tools.\n\n## Non-Goals\n\nNo provider install/index/start during harnessctl installation, no invented provider API catalogue, no release/commit/remote action, and no closure of the Epic during Build.\n"
