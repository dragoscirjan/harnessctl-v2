    "body": "Build evidence: integrated reference gates implemented. Exact public inventory/navigation, Config schema/property/default/description coverage, six-command and eight-skill parity, literal credential screening, provenance distinctions, deterministic Config/LLM generation, and intentional mutation failures are enforced. Fresh checks: `tests/test_docs.py` 38 passed; full Python 713 passed; Node 215+2+3 passed; packages, ESLint, Ruff, contracts, Mermaid (6), actionlint, shellcheck, vulture, duplication threshold, strict MkDocs, focused Prettier, and diff checks passed. Repository-wide `mise run quality` stops only on untouched unrelated dirty `.opencode/opencode.json` and `.pi/settings.json` Prettier findings. No Verify, Release, remote action, closure, or unrelated-file mutation."
