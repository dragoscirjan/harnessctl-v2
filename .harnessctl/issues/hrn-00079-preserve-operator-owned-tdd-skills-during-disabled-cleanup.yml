"body": "## Defect\n\nGiven TDD is disabled and cleanup atomically claims a generated `develop-tdd` skill\nWhen operator content appears at the public skill path before a later installer failure triggers rollback\nThen rollback can overwrite that concurrent operator content with the captured generated before-image.\n\n## Classification\n\nConfirmed product/design defect with unresolved recurrence after atomic-claim and stale-marker repairs. Fresh quality and runtime smoke pass, but Release remains blocked because rollback still violates operator-content preservation.\n\n## Cause\n\nCleanup checks public replacement paths immediately after the atomic claim and removes observed concurrent paths from rollback before-images. A replacement can appear after that one check, including during smoke checks. `_rollback` then restores captured before-images unconditionally and overwrites the later operator write.\n\n## Scope\n\n- Make rollback preserve public TDD skill or marker paths changed or created after their atomic cleanup claim.\n- Retain atomic claim validation, stale-marker retirement, and exact rollback for installer-owned state.\n- Add concurrent failure coverage for selected OpenCode and Pi hosts.\n- Preserve and report operator content changed at every cleanup and rollback boundary.\n- Do not broaden into unrelated installer ownership redesign without new evidence and replanning.\n\n## Acceptance\n\n- [ ] Fresh disabled installation preserves and reports a pre-existing byte-identical operator TDD skill.\n- [ ] Enabled-to-disabled reinstall removes an unchanged harnessctl-generated TDD skill for each selected host.\n- [ ] Modified generated or operator-owned content is preserved and reported, and stale ownership is retired safely.\n- [ ] Content changed after initial classification, after final ownership validation, or after atomic claim is not deleted or overwritten.\n- [ ] A later canonical operator replacement cannot be reclaimed through a stale marker.\n- [ ] Rollback restores exact OpenCode and Pi installer-owned trees after an injected failure while preserving concurrent public replacements.\n- [ ] `mise run quality` and `mise run runtime-smoke` pass.\n\n## Evidence\n\n- `src/harnessctl/install.py:471-486` atomically claims and checks concurrent paths once.\n- `src/harnessctl/install.py:501-509` enters rollback after later failures.\n- `src/harnessctl/install.py:1161-1176` unconditionally restores captured before-images.\n- `tests/test_install.py:458-508` covers pre-claim mutation and non-concurrent rollback, not post-claim concurrent rollback.\n- Independent Verify review provided concrete reproduction: write operator content during `_smoke_check` after claim, raise an injected failure, and observe rollback replace it with old generated bytes.\n- Fresh `mise run quality` passed: Python 260 and Node 181 tests plus all configured static/package/release-artifact gates.\n- Fresh `mise run runtime-smoke` passed all generic-tools, opencode-tools, and pi-tools entrypoints under Node and Bun.\n- No credential, secret, or privacy exposure found."
