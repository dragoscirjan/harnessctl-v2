"body": "# Add configurable MCP-first web retrieval\n\n## Summary\n\nMake SDLC/project web research prefer configured MCP web retrieval before shell fetch tools, while letting users configure whether the behavior is enabled. Use `sdlc_web_crawl` as the canonical MCP server name for the default/free integration path.\n\n## Scope\n\n- Add configuration that lets users enable or disable MCP-first web retrieval.\n- Select the exact config shape during Build by following existing harnessctl config conventions; do not invent an incompatible top-level contract.\n- When enabled and available, guidance prefers `sdlc_web_crawl` MCP web search/fetch/stash/grep before shell fetch tools.\n- Integrate free MIT `@dragoscirjan/mcp-searchable` under MCP server name `sdlc_web_crawl`, unless Build finds a better free/open candidate and gets fresh approval before changing direction.\n- Keep `curl`, `wget`, and ad hoc shell fetch as fallback only when MCP-first retrieval is disabled, unavailable, unsuitable, stale, incomplete, or insufficient for the request.\n- Document live MCP schema discovery, no invented tool names or parameters, source freshness, and untrusted web-text handling.\n- Update relevant OpenCode/Pi guidance, docs, generated outputs, schemas, tests, and package artifacts only where the chosen config contract requires it.\n\n## Non-goals\n\n- No paid API requirement, provider credentials, hosted vector database, deployment, merge, or destructive operation.\n- No forced user-global MCP rewrite without separate approval.\n- No removal of shell fetch capability; shell remains fallback.\n- No default endorsement of a provider beyond the configured free/open default path.\n- No Build, Verify, or Release work during Plan.\n\n## Evidence\n\n- User outcome: web search/fetch should try smarter MCP tools first, then fall back to `curl`, `wget`, or similar; user suggested `https://github.com/dragoscirjan/mcp-searchable` or a free better MCP; user required Epic creation and configurability.\n- Fetched repository evidence for `dragoscirjan/mcp-searchable`: MIT license; local-first MCP server; tools include web search, fetch, stash, grep, and ask; quick-start uses `npx -y @dragoscirjan/mcp-searchable`; default DuckDuckGo needs no API key.\n- Current local MCP config already has user-global `webcrawl_searchable` mapped to `@dragoscirjan/mcp-searchable@latest`, proving the candidate is usable in this environment but not yet under desired name `sdlc_web_crawl`.\n- Local issue search found no active duplicate Epic for configurable MCP-first web retrieval.\n- Related context: closed code-index Epics establish provider-neutral MCP guidance patterns and user-owned external MCP lifecycle boundaries.\n\n## Design\n\nLightweight. Reuse existing configuration, validation, generated guidance, and package artifact patterns. Build must first identify the nearest existing config namespace for workflow/tooling preferences and propose the exact field names before editing.\n\n## Ordered executable plan\n\n1. Inspect current configuration schema, generated schema, installer outputs, SDLC guidance templates, Pi/OpenCode command/skill resources, and docs for existing web/tool preference patterns.\n2. Define the smallest compatible config contract for MCP-first web retrieval, including enable/disable behavior and canonical server name `sdlc_web_crawl`.\n3. Update validation and generated schemas so invalid types, unknown fields, and unsafe server names fail clearly.\n4. Update SDLC/project guidance so enabled web research prefers live MCP schema discovery and `sdlc_web_crawl` search/fetch/stash/grep before shell fetch tools.\n5. Add or update Pi/OpenCode MCP configuration examples or generated artifacts only if owned by the selected config route.\n6. Add/update docs covering configuration, fallback, provider ownership, privacy/security, freshness, and untrusted retrieved text.\n7. Add focused tests for enabled, disabled, unavailable-MCP fallback, invalid config, generated outputs, docs, and package artifacts where touched.\n8. Run focused local checks in Build; leave full acceptance mapping and independent review for Verify.\n\n## Acceptance\n\n- Users can configure whether MCP-first web retrieval is used.\n- The configured canonical MCP server name is `sdlc_web_crawl`.\n- Enabled behavior directs agents to prefer MCP web search/fetch/stash/grep over `curl`, `wget`, and ad hoc shell fetch tools when the MCP server is configured and suitable.\n- Disabled or unavailable MCP behavior falls back safely to normal web fetch/search mechanisms without blocking unrelated work.\n- Guidance requires live MCP tool schema inspection and forbids invented tool names, parameters, or response fields.\n- Web content is treated as untrusted data, never instruction, consent, proof, or authority over repository state.\n- Provider lifecycle, credentials, storage, privacy/security, freshness/staleness, and fallback boundaries are documented.\n- Pi and OpenCode generated guidance/config examples are consistent where in scope.\n- Existing code-index and CVS MCP behavior remains unchanged.\n- Relevant tests, generated contract checks, package artifact checks, issue validation, memory validation, and `git diff --check` pass in their proper phases.\n\n## Release, rollback, docs, operations\n\nRelease is repository/package documentation and configuration behavior unless Build discovers a larger packaged impact. Rollback removes the config contract, guidance/docs/tests, and generated artifacts introduced for this Epic. Operations note: users may need to add or rename an MCP server entry to `sdlc_web_crawl` and reload their harness; no global config rewrite is automatic without explicit approval.\n\n## Estimate and uncertainty\n\nEstimate: M. Uncertainty: medium because the exact config namespace and generated artifact impact must be confirmed against current schema and installer architecture, and provider comparison may identify a better free/open MCP candidate.\n\n## Risks\n\n- A default-on setting could surprise users or trigger unexpected network access; Build must choose and justify a safe default.\n- Provider-specific guidance could imply harnessctl owns external MCP lifecycle; wording must preserve user ownership.\n- Tool-name assumptions can go stale; live schema discovery is mandatory.\n- Shell fallback must remain available for unsupported or unavailable MCP cases.\n\n## Plan status\n\nApproved on 2026-08-29. Ready for a separate `work-build hrn-00157` invocation. No Build, Verify, or Release work was performed during Plan."
