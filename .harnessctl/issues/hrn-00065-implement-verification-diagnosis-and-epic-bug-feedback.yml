"body": "Given an implemented Epic\nWhen `/work verify` finds failures\nThen it diagnoses causes, offers multiple actions, and records confirmed defects as Epic Bugs.\n\n## Deliverables\n\n- Acceptance, quality, security, compatibility, and review workflow.\n- Failure classification and user-selected routing.\n- One discoverable non-archived Bug per distinct defect occurrence.\n- Existing active Bug reuse and supported closed-Bug handling.\n- Regression references without invented relationship types.\n\n## Acceptance\n\n- [x] Bug creation requires user confirmation.\n- [x] Bugs attach to recognized Epic and may reference affected child work.\n- [x] Archived-history capability limits are explicit.\n- [x] Success recommends Release; failures never route silently."
