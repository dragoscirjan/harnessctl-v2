"body": "# Preserve unvalidated legacy skill trees without migration consent\n\n## Objective\n\nAllow normal and `--force` upgrades to install canonical skills while preserving operator-owned legacy support trees without recursively validating content that has not been authorized for deletion.\n\n## Defect\n\nCurrent `src/harnessctl/install.py` couples legacy-root detection to recursive destructive-tree validation. A retained tree containing a symlink or special entry aborts installation even when `--replace-sdlc-skill-set` is absent.\n\n## Scope\n\n- Detect only selected-host roots for the five legacy support IDs without traversing their entries when replacement consent is absent.\n- Warn with bounded root paths and leave every retained entry untouched for both normal and `--force` upgrades.\n- When `--replace-sdlc-skill-set` is present, require each root to be a real directory and recursively reject symlinks or special entries before any mutation.\n- Preserve selected-host boundaries, path-escape defenses, canonical conflict preflight, disclosure, transaction ordering, and rollback.\n- Document rollback as file bytes and existence plus directory topology; metadata beyond that before-image is not guaranteed.\n\n## Acceptance\n\n- No-consent normal and `--force` upgrades do not recursively inspect or mutate legacy support trees, including trees containing symlinks or special entries.\n- Warnings identify only selected-host legacy roots; unselected hosts are not inspected or modified.\n- Explicit migration rejects a symlink root, nested symlink, or special entry before mutation.\n- Explicit migration deletes only disclosed roots for the five legacy support IDs and never treats `sdlc`, `sdlc-code`, or `sdlc-code-index` as legacy.\n- Tests cover ordinary byte-preserving retention, no-consent symlink and special-entry retention, explicit preflight rejection, selected-host boundaries, canonical conflict preflight, and injected rollback of file bytes/existence plus directory topology.\n- Focused tests and lint pass before Verify.\n\n## Order and Estimate\n\nExecute after the canonical map and flag correction in `hrn-00130`. Estimate: 0.5 day; uncertainty is low to medium around safe root detection and special-entry fixtures.\n\n## Non-Goals\n\nNo migration of unshipped `harnessctl-*` names, filesystem metadata preservation beyond the documented before-image, or weakening of explicit destructive-migration validation.\n\n## Route\n\nPlan reconciled in `hrn-00129`. Ready for `work-build hrn-00129`; remain open until Build and Verify provide completion evidence."
