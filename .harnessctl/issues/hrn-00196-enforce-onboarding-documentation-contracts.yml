"body": "# Enforce onboarding documentation contracts\n\n## Objective\n\nProtect onboarding route ownership, evidence-backed claims, installed command semantics, links, and deterministic generated indexes from drift.\n\n## Scope\n\n- Update focused documentation checks in `tests/test_docs.py` for Home, Docs landing, Installation, and Getting Started.\n- Regenerate `docs/llms.txt` and `docs/llms-full.txt` from canonical Markdown.\n- Run focused formatting, documentation tests, and the strict MkDocs build.\n\n## Acceptance Criteria\n\n- Tests prove `docs/docs-overview.md` and `docs/installation.md` are no longer structural stubs owned by future work.\n- Tests assert the required purpose, direct next actions, documentation-type distinctions, installation support boundaries, and first-success tutorial contract.\n- Installed `/work-plan` behavior and supported harness claims remain traceable to command and harness authority; conceptual grouped dispatch is not presented as installed behavior.\n- Local Markdown links resolve and public content contains neither prohibited implementation-runtime detail nor literal credentials.\n- `docs/llms.txt` and `docs/llms-full.txt` regenerate deterministically from the updated canonical pages.\n- `uv run pytest tests/test_docs.py` and `mise run docs-build` pass; focused Markdown formatting and Ruff checks pass when their owned files apply.\n- Formal Verify later checks rendered desktop/mobile discoverability and page flow without judging the temporary visual theme.\n\n## Dependencies And Order\n\nDepends on `hrn-00193`, `hrn-00194`, and `hrn-00195`. Run after all content Stories are complete.\n\n## Linked Artifacts\n\nApproved `doc-00017` v2 owns the route, structural-stub, LLM-index, and quality contracts; no new design artifact is required.\n\n## Estimate And Uncertainty\n\nEstimate `S`. Low uncertainty; existing `tests/test_docs.py`, generator, and strict build provide established extension points.\n\n## Non-Goals\n\n- Broad repository quality repair or unrelated test refactoring.\n- Visual theme selection or visual regression testing.\n- Product, installer, navigation, or generated-index implementation changes.\n- Build-phase execution, formal Verify, Release, publishing, or deployment during planning."
