"body": "# Reconcile stale open Epics after main merge\n\n## Outcome\n\nOpen Epics that are already delivered on main are closed with evidence. Any Epic not delivered stays open with the correct next phase.\n\n## Planning\n\n- Mode: standalone Epic; no parent.\n- Classification: issue-authority reconciliation after reported main-branch merges.\n- Design depth: none. This is issue/status reconciliation using existing issue tools and Git/PR evidence, not architecture or source change.\n- Estimate: S-M.\n\n## Scope\n\n- Review all active open/in_progress Epics present during Plan: `hrn-00115`, `hrn-00121`, `hrn-00129`, `hrn-00132`, `hrn-00135`, and `hrn-00150`.\n- For each Epic, compare issue comments, current main branch/source evidence, PR/merge evidence when available, child issue state, validation state, and lifecycle release/closure requirements.\n- Close only Epics and children with authoritative done/merged evidence and no remaining lifecycle blocker.\n- Add concise closure comments or status transitions through configured issue tools.\n- Leave unsupported or uncertain Epics open with a comment naming missing evidence and the recommended next phase.\n\n## Non-Goals\n\n- No Build implementation, source edits, verification reruns, release packaging, PR merge, tag, publication, deployment, or remote mutation unless separately authorized in the proper phase.\n- No bulk closure based only on user assertion.\n- No direct edits under `.harnessctl/issues`.\n\n## Evidence\n\n- Active issue discovery found open/in_progress Epics: `hrn-00115`, `hrn-00121`, `hrn-00129`, `hrn-00132`, `hrn-00135`, `hrn-00150`.\n- Issue comments show several Epics have Verify/Release evidence, but not all show canonical closure evidence; `hrn-00121` has no progress comments in the discovered authority.\n- User reported other Epics are done and merged into main; this requires authoritative confirmation before closure.\n\n## Ordered Work\n\n1. Build phase: gather current Git/main, PR, issue-child, and validator evidence for all active Epics listed above.\n2. Build phase: produce a closure matrix: close-ready, not-close-ready, duplicate/superseded, or blocked.\n3. Build phase: request exact consent for each closure, child closure, status change, and comment.\n4. Release phase: perform approved issue transitions/comments only through configured issue tools; stop on ambiguity, revision conflict, failed validation, or missing evidence.\n\n## Acceptance Criteria\n\n1. Every active Epic from the Plan discovery set is classified as close-ready, not-close-ready, duplicate/superseded, or blocked.\n2. Every closure decision cites issue IDs plus commit/PR/merge evidence or current-source evidence.\n3. No Epic or child with missing merge, release, verification, or acceptance evidence is closed.\n4. All issue mutations use configured issue tools with fresh revisions.\n5. Ambiguous or unsupported cases remain open with a concise comment naming missing evidence and next phase.\n6. Final issue validation passes after approved mutations.\n\n## Dependencies\n\n- Local Git/main and any configured PR/source authority must be readable during Build/Release.\n- Issue tools must support comments, transitions, child reads, and validation.\n- Fresh exact consent is required before every closure or status mutation.\n\n## Release, Rollback, Documentation, Operations\n\nRelease phase is issue-authority reconciliation only. Rollback for an incorrect closure is a new explicit issue transition/comment with evidence; immutable comments remain history. No documentation, deployment, tag, package publication, or service operation is expected.\n\n## Risks And Mitigations\n\n- Stale local main or missing remote/PR access can make merge evidence unavailable; leave those Epics open and report blocker.\n- Child issues may remain open after parent delivery; classify and require explicit child-level consent.\n- User-reported completion may disagree with authority; authority wins until evidence confirms closure.\n\n## Blockers\n\nNone for Build planning. Closure itself is blocked until Build/Release evidence and fresh mutation consent exist.\n"
