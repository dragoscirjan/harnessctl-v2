"body": "# Validate complete local graph before Documents publication\n\n## Summary\n\nDocuments mutations can publish canonical files before a schema-valid but graph-invalid Issues authority causes SQLite synchronization and rebuild to fail. The caller receives a failure even though the canonical mutation remains committed, permitting ghost records and non-atomic retries.\n\n## Scope\n\n- Validate the complete canonical Issues graph before every Documents mutation can publish.\n- Cover create, same-path update, version, restore, and any equivalent path that does not already perform a complete cross-domain preflight.\n- Preserve canonical Documents bytes and SQLite generations/rows when the Issues graph has a missing parent, missing relationship target, invalid hierarchy, cycle, or invalid document link.\n- Preserve the documented post-publication cache-repair behavior for failures that genuinely begin after a completely validated canonical graph is published.\n\n## Acceptance Criteria\n\n- [ ] Every Documents mutation rejects a schema-valid but graph-invalid Issues authority before canonical publication.\n- [ ] Rejection leaves canonical Documents bytes, SQLite generations, and projected rows unchanged.\n- [ ] Parameterized regressions cover create, same-path update, version, restore, and representative missing-parent and missing-relationship-target graphs.\n- [ ] Existing valid issue-reference preflights and post-publication disposable-cache repair behavior remain intact.\n- [ ] Focused and full configured quality/build gates pass.\n\n## Evidence\n\nVerify round 1 found `extensions/generic-tools/documents.ts:132-140` skips cache validation for mutations, publishes in `createUnlocked`, `updateUnlocked`, `versionUnlocked`, or `moveLineage`, then synchronizes. `extensions/generic-tools/local-persistence.ts:392-437` decodes Issues but does not validate graph relationships; SQLite foreign keys can therefore fail after publication. `extensions/generic-tools/issues.ts:329-345` exposes the missing complete-graph validator. A reproduced create failure left the new canonical Markdown present while SQLite had no corresponding row. This blocks Epic `hrn-00135` acceptance criteria 2, 3, and 4."
