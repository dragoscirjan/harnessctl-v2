"body": "Given an approved Epic plan\nWhen `/work build` runs\nThen it resumes or selects ready implementation work\nAnd offers explicit bounded YOLO execution.\n\n## Deliverables\n\n- Epic-level ready-item discovery for Stories, Tasks, and corrective Bugs.\n- User-selected item flow.\n- YOLO consent bounded by blocker, scope change, verification boundary, or stop.\n- Slice-level tests and compact checkpoints.\n\n## Acceptance\n\n- [x] Existing implementation resumes without restarting planning.\n- [x] YOLO excludes remote/destructive actions.\n- [x] New verified corrective Bugs can become ready work after confirmation.\n- [x] Issues close only with evidence and confirmation."
