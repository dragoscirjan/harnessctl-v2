"body": "Given verified or interrupted Epic work\nWhen Release or Continue runs\nThen Release enforces delivery gates and Continue resumes exactly one validated phase.\n\n## Deliverables\n\n- Mandatory branch, commit, push, and PR checks.\n- Fresh consent for remote/destructive actions and every merge.\n- Deployment only by explicit request with verified workflow.\n- Continue candidate search bounded to five unfinished checkpoints.\n- Artifact-backed checkpoint validation and ambiguity handling.\n\n## Acceptance\n\n- [x] Continue never combines or silently advances phases.\n- [x] Existing valid delivery actions count as satisfied.\n- [x] Human merge remains default.\n- [x] Eligible issue closure requires evidence and confirmation."
