"body": "# Complete Docs overview content-type distinctions\n\n## Summary\n\nFormal Verify found that `docs/docs-overview.md` routes readers to the correct pages but does not explicitly distinguish tutorials, explanatory guides, catalogs, exact references, and troubleshooting/help content as required by `hrn-00193`.\n\n## Evidence\n\n- `docs/docs-overview.md` names routes and owning pages but lacks the required content-type taxonomy.\n- `tests/test_docs.py::test_onboarding_docs_lead_to_a_supported_plan_only_first_success` passes without asserting the taxonomy.\n- Fresh Verify checks passed, so this is a requirement/docs finding and evidence gap rather than a test or tool failure.\n\n## Impact\n\n`hrn-00193`, `hrn-00196`, and Epic `hrn-00175` do not meet mapped acceptance. Release remains blocked.\n\n## Acceptance Criteria\n\n- `docs/docs-overview.md` clearly distinguishes tutorials, explanatory guides, catalogs, exact references, and troubleshooting/help content.\n- Each content type links to its canonical owning page without duplicating domain detail.\n- Focused onboarding contracts fail if any required distinction is removed.\n- `uv run pytest tests/test_docs.py`, focused formatting/lint checks, and `mise run docs-build` pass.\n\n## Boundaries\n\nDo not change navigation, theme, product behavior, installer behavior, or unrelated documentation."
