"body": "# Publish user-oriented Home and Docs landing\n\n## Objective\n\nExplain what harnessctl is, why it exists, who it serves, and how readers should choose among the public documentation areas.\n\n## Scope\n\n- Replace the current Home content in `docs/README.md` with a concise user-oriented introduction and direct Installation and Getting Started actions.\n- Replace the structural stub in `docs/docs-overview.md` with a landing page that distinguishes tutorials, guides, catalogs, exact references, and help content.\n- End both pages with clear next actions using the approved `doc-00017` v2 route inventory.\n\n## Acceptance Criteria\n\n- Home answers what harnessctl is, what it does, why it exists, and who it is for without requiring prior SDLC knowledge.\n- Home routes directly to Installation and Getting Started before broader documentation.\n- The Docs landing distinguishes tutorials, explanatory guides, catalogs, exact references, and troubleshooting/help content.\n- Links route readers to the owning canonical pages without reproducing their domain detail.\n- Both pages end with an explicit next step and remain useful in repository Markdown and rendered MkDocs.\n\n## Dependencies And Order\n\nNo child dependency. The Epic dependency `hrn-00167` is already closed. This Story may proceed in parallel with the installation Story.\n\n## Linked Artifacts\n\nApproved `doc-00017` v2 defines routes, ownership, shell, and navigation behavior; no new design artifact is required.\n\n## Estimate And Uncertainty\n\nEstimate `S`. Low uncertainty; current Home is substantive while the Docs landing is a structural stub.\n\n## Non-Goals\n\n- Changing navigation, theme, installer behavior, product behavior, or support status.\n- Duplicating SDLC, harness, catalog, reference, troubleshooting, FAQ, or changelog content.\n- Publishing or deploying generated site output."
