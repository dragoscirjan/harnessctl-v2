"body": "# Persist monotonic released session-binding generations\n\n## Summary\n\nVerify found that releasing a host session deletes its binding without publishing the required released lifecycle state or incremented generation.\n\n## Evidence\n\n`extensions/generic-tools/execution-context.ts:398-413` validates the current generation and calls `removeBinding`. Approved LLD `doc-01M1PZMXJ99DRRW65A1E22G7TH` requires `unbound -> bound -> rebound | released` and a generation increment for every transition.\n\n## Impact\n\nA stale caller cannot distinguish a never-bound session from a released generation, weakening optimistic concurrency and recovery guarantees.\n\n## Acceptance Criteria\n\n- Release publishes a durable released state with binding generation incremented exactly once.\n- Stale release, bind, resolve, and recovery requests fail deterministically against the released generation.\n- Rebinding after release preserves monotonic generation history.\n- Focused crash/restart and concurrent-generation tests pass.\n"
