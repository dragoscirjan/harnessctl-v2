"body": "# Evaluate and integrate FastCode conditionally\n\n## Objective\n\nDetermine whether FastCode can be safely projected as a separate experimental model-backed logical server without making it a structural `sdlc-code-index` provider.\n\n## Isolated Scope\n\n- Require a valid commercial-friendly repository license artifact before executable implementation planning proceeds.\n- If unblocked, select a distinct stable `sdlc-*` server ID and define strict typed defaults for safe model endpoint, source environment-variable names, local/remote privacy mode, and bounded paths.\n- Keep executable command, arguments, fixed ID, target environment names, and credential values code-owned.\n- Generate OpenCode and Pi entries without cloning, installing, probing, invoking, indexing, or operating FastCode.\n- Add model-backed repository Q&A guidance with explicit source-verification and data-egress boundaries.\n\n## Acceptance Direction\n\n- The Epic remains externally blocked while a valid compatible license artifact is absent.\n- FastCode is not present in `mcp.servers.sdlc-code-index.providers` and never becomes the default structural provider implicitly.\n- If unblocked, its separate logical server has complete typed defaults across Python, TypeScript, Zod, and generated schema.\n- Credential values are never stored; only validated source environment-variable names may be configured.\n- Local-model and remote-model privacy differences are documented.\n- Tests use inert fixtures and never call a model or third-party process.\n\n## Dependencies and Order\n\nDepends on `hrn-00084`; later experimental Epic. External blocker: valid commercial-friendly license artifact.\n\n## Non-Goals\n\n- Do not clone or install FastCode, create environments, download models, index repositories, or send source to a model.\n- Do not treat README license text as a valid license artifact.\n- Do not overload fixed ID `sdlc-code-index`.\n"
