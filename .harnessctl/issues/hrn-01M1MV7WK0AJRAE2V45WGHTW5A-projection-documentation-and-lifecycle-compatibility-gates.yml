"body": "## Objective\n\nKeep canonical and generated SDLC resources, user documentation, and compatibility tests aligned with workspace-aware lifecycle behavior.\n\n## Scope\n\n- Update canonical OpenCode/Pi SDLC templates and regenerate or verify their projections.\n- Document workspace-enabled Plan, Build, Verify, Release, Continue, checkpoint, and later cleanup behavior in `docs/sdlc.md` and `FLOWS.md`.\n- Add policy and integration coverage for both `skills.cvs.workspaces: true` and disabled configurations.\n- Verify Initiative Plan exclusion, committed-authority handoff, exact-workspace enforcement, checkpoint drift handling, Release cleanup-ready handoff, and retained disabled behavior.\n- Run focused template, installer, documentation, release-artifact, generated-output, and repository quality/build checks during Build/Verify.\n\n## Dependencies And Order\n\nSequence: 5. Starts after `hrn-01M1MV650AKH2ZH6Z5HQSGGMV5`, `hrn-01M1MV6FT4V982H88KYWGG6HSW`, `hrn-01M1MV6GC3D07ZRGZR6J1VTJEV`, and `hrn-01M1MV73WV3K0NB0XM8XQMAD94` define the final lifecycle policies.\n\n## Artifacts\n\n- Canonical templates under `src/harnessctl/templates/skills/sdlc/references/`.\n- Generated projections under `.opencode/skills/sdlc/` and `.pi/skills/sdlc/`.\n- `docs/sdlc.md` and `FLOWS.md`.\n- Template, installer, documentation, generated-output, and release-artifact tests.\n\n## Acceptance Criteria\n\n- Canonical and generated resources express identical workspace behavior for every affected lifecycle command.\n- Enabled-policy tests cover exact workspace routing, isolation, drift rejection, and cleanup-ready handoff.\n- Disabled-policy tests prove existing lifecycle behavior remains unchanged.\n- Documentation states that Release neither merges nor deletes the active working directory and that cleanup is a later explicit primary-checkout action.\n- Focused and repository-standard checks pass without modifying workspace primitives.\n\n## Estimate\n\nS-M, medium uncertainty because token/byte budgets and generated projections may require concise policy wording.\n\n## Non-Goals\n\n- No workspace primitive changes.\n- No automatic commit, cwd switch, merge, deploy, cleanup, or branch deletion.\n- No migration or alternate provider support."
