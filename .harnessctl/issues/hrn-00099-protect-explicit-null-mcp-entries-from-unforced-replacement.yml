"body": "# Protect explicit null MCP entries from unforced replacement\n\n## Summary\n\nThe fixed-ID MCP reconciler treats an existing JSON `null` value as if the key were absent and overwrites it without `--force`. Any present divergent value is operator-owned conflict state and must be protected.\n\n## Evidence\n\n- `src/harnessctl/install.py:707-713` reads with `container.get(server_id)` and only rejects when the result is not `None`.\n- Independent Verify review for `hrn-00084` found no regression coverage for present `null` values.\n\n## Acceptance Criteria\n\n- Reconciliation distinguishes an absent key from a present key whose value is `null`.\n- Any present value unequal to the expected owned definition requires `--force` before replacement.\n- OpenCode and Pi tests cover unforced rejection and forced replacement for explicit `null`.\n- Existing exact-match, recognized-removal, modified-preservation, unrelated-JSON, and rollback behavior remains green.\n\n## Non-Goals\n\n- No new MCP identity, provider command, or third-party lifecycle behavior.\n"
