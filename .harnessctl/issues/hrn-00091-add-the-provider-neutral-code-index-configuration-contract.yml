"body": "# Add the provider-neutral code-index configuration contract\n\n## Objective\n\nAdd the shared config-v2 selection contract without projecting a provider command.\n\n## Scope\n\n- Add `code_index.enabled` default `true` and `code_index.provider` default `codegraphcontext` to Python and TypeScript defaults.\n- Validate `enabled` as boolean and structural provider as `codegraphcontext`, `gitnexus`, or `graphify`.\n- Update canonical Zod and generated JSON Schema contracts.\n- Preserve recursive partial-v2 migration and compatible unknown top-level fields.\n- Add focused Python and TypeScript config/schema tests and generated-contract drift coverage.\n\n## Acceptance Criteria\n\n- Missing and partial config normalize to enabled CodeGraphContext selection.\n- Explicit enabled/disabled values and all planned structural providers validate consistently in Python, TypeScript, and JSON Schema.\n- Invalid booleans/providers fail with field-specific errors.\n- Existing config-v2 overlays and unknown compatible top-level fields remain intact.\n- Configuration exposes no command, arguments, server ID, target environment name, credential value, or third-party lifecycle setting.\n\n## Dependencies and Order\n\nFirst Task; no dependency. Estimate S.\n\n## Non-Goals\n\n- No MCP intent, host JSON, skill installation, or provider command mapping.\n- Repomix, CocoIndex Code, and FastCode are not structural provider values in this contract.\n"
