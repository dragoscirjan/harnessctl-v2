"body": "# Activate Pi routed factories after same-session binding\n\n## Summary\n\nVerify found that an enabled Pi session starting unbound does not install rooted built-in factories after it binds later in the same host session.\n\n## Evidence\n\n`extensions/pi-tools/index.ts:619-649` registers routed factories only during a successfully bound `session_start`; the missing-binding branch records `unbound` and returns. Binding tools do not install factories or append successful recovery evidence. Argument mutation in `tool_call` is not the approved trust boundary.\n\n## Impact\n\nSame-session Plan/bootstrap continuation can execute through primary-root factory instances or lack the required recovery record after binding.\n\n## Acceptance Criteria\n\n- Routed built-in factories are active before any bound-session built-in execution, including binding after an unbound start.\n- Every successful bind/rebind/adopt/attach transition appends current `{repository_id, workspace_id, epic_id, generation}` recovery evidence.\n- Routine bash and unsupported tools remain fail-closed.\n- Tests cover unbound start, same-session bind, immediate built-in use, rebind, restart, and lifecycle events.\n"
