    "body": "Build fix implemented: Pi rooted built-in factories register at extension initialization; same-session unbound-to-bound transitions route immediately and append exact recovery evidence without another session_start. Routine bash remains blocked. Pi 8/8 and full suites pass. Issue remains open pending Verify."
