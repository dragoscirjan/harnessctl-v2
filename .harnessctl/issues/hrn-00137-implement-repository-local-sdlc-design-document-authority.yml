"body": "# Implement repository-local SDLC design document authority\n\n## Goal\n\nProvide the fixed, safe repository-backed lifecycle used by SDLC Plan for design records.\n\n## Scope\n\n- Fix authority at `.harnessctl/documents` with `doc-` IDs and exactly `hld`, `lld`, `design-overview`, and `gdd` kinds.\n- Retain the nine normalized lifecycle operations and equivalent generic/OpenCode/Pi schemas and results.\n- Retain strict canonical Markdown, exact-byte revisions, immutable prior versions, deterministic lists, locking, no-follow reads, atomic batch publication, recovery, archive/restore, and issue-reference checks.\n- Keep SQLite disposable, synchronize it only from validated canonical files, and retry repair after projection failure.\n- Reject remote/provider config, custom roots/prefixes, removed kinds, unsafe files, malformed graphs, ambiguous identities, partial lineages, and unsupported locations before mutation.\n- Validate the complete proposed graph before every publication.\n\n## Acceptance Criteria\n\n- [ ] Concurrent creation cannot duplicate IDs or overwrite records.\n- [ ] Only the fixed root, prefix, nine operations, three statuses, and four kinds are accepted everywhere.\n- [ ] Unsafe, malformed, oversized, unsupported, ambiguous, symlinked, or H1-invalid records fail without partial publication.\n- [ ] Update/version/archive/restore enforce exact current revisions, immutable history, complete lineages, references, and destination safety.\n- [ ] Every proposed mutation satisfies file count, aggregate bytes, lineage count, canonical encoding, collision, issue-link, and result bounds before publication.\n- [ ] Cache corruption/missing rows rebuild from canonical Markdown and never determine canonical results.\n- [ ] Generic-tools, OpenCode, Pi, concurrency, interruption, rollback, cache, security, and cross-platform tests pass."
