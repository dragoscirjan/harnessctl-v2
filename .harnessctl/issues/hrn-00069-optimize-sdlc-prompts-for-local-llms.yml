"body": "As a local-LLM user\nI want compact progressively disclosed SDLC commands\nSo that workflow guidance preserves safety while consuming far less context.\n\n## Requirements\n\n- Keep five public command names and Epic-first behavior.\n- Install one compact `sdlc` skill with lazy phase/conditional references for OpenCode and Pi.\n- Keep command shells under approved hard word/byte budgets.\n- Preserve authority, confirmation, memory, YOLO, Bug, release, and Continue behavior.\n- Package and verify every nested skill resource.\n\n## Acceptance\n\n- [x] Every command body is at least 80% smaller by bytes than current memory-enabled baseline.\n- [x] Typical command + core + normal phase stays under 1,050 words and 7,500 bytes.\n- [x] Conditional policy loads only when its condition applies.\n- [x] OpenCode and Pi install byte-equivalent SDLC skill trees.\n- [x] Full quality, artifact, package, and runtime checks pass.\n\n## Design\n\n- `.specs/lld-00010-compact-progressively-disclosed-sdlc-prompts-v1.md`"
