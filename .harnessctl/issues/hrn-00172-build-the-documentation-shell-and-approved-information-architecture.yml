"body": "# Build the documentation shell and approved information architecture\n\n## Objective\n\nReplace the legacy site hierarchy with the approved information architecture and a coherent responsive visual shell while keeping repository Markdown canonical.\n\n## Scope\n\n- Keep MkDocs Material, root `mkdocs.yml`, `docs/` source authority, strict builds, search, code copy, light and dark modes, Mermaid integration, the native evidence-link hook, local tasks, and generated `site/` exclusion.\n- Implement the stable routes and navigation from approved `doc-00017` v2.\n- Remove legacy `Use harnessctl`, `Project authority`, and `MCP and integrations` navigation groups.\n- Provide desktop and mobile navigation, stable headings and deep links, previous and next navigation, responsive tables and code, keyboard-reachable controls, visible focus, sufficient contrast, and accessible Mermaid descriptions and text equivalents.\n- Add restrained maintainable typography, spacing, navigation emphasis, content width, code, table, and status styling through supported Material extension surfaces.\n- Create structural stubs only where later Epics own domain content; each stub identifies its owner and planned status without product claims.\n- Preserve source Markdown usability and safe rendered links to authoritative evidence outside `docs/`.\n\n## Acceptance Criteria\n\n- Navigation exactly represents the approved top-level hierarchy and route inventory.\n- Desktop and mobile expose the same information architecture.\n- All routes build strictly and have explicit downstream ownership.\n- Structural stubs contain no tutorials, catalogs, reference contracts, feature claims, or inferred support state.\n- Search, code copy, deep links, previous and next navigation, tables, code, Mermaid, light and dark presentation, keyboard reachability, focus, and contrast have explicit deterministic or later Verify criteria.\n- The visual shell is intentional and coherent without a deep theme fork or application JavaScript.\n- Repository-local source links remain useful and rendered out-of-tree evidence links preserve paths and anchors without publishing `.harnessctl` artifacts.\n\n## Dependencies And Order\n\nOrder 1. Begins after approved `doc-00017` v2 is linked to `hrn-00167`. May proceed in parallel with `hrn-00173`.\n\n## Design Input\n\nApproved `.harnessctl/documents/doc-00017-documentation-website-foundation-and-information-architecture-v2.md` governs this Story.\n\n## Estimate\n\nM. Main uncertainty is achieving a distinctive responsive shell through maintainable Material extension points without a brittle theme fork.\n\n## Existing Evidence\n\nThe existing site, tasks, strict build, search, code copy, palettes, Mermaid initializer, and link hook are reusable. Existing navigation and domain pages predate the approved ownership model and are not completion evidence for this revised Story.\n\n## Non-Goals\n\n- Writing domain-owned public content beyond structural stubs.\n- Public hosting or deployment.\n- Committing generated site output.\n- Changing harnessctl runtime behavior.\n- Copying Taskfile branding, wording, code, or taxonomy."
