"body": "# Establish the documentation website foundation and information architecture\n\n## Objective\n\nDeliver the shared MkDocs shell, approved information architecture, visual and navigation conventions, status and evidence presentation, deterministic LLM indexes, and foundation quality gates required by every documentation content Epic.\n\n## Plan Authority\n\nApproved `doc-00017` v2 at `.harnessctl/documents/doc-00017-documentation-website-foundation-and-information-architecture-v2.md` governs this Epic. It defines the exact route inventory, content ownership, visual shell, LLM-index contract, quality boundary, and non-goals.\n\nThe existing v1 design and prior implementation remain historical evidence. They do not override v2 where navigation or ownership differs.\n\n## Scope\n\n- Keep MkDocs Material and canonical editable Markdown under `docs/`.\n- Replace the legacy navigation with the approved Home, SDLC, Harnesses, Tools, and Docs hierarchy.\n- Provide a restrained, maintainable technical visual shell for desktop and mobile.\n- Protect search, stable headings and deep links, previous and next navigation, code copy, responsive tables, keyboard reachability, visible focus, contrast, and accessible Mermaid rendering.\n- Define reusable page, status, and evidence presentation without assigning domain claims.\n- Generate `llms.txt` and `llms-full.txt` deterministically from canonical public pages.\n- Preserve strict local builds, repository-readable source links, rendered evidence links, and generated-site exclusion.\n- Use clearly marked structural stubs only where later content Epics own the route.\n\n## Ordered Stories\n\n1. `hrn-00172`: build the documentation shell and approved information architecture. Estimate M.\n2. `hrn-00173`: define shared page, status, and evidence presentation conventions. Estimate S; may proceed in parallel with `hrn-00172`.\n3. `hrn-00179`: generate canonical LLM documentation indexes. Estimate S; depends on `hrn-00172`.\n4. `hrn-00174`: enforce documentation foundation quality gates. Estimate M; depends on `hrn-00172`, `hrn-00173`, and `hrn-00179`.\n\n## Acceptance Criteria\n\n- Primary navigation represents the approved Initiative hierarchy and contains no legacy `Use harnessctl`, `Project authority`, or `MCP and integrations` groups.\n- Desktop and mobile expose the same coherent route hierarchy.\n- The shared shell looks intentional rather than default or generic while remaining accessible and maintainable without a deep theme fork.\n- Every route has explicit downstream ownership; structural stubs contain no unsupported product claims.\n- Search, deep links, previous and next navigation, code copy, tables, diagrams, status and evidence semantics, and evidence links are protected.\n- `llms.txt` and `llms-full.txt` are local, deterministic generated outputs from canonical public content and cannot drift through manual edits.\n- Focused foundation checks pass. Formal browser and accessibility verification remains a separate Verify phase.\n- Home and onboarding, SDLC guidance, harness status, Tools catalogs, configuration and command references, skill configuration, troubleshooting, FAQ, and changelog content remain owned by their later Epics.\n\n## Existing Evidence And Risks\n\nPrior implementation established MkDocs Material 9.7.7, strict builds, search, code copy, light and dark palettes, Mermaid integration, a native evidence-link hook, status vocabulary, and focused tests. Navigation, page inventory tests, ownership, visual shell, and generated LLM indexes require revision.\n\nBrowser tooling was unavailable during earlier implementation, so desktop and mobile browser evidence is a Verify-phase prerequisite. Repository-wide formatting may remain blocked by unrelated existing changes in `.opencode/opencode.json` and `.pi/settings.json`; this Epic must not modify or revert them and must report exact focused results separately.\n\n## Release, Rollback, And Operations\n\nLater Release uses one pull request from the existing Epic branch. Rollback reverts the shell, configuration, generator, and foundation-test changes together while preserving canonical Markdown history. This Epic adds no hosting, deployment, runtime service, external provider operation, or operational state.\n\n## Non-Goals\n\n- Writing or approving domain-owned public content.\n- Changing harnessctl product behavior, configuration, commands, skills, modules, providers, or support claims.\n- Hosting or deploying the website.\n- Requiring network access for routine documentation checks.\n- Copying Taskfile branding, wording, source code, or product taxonomy.\n- Creating a custom documentation application or deep MkDocs theme fork."
