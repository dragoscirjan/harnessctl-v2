"body": "## Defect\n\nPublished `@harnessctl/generic-tools` configuration defaults and schema changed for opt-in `workflow.tdd.enabled`, but the feature branch has no Changeset.\n\n## Classification\n\nConfirmed release-readiness metadata omission discovered during Verify. Runtime behavior, quality, and package smoke gates pass, but repository release policy blocks delivery without release intent.\n\n## Evidence\n\n- `.changeset/README.md` requires a Changeset for every pull request changing a published package.\n- `extensions/generic-tools/config.ts` and `extensions/generic-tools/schemas.ts` change published package behavior.\n- No `.changeset/*.md` file exists.\n- `npx changeset status --since=main` exits 1: `Some packages have been changed but no changesets were found.`\n- Fresh `mise run quality` and `mise run runtime-smoke` pass.\n\n## Scope\n\n- Add one patch Changeset for `@harnessctl/generic-tools` describing the opt-in configurable TDD workflow contract.\n- Do not manually change package versions, lockfile versions, adapter packages, or unrelated release metadata.\n\n## Acceptance\n\n- [ ] A Changeset selects only `@harnessctl/generic-tools` with the smallest correct patch bump.\n- [ ] The Changeset describes `workflow.tdd.enabled` as opt-in/default-disabled.\n- [ ] `npx changeset status --since=main` passes and reports the intended package and bump.\n- [ ] `mise run quality` remains green.\n\n## Impact\n\nRelease is blocked. No production correctness, security, privacy, or compatibility failure is known."
