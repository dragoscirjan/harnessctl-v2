"body": "## Objective\n\nProve identical shipped behavior across OpenCode and Pi, document the permanent mixed-identity contract, and satisfy package/repository release gates.\n\n## Scope\n\n- Update OpenCode and Pi unit and integration expectations for ULID creation and numeric compatibility.\n- Retain numeric fixtures where they prove backward compatibility; use ULID-pattern assertions for new creation.\n- Add adapter parity coverage for mixed Issue and Document lifecycle operations.\n- Update public identity documentation and any generated projections whose source templates or contracts change.\n- Add required Changeset/release metadata for affected packages under existing repository policy.\n- Run focused package checks followed by configured repository quality, build, and generated-artifact checks.\n\n## Acceptance Criteria\n\n- OpenCode and Pi expose identical new-ULID and legacy-read behavior.\n- Integration coverage proves numeric authority remains usable and new creation never emits numeric IDs.\n- Documentation states exact accepted legacy/new forms, strict Crockford casing/alphabet, no automatic migration, and rollback compatibility.\n- Generated source/projection checks pass with no hand-edited generated-only authority.\n- Required package release metadata identifies all shipped packages affected by behavior changes.\n- Focused suites, adapter integrations, typecheck, lint, format, build, generated-contract checks, and configured repository quality checks pass.\n\n## Dependencies And Order\n\nThird Story in `hrn-00208`. Depends on `hrn-00211` and `hrn-00212`; begins after implementation contracts stabilize.\n\n## Artifacts\n\n- Updated OpenCode/Pi tests and integrations.\n- Updated public/generated documentation where applicable.\n- Changeset or equivalent repository release metadata.\n- Verification evidence for Build and Verify phases.\n- Design authority: `doc-00018` after approval and linking.\n\n## Estimate\n\nS-M, moderate uncertainty. Main uncertainty is generated artifact and release-fixture breadth.\n\n## Non-Goals\n\n- Implementing identity generation or core parsers owned by preceding Stories.\n- Git workspace tools or lifecycle routing.\n- Automatic data migration.\n- Publishing packages, pushing branches, or creating a PR during Plan.\n\n## Comments\n"
