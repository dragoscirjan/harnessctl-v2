"body": "## Objective\n\nProvide a shared collision-safe ULID implementation and make canonical Issue identity handling accept existing numeric IDs while emitting ULIDs for every new Issue.\n\n## Scope\n\n- Extract Memory's Crockford ULID generator into a reusable generic-tools identifier module with deterministic test seams and cryptographic production entropy.\n- Change Issue creation to emit `<configured-prefix><ULID>` only.\n- Support legacy numeric and new ULID forms in Issue contracts, canonical filename generation, storage discovery, parser assertions, and local comparisons.\n- Preserve configurable Issue-prefix validation.\n- Preserve comment IDs as `<issue-id>-C####` for both base-ID forms.\n- Define mixed ordering as legacy numeric first, numeric order within legacy IDs, then lexicographic ULID order.\n- Add focused identifier, Issue contract, Issue storage, creation, discovery, ordering, malformed-input, and collision tests.\n\n## Acceptance Criteria\n\n- Given two independent worktree snapshots, when each creates an Issue, generated IDs and canonical paths do not depend on a shared numeric sequence and are distinct under deterministic non-colliding entropy.\n- Every new Issue ID has the configured prefix plus exactly 26 uppercase Crockford characters.\n- Existing prefix-plus-decimal Issue files remain discoverable, readable, writable, commentable, and valid.\n- Mixed numeric and ULID catalogs have a documented deterministic order.\n- Lowercase, wrong-length, ambiguous-character, prefix-mismatched, unsafe, and filename/metadata-mismatched IDs fail closed.\n- A generated identity/path collision never overwrites canonical authority.\n- Existing comment sequencing remains unchanged for numeric and ULID Issue IDs.\n\n## Dependencies And Order\n\nFirst Story in `hrn-00208`; no child dependency. Supplies the shared identifier utility and Issue identity contract required by later Stories.\n\n## Artifacts\n\n- Shared generic-tools identifier utility.\n- Updated Issue implementation, contract, and storage discovery.\n- Focused unit tests.\n- Design authority: `doc-00018` after approval and linking.\n\n## Estimate\n\nM, moderate uncertainty. Main uncertainty is configurable-prefix parsing and the breadth of numeric assumptions in Issue fixtures.\n\n## Non-Goals\n\n- Document lifecycle and cache projection beyond interfaces needed by this Story.\n- Git workspace tools or lifecycle routing.\n- Rewriting existing numeric IDs.\n- Remote-provider IDs.\n- Changing Issue revisions, locks, YAML layout, or comment sequence format.\n\n## Comments\n"
