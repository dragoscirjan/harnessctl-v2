"body": "# Integrate local Documents tools into SDLC and release artifacts\n\n## Goal\n\nMake the repository-local design-document lifecycle usable by existing SDLC Plan on OpenCode and Pi without a Documents agent, generated skill, remote provider, or migration feature.\n\n## Scope\n\n- Put proportionate generation, separately confirmed review/approval, versioning, validation, and approved active-path issue linking into existing SDLC Plan references.\n- Expose identical normalized local tool contracts through thin OpenCode and Pi adapters; no adapter owns persistence, routing, templates, or provider behavior.\n- Keep `sdlc-documents` absent from registries, templates, package resources, smoke checks, generated trees, docs, and tests.\n- Transactionally remove only exact previously managed skill output; preserve modified operator content byte-for-byte with warning.\n- Point current docs and issue links to approved HLD/LLD v4 and describe only the fixed local Documents lifecycle.\n- Rebuild Python and npm artifacts and prove no migration bridge, CLI, bin, resource, streaming transaction, or provenance carrier is packaged.\n- Test with absent and hostile `HOME` values and assert no Documents agent/manifest, generated skill, remote provider output, migration behavior, or user-global configuration read.\n\n## Acceptance Criteria\n\n- [ ] SDLC Plan selects proportionate HLD, LLD, design-overview, or GDD records and uses separately confirmed normalized lifecycle mutations with fresh revisions.\n- [ ] Only approved active document paths are linked after Documents and Issues validation.\n- [ ] OpenCode, Pi, and `all` expose equivalent local Documents tools and results.\n- [ ] No Documents skill or agent is generated, installed, packaged, documented as current, or required for workflow behavior.\n- [ ] Exact managed stale skill output is removed transactionally; modified operator output is preserved with warning under force and non-force.\n- [ ] Absent/hostile `HOME` proves no reads or copies from user-level OpenCode/Pi configuration.\n- [ ] Current documentation explains fixed authority, lifecycle, canonical links, errors, and historical-evidence exclusions without migration or remote-provider guidance.\n- [ ] Installer signatures/help, generic exports, package bins/tarballs, Python artifacts, generated outputs, and current docs contain no migration capability.\n- [ ] Install/reinstall/force/conflict/rollback, ordinary Documents recovery, schema/artifact parity, package, Changeset, stale-surface, full quality, and full build gates pass."
