"body": "Given a Pi project\nWhen harnessctl installs Pi assets with package consent\nThen all SDLC prompts, all configured skills, harnessctl Pi tools, and configured CVS MCP servers are operational.\n\n## Requirements\n\n- Install all 18 prompts under `.pi/prompts/`.\n- Install `caveman`, `cvs`, `issue-tracking`, and `memory` under `.pi/skills/`.\n- Install project-local `@harnessctl/pi-tools` and pinned `pi-mcp-adapter` with explicit consent.\n- Generate `.pi/mcp.json` with configured CVS servers.\n- Enable Pi memory hooks when repository memory is enabled.\n- Preserve prevalidation, rollback, secret, and cross-platform safeguards.\n\n## Acceptance\n\n- [x] Pi prompts and skills match current renderers.\n- [x] Pi tools and MCP adapter package state is verified.\n- [x] Pi MCP configuration matches configured CVS intents.\n- [x] Tests and full quality checks pass."
