"body": "# Revalidate retired Documents skill before deletion\n\n## Defect\n\n`install()` fingerprints exact retired `sdlc-documents/SKILL.md` output during planning, performs unrelated writes, then unlinks the planned file and directory without revalidating identity or bytes. An operator edit or replacement during that interval is deleted.\n\n## Impact\n\nThis violates `hrn-00135` acceptance for preserving modified operator content and `hrn-00139` transactional retired-skill cleanup under force and non-force installs.\n\n## Reproduction\n\nGiven an exact managed retired Documents skill tree, mutate `SKILL.md` from an injected write operation after cleanup planning but before deletion. Installation succeeds and removes the changed tree.\n\n## Likely Cause\n\n`src/harnessctl/install.py` classifies cleanup at lines 146-148, but deletion at lines 519-526 checks only repository containment and does not repeat the historical fingerprint or path identity validation.\n\n## Acceptance Criteria\n\n- Immediately before deletion, revalidate the exact retired file and containing directory identity, type, shape, size, and SHA-256 against the planned owned state.\n- Preserve changed, replaced, nonregular, symlinked, or otherwise unowned state byte-for-byte and emit the deterministic modified-tree warning.\n- Apply equivalent behavior for OpenCode, Pi, `all`, normal, and force installs.\n- Preserve transactional rollback and unrelated repository state.\n- Add deterministic race regressions for file mutation and pathname replacement between planning and deletion.\n- Focused and configured quality/build checks pass before Verify.\n\n## Verify Evidence\n\nFresh `mise run quality` and `mise run build` passed on 2026-08-28, but an independent read-only review reproduced operator-state deletion. No repair occurred during Verify."
