"body": "# Reject invalid document list locations\n\n## Summary\n\nMake `document_list.location` fail fast instead of silently treating unsupported values as an empty result.\n\n## Defect\n\nThe normalized provider and both adapters accept unrestricted strings. Values other than `active` or `archive`, such as `archived`, currently return an empty list.\n\n## Scope\n\n- Validate `location` as exactly `active` or `archive` at the normalized operation boundary.\n- Keep adapter schemas/descriptions consistent with the runtime contract.\n- Preserve omission/default behavior and bounded list semantics.\n- Add generic-tools, OpenCode, and Pi tests for invalid values.\n\n## Acceptance Criteria\n\n- `document_list` accepts omitted/default, `active`, and `archive` locations with current behavior.\n- Every other value returns a deterministic bounded Document error before filesystem/cache access.\n- OpenCode and Pi expose the same accepted values and error behavior.\n- Focused generic-tools and adapter tests pass.\n\n## Verify Evidence\n\nIndependent Verify review round 7: `/tmp/opencode/hrn-00135-verify-review.md`."
