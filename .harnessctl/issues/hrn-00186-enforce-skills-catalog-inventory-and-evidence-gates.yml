    "body": "Build evidence: replaced legacy prose-coupled Skills assertions with source-derived gates. `docs/skills.md` must match the exact eight IDs in `SKILL_IDS`, root templates, nine-field entry contract, OpenCode/Pi activation differences, ownership links, status/evidence fields, resource counts, legacy mappings, and skill/config/module/MCP/tool/permission distinctions. Regenerated `docs/llms.txt` and `docs/llms-full.txt`. Fresh checks passed: 39 docs tests; full `mise run quality`; 714 Python tests; Node, package, ESLint, Ruff, contracts, Mermaid, actionlint, shellcheck, vulture, duplication threshold, deterministic generators, strict MkDocs, Prettier, release artifacts, and Git diff checks. No Verify, Release, remote action, commit, deployment, Epic closure, runtime/config/skill behavior change."
