"body": "# Add Changeset for managed CVS MCP namespace validation\n\n## Defect\n\nPublished `@harnessctl/generic-tools` validation behavior changed for the four harnessctl-managed `sdlc_cvs_*` IDs, but the branch has no Changeset.\n\n## Classification\n\nConfirmed release-readiness metadata omission discovered during Verify. Runtime, quality, build, and package checks pass; repository release policy still blocks delivery without release intent.\n\n## Evidence\n\n- `.changeset/README.md` requires a Changeset for every pull request changing a published package.\n- `extensions/generic-tools/schemas.ts` and the generated JSON Schema now reject the four managed canonical IDs while retaining valid custom IDs.\n- No `.changeset/*.md` release-intent file exists.\n- `npx changeset status --since=main` exits 1: `Some packages have been changed but no changesets were found.`\n- Root `CHANGELOG.md` currently says this work does not change npm packages, contradicting the published validation change.\n- `mise run quality` and `mise run build` pass.\n\n## Scope\n\n- Add one Changeset selecting only `@harnessctl/generic-tools` with the smallest correct semantic-version bump.\n- Describe reservation of the four harnessctl-managed canonical CVS MCP IDs without reserving `sdlc_cvs_custom`.\n- Correct the root changelog statement about npm package impact.\n- Do not manually change package versions, lockfile versions, adapter packages, or unrelated release metadata.\n\n## Acceptance\n\n- [ ] One Changeset selects only `@harnessctl/generic-tools` with the smallest correct bump.\n- [ ] The Changeset accurately describes managed-ID reservation and retained custom-ID compatibility.\n- [ ] Root changelog no longer claims npm packages are unchanged.\n- [ ] `npx changeset status --since=main` passes and reports the intended package release projection.\n- [ ] `mise run quality` and `mise run build` remain green.\n\n## Impact\n\nRelease is blocked. No production correctness, security, or privacy failure is known."
