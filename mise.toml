[settings]
experimental = true
lockfile = true

[tools]

# Node is used by the existing workspace, ESLint, Prettier, Vitest, and jscpd.
[tools.node]
version = "24.15.0"

# Bun verifies that published ESM entrypoints remain runtime-neutral for OpenCode.
[tools.bun]
version = "1.3.13"

# Python and uv are mandatory for the installer and Python quality workflow.
[tools.python]
version = "3.11"

[tools.uv]
version = "latest"

# ShellCheck is used by the repository quality tasks and Husky validation.
[tools."github:koalaman/shellcheck"]
version = "0.11.0"

[tools."github:koalaman/shellcheck".platforms]
linux-x64 = { asset_pattern = "shellcheck-*.linux.x86_64.tar.xz" }
macos-arm64 = { asset_pattern = "shellcheck-*.darwin.aarch64.tar.xz" }
windows-x64 = { asset_pattern = "shellcheck-*.zip" }

# actionlint validates workflow syntax and expressions locally and in CI.
[tools."github:rhysd/actionlint"]
version = "1.7.12"

[tools."github:rhysd/actionlint".platforms]
linux-x64 = { asset_pattern = "actionlint_*_linux_amd64.tar.gz" }
linux-arm64 = { asset_pattern = "actionlint_*_linux_arm64.tar.gz" }
macos-x64 = { asset_pattern = "actionlint_*_darwin_amd64.tar.gz" }
macos-arm64 = { asset_pattern = "actionlint_*_darwin_arm64.tar.gz" }
windows-x64 = { asset_pattern = "actionlint_*_windows_amd64.zip" }

[tasks.setup]
description = "Install Node and uv dependencies"
run = ["npm install", "uv sync"]

[tasks.node-format]
description = "Check Node workspace formatting"
run = "npm run format"

[tasks.node-format-fix]
description = "Format Node workspace sources"
run = "npm run format:fix"

[tasks.python-format]
description = "Format Python sources"
run = "uv run ruff format src tests scripts"

[tasks.python-format-check]
description = "Check Python formatting"
run = "uv run ruff format --check src tests scripts"

[tasks.node-lint]
description = "Lint Node workspace sources"
run = "npm run lint"

[tasks.node-lint-fix]
description = "Fix Node workspace lint findings"
run = "npm run lint:fix"

[tasks.python-lint]
description = "Lint Python sources"
run = "uv run ruff check src tests scripts"

[tasks.python-lint-fix]
description = "Fix Python lint findings"
run = "uv run ruff check src tests scripts --fix"

[tasks.shell-lint]
description = "Lint repository shell scripts"
run = "shellcheck compare-tests.sh .husky/pre-commit .husky/pre-push"

[tasks.node-test]
description = "Run Node workspace tests"
depends = ["node-typecheck"]
run = "npm test"

[tasks.node-typecheck]
description = "Strictly type-check all Node workspaces"
run = "npm run typecheck:strict"

[tasks.node-build]
description = "Build and inspect all publishable Node packages"
run = "npm run packages:check"

[tasks.contracts-check]
description = "Verify generated Config and memory contracts are current"
run = "npm run contracts:check"

[tasks.node-quality]
description = "Run Node type checks, tests, and package inspection sequentially"
depends = ["node-test"]
run = "npm run packages:check"

[tasks.runtime-smoke]
description = "Smoke-test built package entrypoints with Node and Bun"
depends = ["node-build"]
run = ["node scripts/smoke-packages.mjs", "bun scripts/smoke-packages.mjs"]

[tasks.actions-lint]
description = "Validate GitHub Actions workflows"
run = "actionlint"

[tasks.mermaid-check]
description = "Validate Mermaid syntax and accessibility metadata"
run = "npm run mermaid:check"

[tasks.docs-generate]
description = "Generate reference pages and LLM-friendly documentation indexes"
run = ["uv run python scripts/generate_reference_docs.py", "uv run python scripts/generate_llms.py"]

[tasks.docs-build]
description = "Build the documentation website with strict validation"
run = [
  "uv run python scripts/generate_reference_docs.py --check",
  "uv run python scripts/generate_llms.py --check",
  "uv run mkdocs build --strict",
]

[tasks.docs-serve]
description = "Serve the documentation website for local authoring"
depends = ["docs-generate"]
run = "uv run mkdocs serve"

[tasks.python-test]
description = "Run Python tests"
run = "uv run pytest"

[tasks.release-artifacts]
description = "Build and verify isolated Python release artifacts"
run = "uv run pytest tests/test_release_artifacts.py"

[tasks.python-dist]
description = "Build the Python wheel and source distribution"
run = "uv build --out-dir dist"

[tasks.build]
description = "Build and inspect all publishable packages"
depends = ["node-build", "release-artifacts"]

[tasks.node-dupcheck]
description = "Check Node and Python duplication"
run = "npm run dupcheck"

[tasks.python-deadcode]
description = "Find unused Python code"
run = "uv run vulture src tests --min-confidence 80"

[tasks.format]
description = "Check all source formatting"
depends = ["node-format", "python-format-check"]

[tasks.format-fix]
description = "Format all source files"
depends = ["node-format-fix", "python-format"]

[tasks.lint]
description = "Lint all source files"
depends = ["node-lint", "python-lint", "shell-lint"]

[tasks.lint-fix]
description = "Fix all automatic lint findings"
depends = ["node-lint-fix", "python-lint-fix"]

[tasks.test]
description = "Run all unit tests"
depends = ["node-test", "python-test"]

[tasks.quality]
description = "Run Node tests before the remaining parallel quality gates"
run = [
  { task = "node-quality" },
  { tasks = [
    "format",
    "lint",
    "python-test",
    "release-artifacts",
    "node-dupcheck",
    "python-deadcode",
    "actions-lint",
    "mermaid-check",
    "docs-build",
    "contracts-check",
  ] },
]

[tasks.integration]
description = "Run harness integration tests using configured model environments"
run = "npm run test:integration"

[tasks.install-prompts]
description = "Install compiled SDLC prompts into the current project"
run = "uv run python -m harnessctl.install --cwd . --harness all"
