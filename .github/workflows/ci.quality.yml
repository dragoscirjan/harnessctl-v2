name: CI - Quality

on:
  workflow_call:
    inputs:
      runs-on:
        description: GitHub-hosted runner label
        required: true
        type: string
      extended:
        description: Run Linux-only audit and coverage checks
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  quality:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup project
        uses: ./.github/actions/setup

      - name: Run quality gate
        run: mise run quality
        shell: bash

      - name: Build, inspect, and smoke-test packages
        run: mise run runtime-smoke
        shell: bash

      - name: Report dependency vulnerabilities
        if: inputs.extended
        run: npm audit --omit=dev --audit-level=high
        shell: bash

      - name: Upload generic tools coverage
        if: inputs.extended && always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-generic-tools
          path: extensions/generic-tools/coverage/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload OpenCode tools coverage
        if: inputs.extended && always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-opencode-tools
          path: extensions/opencode-tools/coverage/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Pi tools coverage
        if: inputs.extended && always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-pi-tools
          path: extensions/pi-tools/coverage/
          if-no-files-found: warn
          retention-days: 7
